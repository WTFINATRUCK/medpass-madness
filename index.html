<style>
:root{
  --bg:#070b16; --panel:#121a2e; --panel2:#1a2440; --line:#2a3658; --text:#eef2ff; --muted:#8b97b8;
  --sky:#38bdf8; --sky2:#0ea5e9; --green:#22c55e; --red:#ef4444; --gold:#fbbf24;
  --font:'Fredoka', ui-rounded, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--font);color:var(--text);display:flex;justify-content:center;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--panel);overflow:hidden}
@media (min-width:520px){ body{align-items:center} #app{height:min(94vh,920px);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.6)} }

/* ---------- HUD ---------- */
#hud{position:relative;z-index:10;background:linear-gradient(180deg,#10203d,#0b1426);padding:10px 12px 9px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid #1e2a48}
.hud-row{display:flex;align-items:center;gap:10px}
.hud-score,.hud-time{display:flex;flex-direction:column;line-height:1;min-width:64px}
.hud-time{align-items:flex-end}
.lbl{font-size:.6rem;letter-spacing:.14em;color:var(--muted);font-weight:600;margin-bottom:3px}
#score{font-size:1.5rem;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;display:inline-block}
.hud-score.bump #score{animation:bump .35s}
.hud-score.down #score{color:#f87171}
#timer{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
#mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:.9rem}
#mid .mini{display:block;width:90px;height:6px;border-radius:3px;background:#1a2645;overflow:hidden}
#mid .mini i{display:block;height:100%;background:var(--green);transition:width .4s}
#mid .hearts{font-size:.95rem;letter-spacing:1px}
#mute,#pause{background:none;border:none;font-size:1.05rem;padding:4px;cursor:pointer;opacity:.85}
#pause{display:none}
#hud.live #pause{display:block}
#pauseOv{position:absolute;inset:0;z-index:60;background:rgba(5,9,20,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:30px;animation:fadeUp .25s}
#pauseOv h2{font-size:2.4rem;text-shadow:0 4px 0 #0369a1}
#pauseOv p{color:var(--muted);font-size:.9rem;text-align:center;margin-bottom:6px}
#pauseOv .btn{max-width:300px}
.field{width:100%;font-family:ui-monospace,Menlo,monospace;font-size:.72rem;background:#0b1222;color:#cbd5e1;border:1px solid var(--line);border-radius:10px;padding:8px;resize:none;margin:6px 0 8px;user-select:text;-webkit-user-select:text}
.set-row{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.set-row b{display:block;margin-bottom:2px}
.set-row p{font-size:.78rem;color:var(--muted);line-height:1.3}
.set-row .actions .btn{padding:10px;font-size:.92rem}
.fine{font-size:.7rem;color:var(--muted);text-align:center;line-height:1.4;margin-top:4px}
.fine a{color:var(--sky)}
.timebar{height:7px;background:#1a2645;border-radius:4px;margin-top:8px;overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#16a34a,#86efac);transition:width .2s linear}
#hud.endless .timebar i{background:linear-gradient(90deg,#7c3aed,#c4b5fd)}
#hud.warn .timebar i{background:linear-gradient(90deg,#d97706,var(--gold))}
#hud.danger .timebar i{background:linear-gradient(90deg,#b91c1c,#f87171)}
#hud.danger #timer{color:#f87171;animation:pulse .5s infinite}
.streak{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%) scale(0);background:linear-gradient(90deg,#f97316,#ef4444);padding:3px 11px;border-radius:99px;font-size:.75rem;font-weight:700;transition:transform .25s;z-index:12;white-space:nowrap;box-shadow:0 4px 12px rgba(239,68,68,.4)}
.streak.on{transform:translateX(-50%) scale(1)}
.streak.pop{animation:streakPop .5s}

/* ---------- Stage ---------- */
#stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.scene{position:relative;flex:1 1 auto;min-height:150px;overflow:hidden;background:#000}
.scene.fade-in{animation:fadeIn .55s ease-out}
.layer{position:absolute;inset:0}
.layer>img{width:100%;height:100%;object-fit:cover;display:block;will-change:transform}
.sheet{flex:0 0 auto;position:relative;z-index:5;background:var(--panel);border-radius:22px 22px 0 0;margin-top:-20px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.sheet:empty{display:none}
.sheet.in{animation:sheetIn .38s cubic-bezier(.2,.9,.3,1.15)}
.sheet.scroll{max-height:66dvh;max-height:66vh;overflow-y:auto}
#fx{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}
#toasts{position:absolute;left:0;right:0;bottom:120px;display:flex;flex-direction:column-reverse;align-items:center;gap:6px;z-index:26;pointer-events:none}
.toast{background:rgba(8,14,30,.9);border:1px solid rgba(255,255,255,.18);padding:6px 13px;border-radius:99px;font-size:.84rem;font-weight:600;animation:toast 2.6s forwards;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.toast.bad{border-color:#ef4444;color:#fecaca}
#stage.danger::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:15;box-shadow:inset 0 0 70px rgba(239,68,68,.6);animation:pulse 1s infinite}
.sheet-h{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:2px 2px 8px;gap:8px}
.sheet-h b{color:var(--text);font-size:.85rem;letter-spacing:.04em}

/* ---------- Buttons ---------- */
.btn{border:none;border-radius:16px;padding:14px 16px;font-size:1.05rem;font-weight:700;color:#fff;background:var(--sky2);box-shadow:0 5px 0 #0369a1;cursor:pointer;width:100%;transition:transform .08s,box-shadow .08s,filter .2s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0369a1}
.btn.big{font-size:1.2rem;padding:16px}
.btn small{font-size:.8rem;opacity:.8;margin-left:6px}
.btn.green{background:var(--green);box-shadow:0 5px 0 #15803d}
.btn.green:active{box-shadow:0 1px 0 #15803d}
.btn.hold{background:#dc2626;box-shadow:0 5px 0 #991b1b;flex:0 0 38%}
.btn.hold:active{box-shadow:0 1px 0 #991b1b}
.btn.hold.urge{animation:urge .55s infinite}
.btn.purple{background:#7c3aed;box-shadow:0 5px 0 #5b21b6}
.btn.gold{background:#d97706;box-shadow:0 5px 0 #92400e}
.btn.ghost{background:#24304f;box-shadow:0 5px 0 #141c33}
.btn:disabled{filter:grayscale(1) brightness(.55);cursor:default}
.btn:disabled:active{transform:none}
.btn.ready{animation:ready 1s infinite}
.btn.pulse{animation:ready 1.4s infinite}
.actions{display:flex;gap:10px}

/* ---------- Menus ---------- */
.kb>img{animation:kenburns 16s ease-in-out infinite alternate;transform-origin:62% 35%}
.shade{background:linear-gradient(180deg,rgba(7,11,22,.1) 30%,rgba(7,11,22,.85))}
.title{position:absolute;left:0;right:0;bottom:34px;text-align:center;padding:0 16px}
.logo{font-size:2.9rem;font-weight:700;line-height:.92;text-shadow:0 4px 0 #0369a1,0 10px 30px rgba(0,0,0,.6);animation:logoIn .8s cubic-bezier(.2,1.4,.4,1) both}
.logo em{font-style:normal;color:var(--gold);text-shadow:0 4px 0 #b45309,0 10px 30px rgba(0,0,0,.6);display:inline-block;animation:wiggle 2.4s ease-in-out 1s infinite}
.tagline{margin-top:10px;color:#e0f2fe;font-weight:500;text-shadow:0 2px 8px #000;animation:fadeUp .6s .4s both}
.scene-title{position:absolute;left:0;right:0;top:18px;text-align:center;font-size:1.8rem;font-weight:700;text-shadow:0 3px 0 #0369a1,0 8px 20px rgba(0,0,0,.6);animation:dropIn .4s both}
.scene-title small{display:block;font-size:.85rem;color:#e0f2fe;font-weight:500;text-shadow:0 2px 6px #000}
.menu{display:flex;flex-direction:column;gap:12px}
.row2{display:flex;gap:10px}
.coins{display:inline-flex;align-items:center;gap:6px;background:#2a2410;border:1px solid #a16207;color:var(--gold);font-weight:700;padding:4px 12px;border-radius:99px;font-size:.9rem}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.best-line{text-align:center;color:var(--muted);font-size:.82rem}
.unit{margin-bottom:14px;animation:chipIn .3s both}
.signoffs{display:grid;gap:6px}
button.so{width:100%;text-align:left;color:inherit;font:inherit;cursor:pointer;box-shadow:0 3px 0 #0b1222}
.so.locked{opacity:.5}
.so.nextup{border-color:var(--gold);animation:chipIn .3s both,urge 1.4s infinite 1s}
.so .s3{font-size:.8rem;color:var(--gold)} .so .s3 .off{color:#3b4766}
.pchip.pre{display:flex;align-items:center;gap:10px;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:8px 10px;margin-bottom:12px;color:inherit;font:inherit;text-align:left;cursor:pointer}
.pchip.pre img{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:top}
.pchip.pre small{display:block;color:var(--muted);font-size:.72rem}
.beat{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;animation:chipIn .35s both}
.beat img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:top;flex:0 0 auto;border:2px solid var(--gold)}
.beat b{font-size:.8rem;color:var(--gold)} .beat p{font-size:.92rem;line-height:1.35;margin-top:2px}
.beat.tip img{width:34px;height:34px;border-color:var(--sky)} .beat.tip b{color:var(--sky)} .beat.tip p{font-size:.84rem;color:#dbe4f5}
.beat.in{margin-bottom:12px}
.sit{font-size:.95rem}
.choices{display:grid;gap:8px}
.choice{text-align:left;font-size:.95rem;padding:12px 14px;line-height:1.25}
.tav{width:20px;height:20px;border-radius:50%;object-fit:cover;object-position:top;vertical-align:middle;margin-right:2px}
.dana{position:absolute;left:3%;right:3%;bottom:6px;z-index:20;background:rgba(15,23,42,.96);border:2px solid #f59e0b;border-radius:16px;padding:10px 12px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:popIn .35s both;color:#fff}
.dana-h{display:flex;gap:8px;align-items:center}
.dav{width:34px;height:34px;border-radius:50%;background:#7c2d12;display:grid;place-items:center;font-size:1.2rem}
.dana-h b{font-size:.9rem} .dana-h small{display:block;color:var(--muted);font-size:.7rem}
.dana p{font-size:.92rem;font-weight:600;margin:6px 0 8px;line-height:1.3}
.dana-a{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.dana-a button{background:#24304f;color:#fff;border:0;border-radius:10px;padding:9px 4px;font:inherit;font-size:.78rem;font-weight:700;box-shadow:0 3px 0 #141c33;cursor:pointer}
.dana-a button:first-child{background:var(--green);box-shadow:0 3px 0 #15803d}
.intr{position:absolute;inset:0;z-index:40;background:var(--panel);border-radius:22px 22px 0 0;padding:16px 14px;display:flex;flex-direction:column;justify-content:center;gap:10px;animation:popIn .3s both}
.intr-h{font-weight:800;color:#f59e0b;letter-spacing:.04em}
.intr p{font-size:1rem;line-height:1.35}
.intr-a{display:grid;gap:8px}
.intr-a .btn{text-align:left;font-size:.95rem}
.sbar-slots{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.slot{background:#0f172a;border:2px dashed #3b4766;border-radius:10px;padding:5px 2px;text-align:center}
.slot b{display:block;font-size:1.1rem;color:#64748b} .slot span{font-size:.6rem;color:var(--muted)}
.slot.on{border-style:solid;border-color:var(--green);background:#052e16} .slot.on b{color:var(--green)}
.sbar-cards{display:grid;gap:6px}
.scard{background:var(--panel2);border:1px solid var(--line);color:#fff;border-radius:12px;padding:9px 11px;font:inherit;font-size:.85rem;text-align:left;line-height:1.3;cursor:pointer;box-shadow:0 3px 0 #0b1222}
.scard.used{opacity:.25} .scard.nope{opacity:.35;text-decoration:line-through}
.so{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.86rem;animation:chipIn .3s both}
.so b{width:24px;height:24px;border-radius:50%;background:#24304f;display:grid;place-items:center;font-size:.75rem}
.so em{font-style:normal;font-size:.7rem;color:var(--muted)}
.frame-card{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;line-height:1.45}
.frame-card p{font-size:.95rem;margin-bottom:10px}
.frame-card .frame-fine{font-size:.8rem;color:var(--muted);margin:0}
.unit-h{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:7px}
.unit-h .ui{font-size:1.4rem}
.unit-h small{color:var(--muted);font-weight:500;font-size:.72rem;display:block}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:9px 4px;text-align:center;box-shadow:0 4px 0 #0b1222;cursor:pointer}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1222}
.lv b{font-size:1.25rem;display:block;line-height:1.1}
.lv .s3{color:var(--gold);letter-spacing:1px;font-size:.95rem}
.lv .s3 .off{color:#334155}
.lv.locked{opacity:.4}
.lv.nextup{border-color:var(--sky);animation:ready 1.4s infinite}
.goal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.goal div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.goal b{display:block;font-size:1.15rem}
.goal span{font-size:.64rem;color:var(--muted)}
.targets{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:12px;font-size:.85rem}
.targets div{display:flex;justify-content:space-between;padding:4px 0}
.targets .s{color:var(--gold)}
.newskill{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#3b0764,#1e1b4b);border:1px solid #7c3aed;border-radius:14px;padding:10px 12px;margin-bottom:12px;animation:chipIn .35s both}
.newskill>span{font-size:1.9rem}
.newskill b{display:block;font-size:.95rem}
.newskill p{font-size:.8rem;color:#ddd6fe;line-height:1.3}
.upg{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:9px 10px;margin-bottom:8px;animation:chipIn .3s both}
.upg .ic{font-size:1.6rem;width:32px;text-align:center}
.upg .tx{flex:1;min-width:0}
.upg .tx b{display:block;font-size:.95rem}
.upg .tx p{font-size:.74rem;color:var(--muted);line-height:1.2}
.pp i{display:inline-block;width:16px;height:6px;border-radius:3px;background:#334155;margin:4px 3px 0 0}
.pp i.on{background:var(--green)}
.upg .btn{width:auto;flex:0 0 auto;padding:9px 12px;font-size:.88rem}

/* ---------- Hallway map hub ---------- */
.map{position:absolute;inset:0;overflow:hidden;background:#b9d9c8;background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1px);background-size:14px 14px}
.corridor{position:absolute;left:34%;right:34%;top:0;bottom:0;background:repeating-linear-gradient(0deg,#9fb6cc 0 2px,#adc4d9 2px 38px);box-shadow:inset 7px 0 0 #3b78b3,inset -7px 0 0 #3b78b3}
.station{position:absolute;left:29%;right:29%;bottom:6%;height:8%;background:linear-gradient(#f5e7cf,#e0c9a2);border:3px solid #b08b5a;border-radius:12px;display:grid;place-items:center;color:#5b4126;font-weight:700;font-size:.78rem;box-shadow:0 5px 0 #8a6a40}
.room{position:absolute;width:32%;height:19%;transform:translateY(-50%);background:linear-gradient(#f6eddc,#e8d9bf);border:3px solid #8fb09d;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:4px;transition:border-color .2s,box-shadow .2s;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.room.L{left:1.5%}.room.R{right:1.5%}
.room::after{content:'';position:absolute;top:24%;bottom:24%;width:8px;background:linear-gradient(#b67a43,#8f5a2c);border-radius:3px}
.room.L::after{right:-6px}.room.R::after{left:-6px}
.rm-top{display:flex;gap:5px;align-items:center;font-size:.78rem;font-weight:700;color:#334155}
.bulb{width:11px;height:11px;border-radius:50%;background:#94a3b8;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.ring{position:relative;width:52px;height:52px;border-radius:50%;padding:4px;display:block;background:rgba(0,0,0,.08)}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 22%;display:block;border:2px solid #fff;filter:grayscale(.75) brightness(.92);transition:filter .3s}
.rm-ico{position:absolute;right:-8px;bottom:-5px;font-size:.9rem;background:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.25);transform:scale(0);transition:transform .3s cubic-bezier(.2,1.5,.4,1)}
.rm-name{font-size:.66rem;color:#475569;font-weight:600;white-space:nowrap}
.rm-q{position:absolute;top:-11px;width:28px;height:28px;border-radius:50%;background:var(--sky2);color:#fff;font-weight:700;display:grid;place-items:center;border:3px solid #fff;transform:scale(0);transition:transform .25s cubic-bezier(.2,1.5,.4,1);box-shadow:0 3px 8px rgba(0,0,0,.3)}
.room.L .rm-q{right:-11px}.room.R .rm-q{left:-11px}
.room.call{border-color:#f59e0b;animation:callPulse 1.2s infinite}
.room.call .bulb{background:#fbbf24;box-shadow:0 0 10px 3px rgba(251,191,36,.85);animation:blink .9s infinite}
.room.call .ring{background:conic-gradient(var(--rc,#22c55e) calc(var(--p,1)*1turn),rgba(0,0,0,.12) 0)}
.room.call .ring img{filter:none}
.room.call .rm-ico{transform:scale(1)}
.room.urgent{border-color:#ef4444}
.room.urgent .bulb{background:#ef4444;box-shadow:0 0 12px 4px rgba(239,68,68,.9);animation:blink .35s infinite}
.room.urgent .ring{animation:wobble .4s infinite}
.room.q{border-color:var(--sky2);box-shadow:0 0 0 4px rgba(14,165,233,.4),0 4px 0 rgba(0,0,0,.12);animation:none}
.room.q .rm-q{transform:scale(1)}
.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.route polyline{fill:none;stroke:#0284c7;stroke-width:4;stroke-dasharray:2 10;stroke-linecap:round;stroke-linejoin:round;animation:dash .6s linear infinite;opacity:.9}
.nurse{position:absolute;left:0;top:0;width:48px;height:48px;z-index:5;will-change:transform;pointer-events:none}
.nurse .face{position:absolute;inset:0;border-radius:50%;background-size:124px auto;background-position:-16px -34px;border:3px solid #fff;box-shadow:0 5px 12px rgba(0,0,0,.35),0 0 0 3px #2563eb}
.nurse .minicart{position:absolute;width:22px;height:26px;left:36px;top:18px;background:linear-gradient(#f8fafc,#cbd5e1);border:2px solid #64748b;border-radius:5px;box-shadow:inset 0 7px 0 -4px #3b82f6,inset 0 14px 0 -11px #3b82f6,0 3px 6px rgba(0,0,0,.3)}
.nurse.walk .face{animation:step .32s ease-in-out infinite alternate}
.coach{position:absolute;z-index:7;background:#fff;color:#0f172a;font-weight:700;padding:6px 11px;border-radius:12px;font-size:.84rem;white-space:nowrap;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.3);display:none}
.coach.on{display:block;animation:coach .6s ease-in-out infinite alternate}
.hub-tip{font-size:.9rem;font-weight:600;color:#dbe4f5;text-align:center;min-height:22px;line-height:1.3}
.hub-tip small{display:block;font-size:.72rem;color:var(--muted);font-weight:500}

/* ---------- Door ---------- */
.door-wrap{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .6s cubic-bezier(.55,0,.85,.4),filter .6s}
.door-wrap.approach{animation:approach .45s ease-out backwards}
.door-wrap.enter{transform:scale(2.5);filter:brightness(1.35)}
.wall{position:absolute;inset:0;background:linear-gradient(180deg,#d3ecdf 0%,#c3e3d3 80%,#eadcc5 80%,#eadcc5 82%,#a8bdd1 82%,#8ea6be 100%)}
.wall::before{content:'';position:absolute;left:0;right:0;top:57%;height:12px;background:linear-gradient(#5b9bd5,#3b78b3);border-radius:6px;box-shadow:0 3px 4px rgba(0,0,0,.15)}
.frame{position:absolute;left:16%;right:16%;top:8%;bottom:18%;border:12px solid #7c5530;border-bottom:none;border-radius:8px 8px 0 0;overflow:hidden;perspective:1100px;background:#1a1410;box-shadow:0 0 0 3px rgba(0,0,0,.12),0 18px 40px rgba(0,0,0,.25)}
.room-in{position:absolute;inset:0}
.room-in img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);transition:transform 1.2s ease-out}
.door-wrap.open .room-in img{transform:scale(1)}
.leaf{position:absolute;inset:0;transform-origin:left center;transition:transform .7s cubic-bezier(.45,0,.2,1);background:linear-gradient(90deg,#a86d3a,#c88c52 45%,#b27741 80%,#9a6334);box-shadow:inset -8px 0 14px rgba(0,0,0,.18),inset 6px 0 10px rgba(255,255,255,.08);backface-visibility:hidden}
.door-wrap.open .leaf{transform:rotateY(-100deg)}
.leaf.knocked{animation:knock .4s}
.pnl{position:absolute;left:13%;right:13%;border:3px solid rgba(0,0,0,.14);border-radius:8px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.07)}
.pnl.a{top:36%;height:20%}.pnl.b{top:62%;height:32%}
.plaque{position:absolute;left:50%;top:9%;transform:translateX(-50%);background:linear-gradient(#1d4ed8,#1e3a8a);border:3px solid #dbeafe;border-radius:10px;padding:5px 14px 6px;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.3);white-space:nowrap}
.plaque b{display:block;font-size:1.8rem;line-height:1}
.plaque span{font-size:.72rem;color:#dbeafe}
.knob{position:absolute;right:9%;top:52%;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f8fafc,#64748b)}
.knob::after{content:'';position:absolute;right:8px;top:6px;width:30px;height:8px;border-radius:4px;background:linear-gradient(#e2e8f0,#64748b)}
.bubble{position:absolute;left:50%;top:3%;transform:translateX(-50%) scale(0);background:#fff;color:#0f172a;font-weight:700;padding:6px 14px;border-radius:16px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:3;--tx:-50%}
.bubble.show{animation:popIn .3s forwards}
.skip{position:absolute;right:12px;bottom:12px;font-size:.75rem;color:#fff;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:99px;z-index:4}

/* ---------- Room ---------- */
.room-l>img{transition:transform 1s cubic-bezier(.3,0,.2,1),filter .4s}
.room-l>img.dim{filter:brightness(.78) saturate(.9)}
.room-l>img.zoom{transform:scale(1.38)}
.room-l>img.held{filter:grayscale(.8) brightness(.6)}
.pt-banner{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:10px;background:rgba(8,14,30,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:8px 10px;animation:dropIn .45s .15s both;z-index:2}
.pt-banner img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 22%;border:3px solid var(--green);flex:none}
.pt-banner b{display:block;font-size:.98rem;line-height:1.1}
.pt-banner span{font-size:.74rem;color:#cbd5e1}
.pt-tags{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.allergy{background:#7f1d1d;border:1px solid var(--red);color:#fecaca!important;font-size:.66rem!important;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;animation:pulse 1.4s infinite}
.nka{background:#14532d;border:1px solid var(--green);color:#bbf7d0!important;font-size:.66rem!important;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.ktag{background:#1e3a8a;border:1px solid #60a5fa;color:#dbeafe!important;font-size:.66rem!important;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.say{position:absolute;right:14px;top:80px;max-width:62%;background:#fff;color:#0f172a;font-weight:600;font-size:.86rem;padding:7px 11px;border-radius:14px 14px 4px 14px;box-shadow:0 6px 16px rgba(0,0,0,.3);transform:scale(0);transform-origin:100% 100%;z-index:2}
.say.show{animation:popIn .35s forwards}
.mar{background:#f8fafc;color:#0f172a;border-radius:12px;padding:7px 12px;border-left:7px solid var(--sky2);background-image:repeating-linear-gradient(0deg,transparent 0 21px,#e2e8f0 21px 22px)}
.mar-row{display:flex;align-items:center;gap:10px}
.mar-h{font-size:.6rem;font-weight:700;color:#475569;letter-spacing:.1em;line-height:1.2;flex:none}
.mar-d{font-size:1.02rem;font-weight:700;line-height:1.2}
.mar-d small{display:block;font-size:.72rem;font-weight:600;color:#475569}
.mar-l{font-size:.8rem;font-weight:600;padding:2px 0;display:flex;justify-content:space-between;gap:8px}
.mar-l em{font-style:normal;color:#475569;font-size:.72rem;white-space:nowrap}
.cart{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bottle{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:linear-gradient(180deg,#22305a,#18223b);border:2px solid var(--line);text-align:left;cursor:pointer;box-shadow:0 5px 0 #0b1222;min-height:70px;animation:binIn .35s both;transition:transform .08s,box-shadow .08s}
.bottle:active{transform:translateY(4px);box-shadow:0 1px 0 #0b1222}
.mini{position:relative;flex:none;width:26px;height:44px}
.mini::before{content:'';position:absolute;left:1px;right:1px;top:0;height:11px;border-radius:3px;background:var(--cap);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.mini::after{content:'';position:absolute;left:0;right:0;top:10px;bottom:0;border-radius:5px;background:linear-gradient(90deg,#c2410c,#fb923c 50%,#c2410c)}
.mini i{position:absolute;left:3px;right:3px;top:21px;height:13px;background:#fff;border-radius:2px;z-index:1}
.mini.pen::after{background:linear-gradient(90deg,#64748b,#e2e8f0 50%,#64748b);border-radius:8px}
.mini.juice::after{background:linear-gradient(90deg,#ea580c,#fdba74 50%,#ea580c)}
.bl{display:flex;flex-direction:column;line-height:1.08;min-width:0}
.bl b{font-size:.9rem;overflow-wrap:anywhere}
.bl b.long{font-size:.76rem}
.bl em{font-style:normal;font-size:1.15rem;font-weight:700;color:var(--sky)}
.erTag{position:absolute;right:6px;top:6px;background:#dc2626;color:#fff;font-size:.56rem;font-weight:700;padding:1px 5px;border-radius:4px;letter-spacing:.04em}
.bottle.right{border-color:var(--green);background:#0f2f1e;animation:liftOut .55s forwards}
.bottle.nope{border-color:var(--red);background:#3a0f12;animation:shakeX .4s;opacity:.55}
.bottle.nope::after{content:'✕';position:absolute;right:8px;bottom:4px;color:var(--red);font-weight:700;font-size:1.3rem}
.lcd{font-family:ui-monospace,Menlo,monospace;background:#0b2e1a;color:#4ade80;border-radius:12px;padding:6px 12px;font-size:1.9rem;font-weight:700;text-align:center;border:3px solid #334155;text-shadow:0 0 10px rgba(74,222,128,.6);margin-bottom:10px}
.lcd small{font-size:.8rem;color:#86efac}
.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:10px}
.scale div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 2px;text-align:center;font-size:.66rem;color:var(--muted)}
.scale b{display:block;font-size:.8rem;color:var(--text)}
.pain{display:flex;gap:3px;margin:8px 0 4px}
.pain i{flex:1;height:16px;border-radius:4px;background:#1e293b;font-style:normal;font-size:.6rem;display:grid;place-items:center;color:#475569}
.pain i.on{color:#fff}
.assess{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.medcard{display:flex;align-items:center;gap:12px;background:#f8fafc;color:#0f172a;border-radius:14px;padding:12px;margin-bottom:10px;position:relative}
.medcard b{font-size:1.15rem;display:block}
.medcard .sticker{display:inline-block;margin-top:4px;background:#dc2626;color:#fff;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:6px;transform:rotate(-3deg)}
.medcard .mini{transform:scale(1.2)}
.note{font-size:.84rem;color:#dbe4f5;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.mortar{display:grid;place-items:center;width:136px;height:136px;margin:4px auto 12px;border-radius:50%;border:none;cursor:pointer;background:conic-gradient(var(--green) calc(var(--p,0)*1turn),#1e293b 0);box-shadow:0 6px 0 #0b1222}
.mortar span{width:114px;height:114px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:3.3rem}
.mortar.hit span{animation:grind .14s}

/* ---------- 5 Rights ---------- */
.chips{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:6px 10px;cursor:pointer;animation:chipIn .3s both;transition:background .2s,border-color .2s,transform .1s}
.chip:active{transform:scale(.98)}
.chip .ic{font-size:1.15rem;width:26px;text-align:center;flex:none}
.chip .tx{flex:1;min-width:0}
.chip .tx>b{font-size:.82rem;display:block;margin-bottom:1px}
.cmp{display:flex;gap:10px;font-size:.78rem;color:#dbe4f5;line-height:1.15}
.cmp>span{flex:1;min-width:0}
.cmp small{display:block;font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip .st{width:26px;height:26px;border-radius:50%;border:2px dashed #475569;display:grid;place-items:center;font-size:.9rem;font-weight:700;flex:none}
.chip.ok{background:#0f2f1e;border-color:var(--green)}
.chip.ok .st{border:none;background:var(--green);animation:stamp .3s}
.chip.ok .st::after{content:'✓'}
.chip.bad{background:#3a0f12;border-color:var(--red);animation:shakeX .4s}
.chip.bad .st{border:none;background:var(--red);animation:stamp .3s}
.chip.bad .st::after{content:'!'}
.chip.scanned .tx>b::after{content:' 📟';font-size:.7rem}

/* ---------- Tally / results ---------- */
.tally{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-bottom:12px}
.trow{display:flex;justify-content:space-between;padding:6px 0;font-size:.92rem;animation:rowIn .3s both;border-bottom:1px dashed #2d3b63}
.trow:last-child{border-bottom:none}
.trow b{color:var(--gold);font-variant-numeric:tabular-nums}
.trow.total{font-size:1.05rem;font-weight:700}
.trow.neg b{color:#f87171}
.msg{font-size:.9rem;color:#dbe4f5;line-height:1.35;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.okc{color:var(--green)!important}
.badc{color:#f87171!important}
.goldc{color:var(--gold)!important}
.end-shade{background:linear-gradient(180deg,rgba(7,11,22,.35),rgba(7,11,22,.85))}
.end-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12px}
.et{font-size:2.2rem;font-weight:700;text-shadow:0 4px 0 #0369a1,0 10px 30px rgba(0,0,0,.6);animation:logoIn .7s both}
.et small{display:block;font-size:.9rem;color:#e0f2fe;text-shadow:0 2px 6px #000}
.stars{margin-top:8px;font-size:3rem;letter-spacing:4px}
.stars span{display:inline-block;color:#334155;text-shadow:0 3px 0 #0f172a;animation:starIn .45s both}
.stars span.on{color:var(--gold);text-shadow:0 3px 0 #b45309,0 0 20px rgba(251,191,36,.6)}
.newbest{margin-top:6px;background:linear-gradient(90deg,#f97316,#ef4444);padding:4px 14px;border-radius:99px;font-weight:700;animation:popIn .4s 1.1s both, pulse 1s 1.5s infinite}
.final{text-align:center;margin-bottom:10px}
.final small{display:block;font-size:.62rem;letter-spacing:.14em;color:var(--muted)}
.final b{display:block;font-size:2.5rem;color:var(--gold);line-height:1.05;font-variant-numeric:tabular-nums}
.final span{font-size:.82rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.stats div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;animation:chipIn .3s both}
.stats b{display:block;font-size:1.25rem}
.stats span{font-size:.6rem;color:var(--muted);line-height:1.1;display:block}

/* ---------- FX ---------- */
.float{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:1.25rem;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 12px rgba(0,0,0,.4)}
.float.good{color:#4ade80}.float.bad{color:#f87171}.float.gold{color:var(--gold);font-size:1.7rem}
.spark{position:absolute;width:9px;height:9px;border-radius:50%}
.confetti{position:absolute;top:-12px;width:8px;height:13px;border-radius:2px}
.banner{position:absolute;left:50%;transform:translate(-50%,-50%);font-size:2.3rem;font-weight:700;white-space:nowrap;color:#fff;text-shadow:0 4px 0 #0369a1,0 10px 30px rgba(0,0,0,.6);animation:bannerIn 1.2s forwards}
.banner.good{color:#4ade80;text-shadow:0 4px 0 #15803d,0 10px 30px rgba(0,0,0,.6)}
.banner.bad{color:#f87171;text-shadow:0 4px 0 #991b1b,0 10px 30px rgba(0,0,0,.6)}
.banner.goldb{color:var(--gold);text-shadow:0 4px 0 #b45309,0 10px 30px rgba(0,0,0,.6)}
.banner.count{font-size:5rem}
.flash{position:absolute;inset:0;background:#fff;animation:flash .45s forwards}
.cup{position:absolute;width:40px;height:36px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.cup::before{content:'';position:absolute;inset:0;clip-path:polygon(0 0,100% 0,84% 100%,16% 100%);background:radial-gradient(circle at 34% 22%,#f472b6 0 5px,transparent 6px),radial-gradient(circle at 62% 26%,#fbbf24 0 5px,transparent 6px),radial-gradient(circle at 48% 12%,#fff 0 4px,transparent 5px),linear-gradient(#ffffff,#d6e0ee)}
.cup.syr::before{clip-path:none;inset:14px 0;border-radius:4px;background:linear-gradient(90deg,#f97316 0 18%,#e2e8f0 18% 78%,#94a3b8 78% 84%,#cbd5e1 84%)}
#app.shake{animation:shake .4s}

/* ---------- Keyframes ---------- */
@keyframes pulse{50%{opacity:.55}}
@keyframes blink{50%{opacity:.35}}
@keyframes bump{40%{transform:scale(1.3)}}
@keyframes streakPop{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.45)}100%{transform:translateX(-50%) scale(1)}}
@keyframes sheetIn{from{transform:translateY(60%);opacity:0}}
@keyframes fadeIn{from{opacity:0;filter:brightness(2.2)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
@keyframes chipIn{from{opacity:0;transform:translateY(10px)}}
@keyframes rowIn{from{opacity:0;transform:translateX(-14px)}}
@keyframes binIn{from{opacity:0;transform:scale(.7)}}
@keyframes liftOut{40%{transform:translateY(-14px) scale(1.06)}100%{transform:translateY(-30px) scale(.9);opacity:0}}
@keyframes shakeX{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(4px,0)}}
@keyframes stamp{from{transform:scale(2.2);opacity:0}}
@keyframes ready{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25);transform:scale(1.02)}}
@keyframes urge{50%{transform:scale(1.06);filter:brightness(1.3)}}
@keyframes logoIn{from{opacity:0;transform:scale(.4) rotate(-6deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-4deg)}20%{transform:rotate(4deg)}30%{transform:rotate(0)}}
@keyframes kenburns{from{transform:scale(1.05)}to{transform:scale(1.22) translate(-2%,1%)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-16px)}}
@keyframes popIn{from{transform:translateX(var(--tx,0)) scale(0)}70%{transform:translateX(var(--tx,0)) scale(1.12)}to{transform:translateX(var(--tx,0)) scale(1)}}
@keyframes approach{from{transform:scale(.8);filter:brightness(.8)}}
@keyframes knock{15%,55%{transform:scale(1.012) translateX(-3px)}30%,70%{transform:scale(1)}}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4) rotate(-8deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1;transform:translate(-50%,-50%) scale(1.04) rotate(-4deg)}100%{opacity:0;transform:translate(-50%,-80%) scale(1.04) rotate(-4deg)}}
@keyframes flash{from{opacity:.85}to{opacity:0}}
@keyframes starIn{from{opacity:0;transform:scale(3) rotate(40deg)}}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}10%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
@keyframes callPulse{50%{box-shadow:0 0 0 5px rgba(245,158,11,.35),0 4px 0 rgba(0,0,0,.12)}}
@keyframes wobble{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes dash{to{stroke-dashoffset:-12}}
@keyframes step{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-3px) rotate(4deg)}}
@keyframes coach{from{transform:translate(-50%,-100%)}to{transform:translate(-50%,calc(-100% - 6px))}}
@keyframes grind{50%{transform:rotate(-12deg) scale(.94)}}
@media (prefers-reduced-motion:reduce){
  #app.shake,.kb>img,.room.call,.room.urgent .ring{animation:none!important}
}

/* ---------- v3: characters, profile, daily ---------- */
.rm-mood{position:absolute;left:-9px;top:-7px;font-size:.95rem;background:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.25);transform:scale(0);transition:transform .3s cubic-bezier(.2,1.5,.4,1)}
.room.call .rm-mood{transform:scale(1)}
.rm-name{font-size:.7rem}
.nurse .face{background-size:cover!important;background-position:center 20%!important}
.room-bg>img{filter:blur(6px) brightness(.55) saturate(1.1);transform:scale(1.12)}
.room-shade{background:linear-gradient(180deg,rgba(7,11,22,.15),rgba(7,11,22,.55))}
.bigres{position:absolute;right:6%;top:84px;bottom:16px;aspect-ratio:1/1;max-width:56%;border-radius:24px;overflow:hidden;border:4px solid #fff;box-shadow:0 14px 34px rgba(0,0,0,.5);background:#fff;animation:popIn .45s .1s both;z-index:1}
.bigres img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .4s}
.bigres.give{animation:happy .7s}
.bigres.held img{filter:grayscale(.7) brightness(.8)}
.meav{position:absolute;left:5%;bottom:16px;height:44%;max-height:150px;min-height:70px;aspect-ratio:1/1;border-radius:18px;overflow:hidden;border:3px solid var(--sky);box-shadow:0 10px 24px rgba(0,0,0,.45);animation:dropIn .4s .2s both;z-index:1}
.meav img{width:100%;height:100%;object-fit:cover;object-position:center 20%;display:block}
.meav span{position:absolute;left:0;right:0;bottom:0;background:rgba(3,105,161,.88);font-size:.62rem;font-weight:700;text-align:center;padding:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.say{left:5%;right:auto;top:84px;max-width:40%;border-radius:14px 14px 14px 4px;transform-origin:0 100%}
.pt-id{min-width:0}
.pt-id b{display:block;font-size:.98rem;line-height:1.15}
.pt-id b i{font-style:normal;color:var(--gold);font-size:.85rem}
.pt-id span{font-size:.72rem;color:#cbd5e1}
.mar-who{color:#0369a1!important;font-weight:700!important}
.chip{padding:5px 9px}
.chip .tx>b{font-size:.8rem}
.cmp{font-size:.8rem}
.cmp small{font-size:.6rem}
.chips.flagging .chip:not(.ok):not(.bad){border-color:#f59e0b;cursor:pointer;animation:flagPulse 1s infinite}
.chips:not(.flagging) .chip{cursor:default}
.chips:not(.flagging) .chip:active{transform:none}
.chip .st{display:none}
.chip.ok .st,.chip.bad .st{display:grid}
.foam{font-size:1.3rem}
.dispenser{position:absolute;left:5%;top:30%;width:9%;min-width:34px;height:15%;background:linear-gradient(#f8fafc,#cbd5e1);border:3px solid #94a3b8;border-radius:8px;box-shadow:0 4px 8px rgba(0,0,0,.15)}
.dispenser i{position:absolute;left:30%;right:30%;bottom:-8px;height:10px;background:#64748b;border-radius:0 0 4px 4px}
.dispenser::after{content:'🧴';position:absolute;inset:0;display:grid;place-items:center;font-size:1rem}
#mid .smeter{position:relative;display:block;width:120px;height:8px;border-radius:4px;background:#1a2645;margin-top:9px}
#mid .smeter i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#f59e0b,var(--gold));transition:width .5s}
#mid .smeter b{position:absolute;top:-12px;transform:translateX(-50%);font-size:.55rem;color:#475569;letter-spacing:-1px;white-space:nowrap}
#mid .smeter b.hit{color:var(--gold)}
.pchip{display:flex;align-items:center;gap:9px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:5px 10px 5px 5px;cursor:pointer;text-align:left;min-width:0}
.pchip img{width:40px;height:40px;border-radius:12px;object-fit:cover;object-position:center 20%;flex:none}
.pchip b{display:block;font-size:.92rem;line-height:1.1;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pchip small{font-size:.66rem;color:var(--muted)}
.pchip .flame{font-style:normal;font-weight:700;color:#fb923c;font-size:.85rem;margin-left:2px}
.avgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.av{border:3px solid transparent;border-radius:16px;overflow:hidden;background:var(--panel2);padding:0;cursor:pointer;transition:transform .1s,border-color .15s}
.av:active{transform:scale(.96)}
.av img{width:100%;aspect-ratio:1/1;display:block;object-fit:cover;object-position:center 20%}
.av span{display:block;font-size:.6rem;padding:3px 2px 4px;text-align:center;line-height:1.15;font-weight:600}
.av span small{color:var(--muted);font-size:.58rem}
.av.sel{border-color:var(--gold);box-shadow:0 0 0 3px rgba(251,191,36,.35)}
.avinfo{font-size:.82rem;color:#dbe4f5;text-align:center;margin-bottom:10px;min-height:20px}
.nicklbl{display:block;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600;margin-bottom:12px}
.nick{display:block;width:100%;margin-top:5px;font-family:inherit;font-size:1rem;font-weight:600;color:var(--text);background:#0b1222;border:2px solid var(--line);border-radius:12px;padding:10px 12px;text-transform:none;letter-spacing:0;user-select:text;-webkit-user-select:text}
.nick:focus{outline:none;border-color:var(--sky)}
.end-avatar{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:64px;height:64px;border-radius:18px;overflow:hidden;border:3px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.4);z-index:2;animation:dropIn .4s both}
.end-avatar img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.rankup{text-align:center;background:linear-gradient(90deg,#7c3aed,#2563eb);border-radius:12px;padding:6px;margin-bottom:8px;font-weight:600;animation:popIn .4s 1s both}
.xprow{display:flex;align-items:center;gap:8px;font-size:.75rem;color:var(--muted);margin-bottom:10px}
.xpbar{flex:1;height:8px;border-radius:4px;background:#1a2645;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7c3aed,#38bdf8);border-radius:4px}
.dgrid{text-align:center;font-size:1.3rem;letter-spacing:2px;margin-bottom:10px}
@keyframes happy{30%{transform:scale(1.07) rotate(-2deg)}60%{transform:scale(.98) rotate(2deg)}}
@keyframes flagPulse{50%{box-shadow:0 0 0 3px rgba(245,158,11,.35)}}

.rhead{display:grid;grid-template-columns:58px 1fr 1fr;gap:8px;padding:0 9px 3px;font-size:.58rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chips{gap:5px}
.chip{display:grid;grid-template-columns:58px 1fr 1fr;gap:8px;align-items:center;padding:5px 9px;position:relative;min-height:36px}
.chip .ic{display:flex;flex-direction:column;align-items:center;font-size:1.05rem;line-height:1;width:auto}
.chip .ic small{font-size:.58rem;color:#a9b5d3;margin-top:3px;font-weight:600;white-space:nowrap}
.chip .cv{font-size:.8rem;line-height:1.2;min-width:0;color:#e6ecfa}
.chip .cv small{font-size:.56rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.chip .st{position:absolute;right:5px;top:5px;width:20px;height:20px;font-size:.75rem}
.scene{container-type:size}
@container (max-height: 290px){ .meav,.say{display:none} .bigres{top:78px;bottom:10px} }
@container (max-height: 200px){ .bigres{display:none} }

#toasts{top:76px!important;bottom:auto!important;flex-direction:column!important}
.actions.pinned{position:sticky;bottom:calc(-14px - env(safe-area-inset-bottom));background:var(--panel);padding:8px 0 calc(6px + env(safe-area-inset-bottom));margin-top:4px;z-index:2}
.scene{min-height:120px}
@media (max-height:700px){
  .chip{min-height:30px;padding:3px 8px;gap:6px}
  .chip .cv{font-size:.74rem}
  .chip .ic{font-size:.9rem}
  .chip .ic small{font-size:.52rem;margin-top:1px}
  .chips{gap:4px;margin-bottom:6px}
  .sheet-h{margin-bottom:5px}
  .pt-banner{padding:6px 9px}
}

        t2: cfg.t2 || 0, t3: cfg.t3 || 1, floor,

        danaQ:[], dana:null, special:[], esc:[], sx:{good:0, bad:0, reportsBad:0}, won:[], mistakes:[] };

      const ri = rnd(8), res = floor[ri];

/* ---------- Task generation ---------- */
function makeTask(res, kind, force){
  const t = {kind, trap:null, due:'0900'};
  const opts = (correct, decoys) => { let d = shuffle(decoys); if (SAVE.up.cart) d = d.slice(0, d.length-1); return shuffle([correct, ...d]).map(optFrom); };
  const others = () => (G ? G.floor : ROSTER).filter(x => x !== res && x.sex === res.sex);
  const maybePatient = p => { if (R() < p){ const pool = others(); if (pool.length){ t.trap = 'patient'; t.wrong = pick1(pool); } } };
  if (kind === 'std'){
    const drugAllergy = ALLERGY_ORDERS[res.allergy];
    const pool = G && G.pool ? G.pool.filter(k => k !== 'allergy' || drugAllergy) : (drugAllergy ? ['patient','time','route','allergy','allergy'] : ['patient','time','route']);
    let roll = ['patient','time','route','allergy'].includes(force) && (force !== 'allergy' || drugAllergy) ? force : (R() < G_trapRate() && pool.length ? pick1(pool) : null);
    let lab, dec, due;
    if (roll === 'allergy'){ [lab, dec] = drugAllergy; due = '0900'; t.trap = 'allergy'; }
    else { [lab, dec, due] = pick1(STD); if (roll === 'patient') maybePatient(1); else if (roll) t.trap = roll; }
    Object.assign(t, {correct:lab, options:opts(lab, dec), due});
    [t.drug, t.dose] = splitLabel(lab);
    t.mar = marRow(t.due, `${lab} PO`, `Daily · ${t.due}`);
  } else if (kind === 'vitals'){
    const o = pick1(VIT); Object.assign(t, {correct:o.label, options:opts(o.label, o.decoys), holdIf:o.holdIf});
    [t.drug, t.dose] = splitLabel(o.label);
    if (force === 'vitals' || R() < .25){ t.trap = 'vitals'; t.reading = o.low(); } else { t.reading = o.ok(); maybePatient(G_trapRate()*.4); }
    t.mar = marRow('0900', `${o.label} PO`, `Daily · HOLD if ${o.holdIf}`);
  } else if (kind === 'crush'){
    const er = force === 'er' ? true : force === 'crushOk' ? false : R() < .25, o = pick1(er ? CRUSH_ER : CRUSH_OK);
    Object.assign(t, {correct:o.label, options:opts(o.label, o.decoys), er});
    [t.drug, t.dose] = splitLabel(o.label);
    t.mar = marRow('0900', `${o.label} PO`, `Daily · 🥄 swallow precautions: crush meds`);
    if (!er) maybePatient(G_trapRate()*.4);
  } else if (kind === 'insulin'){
    const r = force === 'hypo' ? 0 : R();

/* ---------- Game tick: timers, spawns, patience, rushes ---------- */
function gameTick(){
  if (!G || !G.active || G.ended) return;
  const now = performance.now(), dt = (now - G.lastTick)/1000; G.lastTick = now;
  if (G.paused || document.hidden || dt > 1) return;
  if (G.mode !== 'endless'){ G.time -= dt; const s = Math.ceil(G.time); if (s !== G.lastSec){ G.lastSec = s; if (s <= 15 && s > 0) sfx.tick(); } }
  else G.elapsed += dt;
  G.cool = G.cool.map(c => Math.max(0, c-dt));
  // rush moments
  const prog = G.mode === 'endless' ? 0 : 1 - G.time/G.total;
  if ((G.mode !== 'endless' && G.rush.length && prog >= G.rush[0]) || (G.mode === 'endless' && G.elapsed >= G.nextRushAt)){
    if (G.mode !== 'endless') G.rush.shift(); else G.nextRushAt = G.elapsed + 35 + Math.random()*20;
    triggerRush();
  }
  if (G.rushBoost && now > G.rushUntil) G.rushBoost = 0;
  G.spawnTimer -= dt;
  if (G.spawned < G.n && G.calls.length < G.maxActive + G.rushBoost && (G.spawnTimer <= 0 || G.calls.length === 0)){
    if (spawnCall()) G.spawnTimer = G.spawnEvery*(.75+Math.random()*.5);
  }
  for (const c of G.calls.slice()){ if (c.inProgress) continue; c.patience -= dt; if (c.patience <= 0) missCall(c); }
  G.clock += dt;
  if (G.mode === 'story') storyTick();
  renderHud();
  if (G.view === 'hub') updateRooms();
  if (G.mode !== 'endless'){
    if (G.time <= 0) return endShift(false);
    if (G.spawned >= G.n && G.calls.length === 0 && !G.visit && !storyBusy()) return endShift(true);
  } else if (G.hearts <= 0) return endShift(false);
}
function triggerRush(){
  G.rushBoost = 1; G.rushUntil = performance.now() + 14000;
  sfx.rush(); vib([40,40,40]);
  if (G.view === 'hub') banner('🚨 RUSH!', 'bad', .45); else toast('🚨 <b>RUSH!</b> Call lights are going off!', 'bad');
  let k = 0; const more = () => { if (!G || !G.active) return; if (k++ < 2 && G.spawned < G.n && G.calls.length < G.maxActive + 1) { spawnCall(); setTimeout(more, 900); } };
  more();
}
function spawnCall(){
  const busy = new Set(G.calls.map(c => c.room));
  const freeRoom = i => !busy.has(i) && G.cool[i] <= 0 && !(G.visit && G.visit.room === i);
  let room, task, kind;
  if (G.plan){
    const k = G.plan.findIndex(p => freeRoom(p.room));
    if (k < 0) return false;
    ({room, task, kind} = G.plan.splice(k, 1)[0]);
  } else {
    const free = ROOMS.map((_,i)=>i).filter(freeRoom);
    if (!free.length) return false;
    room = pick1(free); kind = chooseKind(G.floor[room]); task = makeTask(G.floor[room], kind);
  }
  const res = G.floor[room];
  const max = G.patienceBase * (1 + .15*SAVE.up.manner) * (kind==='insulin'||kind==='prn'||kind==='crush' ? 1.12 : 1);
  const c = {id:++G.cid, res, room, task, patience:max, max};
  G.calls.push(c); G.spawned++; sfx.chime();
  if (G.view !== 'hub') toast(`🔔 ${res.call} (Rm ${ROOMS[room].num}) is calling ${KIND[kind].icon}`);
  else { const el = MAP && MAP.rooms[room]; if (el){ const p = elCenter(el); floatText('🔔', '', p.x, p.y-40, 900); } }
  return true;
}
function missCall(c){

  G.stats.missed++; G.streak = 0; renderStreak(); G.resolved++; G.cool[c.room] = 6; G.log.push('miss');
  if (c.task.kind === 'report' && G.sx){ G.sx.reportsBad++; logMistake(c, 'm_'+c.task.id); }
  addScore(-100); sfx.bad(); vib([80,40,80]);

  if (G.view === 'hub' && MAP){ const p = elCenter(MAP.rooms[c.room]); floatText('😤 −100', 'bad', p.x, p.y-20, 1300); shake(); }

function hubLoop(){

  };

}

/* ---------- Bedside check: read, then Give or Hold ---------- */
function rightsFor(c){
  const t = c.task, res = c.res, who = p => `${p.name} · ${p.dob}`;
  const rows = [
    {icon:'🪪', title:'Patient', a:['MAR', who(res)], b:['Wristband', t.trap==='patient' ? who(t.wrong) : who(res)], bad:t.trap==='patient', scan:2},
    {icon:'💊', title:'Drug', a:['MAR', t.drug], b:['Label', t.drug], scan:1},
    {icon:'⚖️', title:'Dose', a:['MAR', t.dose], b:['Label', t.dose], scan:1}
  ];
  let route = {a:['Order','PO (by mouth)'], b:['Bedside','Swallowing OK']}, time = {a:['Due', t.due || '0900'], b:['Last given','Yesterday']}, extra = null;
  if (t.kind === 'std'){
    if (t.trap === 'route') route = {...route, b:['Bedside','NPO – swallow eval'], bad:true};
    if (t.trap === 'time') time = {...time, b:['Last given','Today 0812 · RN Patel'], bad:true};
  } else if (t.kind === 'vitals'){
    extra = {icon:'💓', title:'Vitals', a:['Hold if', t.holdIf], b:['Bedside', t.reading], bad:t.trap==='vitals'};
  } else if (t.kind === 'crush'){
    route = {a:['Order','PO · crushed'], b:['Prepared','In applesauce']};
  } else if (t.kind === 'insulin'){
    rows[2] = {icon:'⚖️', title:'Dose', a:['Scale', `BG ${t.bg} → ${t.units}u`], b:['Syringe', `${t.units} units`], scan:1};
    route = {a:['Order','SubQ'], b:['Site','Abdomen, rotated']};
    time = {a:['Due','Before meals'], b:['Bedside','Breakfast tray here']};
  } else if (t.kind === 'prn'){
    time = {a:['Frequency', `Every ${t.freq}h PRN`], b:['Last given', t.trap==='prnTime' ? '1h 50m ago' : 'Yesterday 2100'], bad:t.trap==='prnTime'};
  }
  rows.push({icon:'👄', title:'Route', ...route}, {icon:'⏰', title:'Time', ...time});
  rows.push({icon:'⚠️', title:'Allergy', a:['Allergies', res.allergy === 'None' ? 'NKA' : res.allergy], b:['Med class', clsOf(t.drug)], bad:t.trap==='allergy'});
  if (extra) rows.push(extra);
  return rows;
}
function stepRights(c){
  phase(); G.view = 'visit';
  const rows = rightsFor(c), hasTrap = rows.some(r => r.bad);
  let flagging = false;
  setSheet(`<div class="sheet-h"><span id="rh">Bedside check · does everything match?</span><b id="rc">${rows.length} rights</b></div><div class="rhead"><span></span><span>Ordered / chart</span><span>At the bedside</span></div><div class="chips" id="chips"></div>
    <div class="actions pinned" id="acts"><button class="btn hold" id="hold">🛑 Hold</button><button class="btn green" id="give">${c.task.kind==='insulin'?'💉':'💊'} Give</button></div>`, 'scroll');
  const chips = $('#chips'), hold = $('#hold'), give = $('#give');
  const els = rows.map((rt,k) => {
    const el = document.createElement('button'); el.className = 'chip'; el.style.animationDelay = (k*40)+'ms';
    el.innerHTML = `<span class="ic">${rt.icon}<small>${rt.title}</small></span><span class="cv"><small>${rt.a[0]}</small> ${esc(rt.a[1])}</span><span class="cv"><small>${rt.b[0]}</small> ${esc(rt.b[1])}</span><span class="st"></span>`;
    el.onclick = () => {
      if (!flagging || !G.active || el.classList.contains('ok') || el.classList.contains('bad')) return;
      const p = elCenter(el);
      if (rt.bad){ el.classList.add('bad'); sfx.shield(); return after(350, () => finishHold(c, c.slip, c.task.trap)); }
      el.classList.add('ok'); c.slip = true; G.stats.badHolds++; G.streak = 0; renderStreak(); addScore(-40); sfx.bad(); logMistake(c, 'falseFlag');
      floatText('−40 That one matches', 'bad', p.x, p.y-16);
    };
    chips.appendChild(el); return el;
  });
  // Barcode scanner upgrade pre-verifies some rows (and catches wristband mismatches)
  const sc = SAVE.up.scanner;
  if (sc) rows.forEach((rt,k) => { if (rt.scan && rt.scan <= sc) after(250 + k*120, () => { els[k].classList.add(rt.bad ? 'bad' : 'ok', 'scanned'); sfx.scan(); if (rt.bad){ const p = elCenter(els[k]); floatText('📟 Scanner alert!', 'bad', p.x, p.y-16); hold.classList.add('urge'); } }); });
  give.onclick = () => { if (!G.active) return; if (hasTrap) finishUnsafe(c, GAVE[c.task.trap](c), c.task.trap); else finishPass(c); };
  maybeInterrupt(c);
  hold.onclick = () => {
    if (!G.active) return;
    if (!flagging){
      if (els.some((el,k) => rows[k].bad && el.classList.contains('bad'))) return finishHold(c, c.slip, c.task.trap);  // scanner already caught it
      flagging = true; sfx.queue();
      $('#rh').textContent = 'Tap the row that doesn\'t match'; $('#rc').textContent = '🛑';
      chips.classList.add('flagging'); hold.textContent = '↩ Back'; hold.classList.remove('urge'); give.disabled = true;
      return;
    }
    flagging = false; chips.classList.remove('flagging'); $('#rh').textContent = 'Bedside check · does everything match?'; $('#rc').textContent = rows.length+' rights';
    hold.textContent = '🛑 Hold'; give.disabled = false;
  };
}

function closeVisit(c){

/* ---------- End of shift ---------- */
function endShift(completed){
  if (!G || G.ended) return;
  G.ended = true; G.active = false; clearInterval(G.tickId); phase();
  stage.classList.remove('danger'); toastsEl.innerHTML = ''; fxEl.innerHTML = ''; streakEl.classList.remove('on');
  const S = G.stats, mistakes = S.wrongPicks + S.slips + S.badHolds + S.unsafe;
  let stars = 0, isBest = false, title, sub, unlockedNext = false, early = 0, signed = false, chapterDone = false;
  if (G.mode !== 'endless'){
    if (!completed){ const left = G.calls.length + (G.n - G.spawned); G.stats.missed += left; for (let k=0;k<left;k++) G.log.push('miss'); }
    if (completed && G.time > 0){ early = Math.ceil(G.time) * 3; G.score += early; }
    if (G.served >= Math.ceil(G.n*.7)) stars = 1;
    if (stars && G.score >= G.t2) stars = 2;
    if (stars === 2 && G.score >= G.t3 && mistakes === 0) stars = 3;
  }
  // rewards
  const xpGain = G.served*10 + stars*20 + (G.mode === 'daily' ? 50 : 0);
  const rkBefore = rankOf(SAVE.xp||0); SAVE.xp = (SAVE.xp||0) + xpGain; const rkAfter = rankOf(SAVE.xp);
  let coins = Math.floor(G.score/10) + stars*15, streakGrew = false;
  if (G.mode === 'career'){
    const L = G.L, prevStars = starsOf(L.idx); if (stars > prevStars) SAVE.stars[L.idx] = stars;
    unlockedNext = prevStars === 0 && stars >= 1 && L.idx < LEVELS.length-1;
    isBest = G.score > (SAVE.best[L.idx]||0) && G.score > 0; if (isBest) SAVE.best[L.idx] = G.score;
    title = stars ? 'SHIFT COMPLETE' : completed ? 'ROUGH SHIFT' : "TIME'S UP!"; sub = `${L.unit.icon} ${L.unit.name} · Level ${L.num}`;
  } else if (G.mode === 'story'){

    signed = stars >= 1 && S.unsafe === 0 && G.sx.reportsBad === 0 && (!L.capstone || S.catches >= 1);

    if (L.capstone && signed){ chapterDone = !st.done; st.done = true; }
    unlockedNext = prev === 0 && stars >= 1 && i < STORY.length-1;
    title = signed ? 'SIGNED OFF ✓' : stars ? 'NOT YET' : completed ? 'ROUGH SHIFT' : "TIME'S UP!"; sub = `${L.icon} Shift ${L.num} · ${L.name}`;
  } else if (G.mode === 'daily'){
    const D = G.L, prev = SAVE.daily[D.key];
    isBest = !prev || G.score > prev.score;
    if (isBest) SAVE.daily[D.key] = {score:G.score, stars, log:G.log.slice()};
    streakGrew = bumpStreak();
    title = stars ? 'DAILY COMPLETE' : 'DAILY DONE'; sub = `📅 Daily Shift #${D.num} · 🔥 ${SAVE.streak.count}-day streak`;
  } else {
    isBest = G.score > SAVE.endlessBest && G.score > 0; if (isBest) SAVE.endlessBest = G.score;
    coins = Math.floor(G.score/10);
    title = 'SHIFT OVER'; sub = `∞ Endless · survived ${fmt(G.elapsed)}`;
  }
  promoteRematches(G.won); G.won = [];
  mergeDeck(G.mistakes); G.mistakes = [];
  SAVE.coins += coins; SAVE.shifts = (SAVE.shifts||0) + 1; persist(); renderHud();

  let verdict;
  if (G.mode === 'endless') verdict = `You safely served <b>${G.served}</b> residents before running out of hearts.`;
  else if (stars === 3) verdict = `🏆 Flawless med pass. The charge nurse wants to know your secret.`;
  else if (!stars) verdict = `Serve at least ${Math.ceil(G.n*.7)} residents safely to earn a star. Plan your route — 😠 rooms first!`;
  else if (S.unsafe) verdict = `⚠️ ${S.unsafe} med error${S.unsafe>1?'s':''}. Read every row before you tap Give.`;
  else if (S.badHolds) verdict = `🤔 You flagged ${S.badHolds} row${S.badHolds>1?'s':''} that matched — only hold when something's off.`;
  else if (S.wrongPicks) verdict = `💊 ${S.wrongPicks} wrong pull${S.wrongPicks>1?'s':''} from the cart — check drug <i>and</i> dose.`;
  else if (S.missed) verdict = `⏱ ${S.missed} resident${S.missed>1?'s':''} gave up waiting. Queue the 😠 rooms first.`;
  else verdict = `Need ${G.t3} for ★★★ — move faster for bigger bonuses.`;

      : S.unsafe ? `One of those would've reached a resident. Not yet — run it back.`
      : G.sx.reportsBad ? `Dana flagged something and it sat there. Not yet.`

      + (chapterDone ? `<div class="newskill"><span>💌</span><div><b>CHAPTER 1 COMPLETE</b><p>The residents left a card at the station: “To our new nurse.” Mae signed it “Evelyn.”</p></div></div>` : '');
  }

  sceneEl.className = 'scene';
  sceneEl.innerHTML = `<div class="layer kb"><img src="${stars||G.mode==='endless' ? IMG.give : IMG.hall}" alt=""></div><div class="layer end-shade"></div>

    <div class="end-title"><div class="et">${title}<small>${sub}</small></div>

    ${isBest ? '<div class="newbest">NEW BEST!</div>' : ''}</div>`;

    : G.mode==='story' && G.L.idx < STORY.length-1 && storyUnlocked(G.L.idx+1) ? G.L.idx+1 : null;

  setSheet(`<div class="final"><small>FINAL SCORE</small><b id="final">0</b><span>${early ? `⏱ +${early} finished early · ` : ''}🪙 +${coins}${unlockedNext ? (G.mode==='story' ? ' · 🔓 Shift ' : ' · 🔓 Level ')+(G.L.num+1)+' unlocked!' : ''}</span></div>

    </div>

      ${nextL != null && stars ? `<button class="btn big pulse" id="next">Next ▸</button>` : `<button class="btn big ${G.mode==='daily'?'':'pulse'}" id="again">↻ ${G.mode==='daily'?'Again':'Retry'}</button>`}</div>`, 'scroll');

  if (rankLine) after(1100, sfx.rankup);
  if (stars >= 2 || isBest) after(500, () => confetti(50));
  const fin = $('#final'), t0 = performance.now(), to = G.score;
  const f = now => { if (!fin.isConnected) return; const k = Math.min(1,(now-t0)/1200); fin.textContent = Math.round(to*(1-Math.pow(1-k,3))); if (k<1) requestAnimationFrame(f); };

function storyFloor(){
  const cast = Object.keys(CAST_ROOM), guests = shuffle(ROSTER.filter(r => !Object.values(CASTI).includes(r.i))).slice(0, 2);
  const floor = []; cast.forEach(k => floor[CAST_ROOM[k]] = castRes(k)); floor[6] = guests[0]; floor[7] = guests[1];
  return floor;
}
const momentItem = id => ({room:CAST_ROOM[MOMENTS[id].res], kind:'moment', task:{kind:'moment', id, due:'now'}});
function storyPlan(cfg){
  let ms = cfg.moments === 'mix' ? shuffle(['1a','1c','2a','3c','4a','4c']).slice(0, 2) : (cfg.moments || []).slice();
  const specials = [...ms.map(momentItem), ...(cfg.sbar||[]).map(id => ({room:CAST_ROOM[SBAR[id].res], kind:'sbar', task:{kind:'sbar', id, due:'now'}}))];
  const meds = [];
  for (let k = 0; k < cfg.n - specials.length; k++){
    const ri = rnd(8), res = G.floor[ri];
    const kind = (k === 1 && cfg.focus) ? cfg.focus : chooseKind(res);
    meds.push({room:ri, kind, task:makeTask(res, kind)});
  }
  const plan = meds.slice();
  specials.forEach((s, j) => plan.splice(Math.min(plan.length, Math.round((j+1) * (meds.length+1) / (specials.length+1)) + j), 0, s));
  return plan;
}
function injectRematches(plan){
  if (!plan) return;
  let used = 0;
  for (const card of deckDue()){
    if (used >= 2) break;
    const k = card.k;
    if (k.startsWith('m_')){
      if (G.mode !== 'story') continue;
      const id = k.slice(2);
      if (MOMENTS[id]){
        const have = plan.find(p => p.task.id === id);
        if (have){ have.task.rematch = k; used++; continue; }
        const i = plan.findIndex(p => p.kind === 'std' && !p.task.rematch); if (i < 0) continue;
        plan[i] = momentItem(id); plan[i].task.rematch = k; used++;
      } else if (INTERRUPTS[id] && !G.intq.includes(id)){ G.intq.push(id); G.intRematch.add(id); used++; }
      else if (REPORTS[id] && !G.events.some(e => e.id === id)){ G.events.push({at:.5, id, rematch:k}); G.events.sort((a,b) => a.at - b.at); used++; }
      continue;
    }
    const kind = REMATCH_KIND[k];
    if (!kind || !G.kinds.includes(kind)) continue;
    const i = plan.findIndex(p => p.kind === kind && !p.task.rematch && (k !== 'allergy' || ALLERGY_ORDERS[G.floor[p.room].allergy]) && (k !== 'patient' || G.floor.some(x => x !== G.floor[p.room] && x.sex === G.floor[p.room].sex)));
    if (i < 0) continue;
    plan[i].task = makeTask(G.floor[plan[i].room], kind, k); plan[i].task.rematch = k; used++;
  }
}
function winRematch(k){ if (G && k) (G.won || (G.won = [])).push(k); }
function promoteRematches(list){
  const today = todayKey(), gaps = [1, 3, 7, 14];
  for (const k of list || []){
    const card = SAVE.deck.find(x => x.k === k); if (!card) continue;
    card.box = (card.box||0) + 1;
    if (card.box >= gaps.length) SAVE.deck.splice(SAVE.deck.indexOf(card), 1);
    else card.due = addDays(today, gaps[card.box]);
  }
}

    G.stats.unsafe++; G.sx.bad++; G.streak = 0; renderStreak(); G.log.push('error'); addScore(-100);
    if (o.key) logMistake(c, o.key);
    if (b) b.classList.add('held');
    outcomeSheet(`<div class="sheet-h"><span>${esc(o.title || 'Your call')}</span><b class="badc">YIKES</b></div>
      <div class="msg">⚠️ ${text}<br><small style="color:var(--muted)">🔁 This one's going in your rematch pile.</small></div><div class="tally"><div class="trow total neg"><span>Would have reached the resident</span><b>−100</b></div></div>`);
    sfx.bad(); shake(); banner('YIKES!', 'bad', .5); floatText('−100', 'bad', p.x, p.y+56, 1400); say('Oh dear…');
    mentorOnce('bad');
  }
}
function stepMoment(c){
  const m = MOMENTS[c.task.id];
  after(800, () => say(m.say));
  const order = shuffle(m.choices.map((_, i) => i));
  setSheet(`<div class="sheet-h"><span>❗ ${esc(m.title)}</span><b>${c.task.rematch ? '🔁 Rematch' : 'Your call'}</b></div>
    <div class="msg sit">${m.scene}</div>
    <div class="choices">${order.map(i => `<button class="btn ghost choice" data-i="${i}">${m.choices[i].t}</button>`).join('')}</div>`, 'scroll');
  sheetEl.querySelectorAll('.choice').forEach(b => b.onclick = () => {
    if (!G.active) return;
    const ch = m.choices[+b.dataset.i];
    resolveStory(c, ch.r, ch.why, {as:ch.as, key:'m_'+c.task.id, title:m.title});
  });
}
function stepReport(c){
  const r = REPORTS[c.task.id], useSbar = G.L.idx >= 6 && r.sbar;
  setSheet(`<div class="sheet-h"><span>🔎 Checking on ${esc(c.res.first)}</span><b class="${c.task.late?'badc':''}">${c.task.late ? 'LATE' : 'Assess'}</b></div>
    <div class="msg sit">${r.finding}</div>
    <div class="actions"><button class="btn big green pulse" id="act">${useSbar ? '📞 Call '+DOC : r.best === 'assess' ? '📞 Call it in' : '👍 Got it'}</button></div>`);
  $('#act').onclick = () => {
    if (!G.active) return;
    if (useSbar) return stepSbar(c, r.sbar);
    resolveStory(c, 'good', r.done, {as:'catch', title:'Dana’s report', pts:150, mentor:'report'});
  };
}
function stepSbar(c, id){
  phase(); G.view = 'visit';
  const S = SBAR[id], order = ['S','B','A','R'], names = {S:'Situation', B:'Background', A:'Assessment', R:'Recommendation'};
  const cards = shuffle(['S','B','A','R','X']); let k = 0; const t0 = performance.now();
  setSheet(`<div class="sheet-h"><span>📞 ${DOC} on the line</span><b id="sbk">0/4</b></div>
    <div class="note" style="margin:0 0 8px">${S.intro}</div>
    <div class="sbar-slots">${order.map(l => `<div class="slot" data-l="${l}"><b>${l}</b><span>${names[l]}</span></div>`).join('')}</div>
    <div class="sbar-cards">${cards.map(l => `<button class="scard" data-l="${l}">${esc(S[l])}</button>`).join('')}</div>`, 'scroll');
  sheetEl.querySelectorAll('.scard').forEach(btn => btn.onclick = () => {
    if (!G.active || btn.disabled) return;
    const l = btn.dataset.l, want = order[k];
    if (l === want){
      btn.disabled = true; btn.classList.add('used'); sfx.pick();
      sheetEl.querySelector(`.slot[data-l="${l}"]`).classList.add('on'); k++; $('#sbk').textContent = k+'/4';
      if (k === 4){
        const secs = (performance.now() - t0)/1000, bonus = Math.max(0, Math.round(160 - secs*8));
        G.sx.sbar = (G.sx.sbar||0) + 1;
        after(350, () => resolveStory(c, 'good', S.reply, {as:'catch', title:'SBAR call', pts:250 + bonus, mentor:'sbar'}));
      }
    } else if (l === 'X'){
      btn.disabled = true; btn.classList.add('nope'); addScore(-20); sfx.bad();
      toast(`📞 ${DOC}: “${S.xReply}” · −20`, 'bad');
    } else {
      btn.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}], {duration:220});
      addScore(-15); sfx.bad(); toast(`📞 ${DOC}: “${SBAR_HINT[want]}”`, 'bad');
    }
  });
}

/* ---------- Interruptions (during the bedside check) ---------- */
function maybeInterrupt(c){
  if (!G || G.mode !== 'story' || !G.intq.length || c.intDone) return;
  if (!(Math.random() < .75 || G.plan.length <= G.intq.length + 1)) return;
  c.intDone = true;
  after(700, () => { if (!G || G.visit !== c || !G.intq.length) return; showInterrupt(c, G.intq.shift()); });   // only used up once it's actually on screen
}
function showInterrupt(c, id){
  const I = INTERRUPTS[id], o = document.createElement('div'), isRe = G.intRematch.has(id);
  o.className = 'intr';
  const opts = shuffle([['safe', I.safe], ['unsafe', I.unsafe]]);
  o.innerHTML = `<div class="intr-h">${I.icon} ${isRe ? '🔁 REMATCH · ' : ''}INTERRUPTION!</div><p>${I.text}</p>
    <div class="intr-a">${opts.map(([k, t]) => `<button class="btn ghost" data-k="${k}">${t}</button>`).join('')}</div>`;
  sheetEl.appendChild(o); sfx.rush(); vib([30,30,30]);
  o.querySelectorAll('button').forEach(b => b.onclick = () => {
    if (!G.active) return;
    if (b.dataset.k === 'safe'){
      addScore(50); sfx.good(); const p = elCenter(b); floatText('+50 Cool head', 'good', p.x, p.y-20);
      if (isRe) winRematch('m_'+id);
      mentor(I.coach); o.remove();
      if (I.restart) stepRights(c);
    } else {
      addScore(-75); G.streak = 0; renderStreak(); G.stats.slips++; c.slip = true; sfx.bad(); shake();
      logMistake(c, 'm_'+id);
      o.innerHTML = `<div class="intr-h">😬 OOPS</div><p>${I.oops}</p><div class="intr-a"><button class="btn green" id="redo">↩ Restart the check</button></div>`;
      o.querySelector('#redo').onclick = () => { o.remove(); stepRights(c); };
    }
  });
}

/* ---------- Dana's reports on the hallway map ---------- */
function fireEvent(ev){
  G.danaQ.push(ev);
  if (G.view === 'hub') renderDana(); else toast('🗣️ <b>Dana</b> is looking for you…');
}
function renderDana(){
  if (!G || G.view !== 'hub' || !MAP) return;
  let el = $('#dana');
  if (!G.dana && G.danaQ.length) G.dana = G.danaQ.shift();
  if (!G.dana){ if (el) el.remove(); return; }
  if (el && el.dataset.id === G.dana.id) return;
  const r = REPORTS[G.dana.id], res = castRes(r.res);
  if (!el){ el = document.createElement('div'); el.id = 'dana'; el.className = 'dana'; MAP.el.appendChild(el); sfx.chime(); vib(15); }
  el.dataset.id = G.dana.id;
  el.innerHTML = `<div class="dana-h"><span class="dav">🧑🏽‍⚕️</span><div><b>Dana · CNA</b><small>about ${esc(res.call)} · Rm ${ROOMS[CAST_ROOM[r.res]].num}${G.dana.rematch ? ' · 🔁 rematch' : ''}</small></div></div>
    <p id="danaLine">“${esc(r.line)}”</p>
    <div class="dana-a"><button data-a="assess">🔎 Assess now</button><button data-a="delegate">📏 Recheck vitals</button><button data-a="note">📝 Later</button></div>`;
  el.querySelectorAll('button').forEach(b => b.onclick = () => danaChoice(b.dataset.a));
}
function queueSpecial(resKey, task){ G.special.push({room:CAST_ROOM[resKey], task:{due:'now', ...task}}); trySpecial(); }
function trySpecial(){
  for (const s of G.special.slice()){
    if (G.calls.some(c => c.room === s.room) || (G.visit && G.visit.room === s.room)) continue;
    const max = G.patienceBase * (s.task.late ? .6 : .95);
    G.calls.push({id:++G.cid, res:G.floor[s.room], room:s.room, task:s.task, patience:max, max});
    G.special = G.special.filter(x => x !== s); sfx.chime();
    if (G.view === 'hub' && MAP){ const p = elCenter(MAP.rooms[s.room]); floatText('🔎', '', p.x, p.y-40, 900); }
    else toast(`🔎 ${esc(G.floor[s.room].call)} needs you to take a look`);
  }
}
function danaChoice(a){
  if (!G || !G.active || !G.dana) return;
  const ev = G.dana, r = REPORTS[ev.id], res = castRes(r.res), el = $('#dana');
  const line = t => { const p = $('#danaLine'); if (p) p.innerHTML = t; };
  if (a === r.best || (r.ok || []).includes(a)){
    const best = a === r.best; addScore(best ? 100 : 50); sfx.good(); G.sx.good++;
    if (el){ const p = elCenter(el); floatText(best ? '+100 Good call' : '+50', 'good', p.x, p.y-30); }
    if (a === 'assess') queueSpecial(r.res, {kind:'report', id:ev.id, rematch:best ? ev.rematch : null});
    else if (a === 'note') toast(`🗣️ Dana: “${r.noteReply}”`);
    else if (a === 'delegate'){ toast(`🗣️ Dana: “On it.”`); G.esc.push({t:G.clock + 16, fn:() => { toast(`🗣️ Dana: “${r.delegateReply}” · you review it · +50`); addScore(50); }}); }
    if (best && ev.rematch && a !== 'assess') winRematch(ev.rematch);
    G.dana = null; renderDana();
  } else if (a === 'delegate' && r.best === 'assess'){
    addScore(-25); sfx.bad();
    line(`“I can take the numbers, but I can't assess ${esc(res.first)} — that's you.”`);
    if (el) el.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}], {duration:220});
  } else if (r.best === 'assess'){
    toast(`🗣️ Dana: “…Okay.”`); G.sx.reportsBad++; logMistake({task:{kind:''}}, 'm_'+ev.id);
    G.dana = null; renderDana();
    G.esc.push({t:G.clock + 18, fn:() => { toast(`🚨 Dana: “${esc(res.first)}'s getting worse — I need you NOW!” · −100`, 'bad'); addScore(-100); sfx.bad(); vib([80,40,80]); queueSpecial(r.res, {kind:'report', id:ev.id, late:true}); }});
  } else {
    addScore(-25); sfx.bad(); toast(`🗣️ Dana: “So… nobody's following up on that?” · −25`, 'bad');
    G.dana = null; renderDana();
  }
}
function storyTick(){
  const prog = 1 - G.time/G.total, idle = G.spawned >= G.n && G.calls.length === 0 && !G.visit;
  if (G.events.length && (prog >= G.events[0].at || (idle && !G.dana && !G.danaQ.length && !G.special.length && !G.esc.length))) fireEvent(G.events.shift());
  if (G.esc.length) G.esc = G.esc.filter(e => { if (G.clock >= e.t){ e.fn(); return false; } return true; });
  if (G.special.length) trySpecial();
  if (G.view === 'hub' && (G.dana || G.danaQ.length) && !$('#dana')) renderDana();
}
const storyBusy = () => !!(G && G.mode === 'story' && (G.events.length || G.esc.length || G.special.length || G.dana || G.danaQ.length));

/* ---------- Career screens ---------- */
function showPreceptorPick(first){
  phase(); leaveShift(); menuScene('🩺 Pick your preceptor', 'They’ll have your back all chapter');
  let sel = SAVE.story.preceptor;
  const pool = NURSES.map((n, i) => i).filter(i => i !== SAVE.nurse);
  if (sel == null || sel === SAVE.nurse) sel = pool.includes(9) ? 9 : pool[0];
  setSheet(`${first ? '' : `<div class="topline">${backBtn()}<span></span></div>`}
    <div class="avgrid">${pool.map(i => `<button class="av ${sel===i?'sel':''}" data-i="${i}"><img src="${nurseImg(i)}" alt="${esc(NURSES[i].name)}"><span>${esc(NURSES[i].name.replace(/^Dr\. /,'').replace(/ "Mo"/,''))}<br><small>${NURSES[i].spec}</small></span></button>`).join('')}</div>
    <button class="btn big pulse" id="save">✓ ${first ? 'Start orientation' : 'Save'}</button>`, 'scroll');
  sheetEl.querySelectorAll('.av').forEach(b => b.onclick = () => { sel = +b.dataset.i; sfx.queue(); sheetEl.querySelectorAll('.av').forEach(x => x.classList.toggle('sel', x === b)); });
  if ($('#back')) $('#back').onclick = showStory;
  $('#save').onclick = () => { SAVE.story.preceptor = sel; persist(); sfx.good(); audio(); first ? showStoryIntro(0) : showStory(); };
}
function showStory(){
  phase(); leaveShift();
  if (!SAVE.story.seen) return showFraming('story');
  if (SAVE.story.preceptor == null || SAVE.story.preceptor === SAVE.nurse) return showPreceptorPick(true);
  menuScene('🩺 Career', 'Chapter 1 · The New Hire');
  const st = SAVE.story, due = deckDue().length, next = STORY.findIndex((_, i) => storyUnlocked(i) && !(st.stars[i] > 0));
  const signed = STORY.filter((_, i) => st.signoffs[i]).length;
  setSheet(`<div class="topline">${backBtn()}<span class="coins">✅ ${signed}/8</span></div>
    ${st.done ? `<div class="newskill"><span>🎉</span><div><b>CLEARED FOR FULL ASSIGNMENT</b><p>Chapter 1 complete. Chapter 2 is on the way.</p></div></div>` : ''}
    <button class="pchip pre" id="pre"><img src="${nurseImg(preIdx())}" alt=""><span><b>${esc(NURSES[preIdx()].name.replace(/ "Mo"/,''))}</b><small>Your preceptor · tap to change</small></span></button>
    <div class="unit"><div class="unit-h"><span class="ui">🌸</span><div>Chapter 1 · The New Hire<small>Memory Care · earn your preceptor’s trust, then fly solo</small></div></div>
      <div class="signoffs">${STORY.map((S, i) => { const ok = storyUnlocked(i), s = st.stars[i]||0;
        return `<button class="so ${ok?'':'locked'} ${i===next?'nextup':''}" data-i="${i}" style="animation-delay:${i*.04}s"><b>${ok ? i+1 : '🔒'}</b><span>${S.icon} ${S.name}</span><em>${st.signoffs[i] ? '✅ ' : ''}<span class="s3">${[0,1,2].map(k => `<span class="${k<s?'':'off'}">★</span>`).join('')}</span></em></button>`; }).join('')}</div></div>
    <div class="set-row"><b>🔁 Rematch pile · ${SAVE.deck.length}</b><p>${due ? `${due} rematch${due===1?' is':'es are'} ready to ambush you in your next shift.` : SAVE.deck.length ? 'Everything that got you is cooling off. It’ll be back.' : 'Anything that trips you up gets saved for a rematch.'}</p></div>
    <div class="fine"><a href="#" id="about">About Career</a></div>`, 'scroll');
  $('#back').onclick = showTitle;
  $('#pre').onclick = () => { audio(); showPreceptorPick(false); };
  $('#about').onclick = e => { e.preventDefault(); showFraming('story'); };
  sheetEl.querySelectorAll('.so').forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (!storyUnlocked(i)){ sfx.bad(); b.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}], {duration:200}); toast('Earn a ★ on the shift before it'); return; }
    audio(); showStoryIntro(i);
  });
}
function showStoryIntro(i){
  phase(); leaveShift();
  const L = storyCfg(i), b = L.beat;
  menuScene(`${L.icon} Shift ${i+1}`, L.name);
  const who = b.who === 'pre' ? {img:nurseImg(preIdx()), name:preName()+' · preceptor'} : {img:castRes(b.who).portrait, name:castRes(b.who).call};
  const goals = ['no med errors'];
  if (L.events && L.events.some(e => REPORTS[e.id].best === 'assess')) goals.push('don’t leave Dana hanging');
  if (L.capstone) goals.push('catch at least one');
  setSheet(`<div class="beat"><img src="${who.img}" alt=""><div><b>${esc(who.name)}</b><p>“${b.line}”</p></div></div>
    <div class="goal"><div><b>${L.n}</b><span>residents</span></div><div><b>${fmt(L.time)}</b><span>shift</span></div><div><b>${L.maxActive}</b><span>calls at once</span></div></div>
    ${b.who === 'pre' ? '' : `<div class="beat tip"><img src="${nurseImg(preIdx())}" alt=""><div><b>${esc(preName())}</b><p>${L.tip}</p></div></div>`}
    <div class="targets"><div><span>✅ Sign-off: ${goals.join(' · ')}</span></div><div><span><span class="s">★★</span> Score ${L.t2}+ · <span class="s">★★★</span> ${L.t3}+ flawless</span></div></div>
    <div class="actions"><button class="btn ghost" id="back" style="flex:0 0 30%">‹ Back</button><button class="btn big pulse" id="go">▶ Start shift</button></div>`, 'scroll');
  $('#back').onclick = showStory;
  $('#go').onclick = () => { audio(); startShift('story', L); };
}

/* ---------- Boot ---------- */
[IMG.hall, IMG.door, IMG.give].forEach(src => { const i = new Image(); i.src = src; });
renderMute();
showTitle();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !/htmlpreview/.test(location.hostname)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
