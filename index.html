<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1426">
<title>MedPass Madness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16; --panel:#121a2e; --panel2:#1a2440; --line:#2a3658; --text:#eef2ff; --muted:#8b97b8;
  --sky:#38bdf8; --sky2:#0ea5e9; --green:#22c55e; --red:#ef4444; --gold:#fbbf24;
  --font:'Fredoka', ui-rounded, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--font);color:var(--text);display:flex;justify-content:center;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--panel);overflow:hidden}
@media (min-width:520px){ body{align-items:center} #app{height:min(94vh,920px);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.6)} }

/* ---------- HUD ---------- */
#hud{position:relative;z-index:10;background:linear-gradient(180deg,#10203d,#0b1426);padding:10px 12px 9px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid #1e2a48}
.hud-row{display:flex;align-items:center;gap:10px}
.hud-score,.hud-time{display:flex;flex-direction:column;line-height:1;min-width:64px}
.hud-time{align-items:flex-end}
.lbl{font-size:.6rem;letter-spacing:.14em;color:var(--muted);font-weight:600;margin-bottom:3px}
#score{font-size:1.5rem;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;display:inline-block}
.hud-score.bump #score{animation:bump .35s}
.hud-score.down #score{color:#f87171}
#timer{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
#mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:.9rem}
#mid .mini{display:block;width:90px;height:6px;border-radius:3px;background:#1a2645;overflow:hidden}
#mid .mini i{display:block;height:100%;background:var(--green);transition:width .4s}
#mid .hearts{font-size:.95rem;letter-spacing:1px}
#mute{background:none;border:none;font-size:1.05rem;padding:4px;cursor:pointer;opacity:.85}
.timebar{height:7px;background:#1a2645;border-radius:4px;margin-top:8px;overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#16a34a,#86efac);transition:width .2s linear}
#hud.endless .timebar i{background:linear-gradient(90deg,#7c3aed,#c4b5fd)}
#hud.warn .timebar i{background:linear-gradient(90deg,#d97706,var(--gold))}
#hud.danger .timebar i{background:linear-gradient(90deg,#b91c1c,#f87171)}
#hud.danger #timer{color:#f87171;animation:pulse .5s infinite}
.streak{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%) scale(0);background:linear-gradient(90deg,#f97316,#ef4444);padding:3px 11px;border-radius:99px;font-size:.75rem;font-weight:700;transition:transform .25s;z-index:12;white-space:nowrap;box-shadow:0 4px 12px rgba(239,68,68,.4)}
.streak.on{transform:translateX(-50%) scale(1)}
.streak.pop{animation:streakPop .5s}

/* ---------- Stage ---------- */
#stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.scene{position:relative;flex:1 1 auto;min-height:150px;overflow:hidden;background:#000}
.scene.fade-in{animation:fadeIn .55s ease-out}
.layer{position:absolute;inset:0}
.layer>img{width:100%;height:100%;object-fit:cover;display:block;will-change:transform}
.sheet{flex:0 0 auto;position:relative;z-index:5;background:var(--panel);border-radius:22px 22px 0 0;margin-top:-20px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.sheet:empty{display:none}
.sheet.in{animation:sheetIn .38s cubic-bezier(.2,.9,.3,1.15)}
.sheet.scroll{max-height:66dvh;max-height:66vh;overflow-y:auto}
#fx{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}
#toasts{position:absolute;left:0;right:0;bottom:120px;display:flex;flex-direction:column-reverse;align-items:center;gap:6px;z-index:26;pointer-events:none}
.toast{background:rgba(8,14,30,.9);border:1px solid rgba(255,255,255,.18);padding:6px 13px;border-radius:99px;font-size:.84rem;font-weight:600;animation:toast 2.6s forwards;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.toast.bad{border-color:#ef4444;color:#fecaca}
#stage.danger::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:15;box-shadow:inset 0 0 70px rgba(239,68,68,.6);animation:pulse 1s infinite}
.sheet-h{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:2px 2px 8px;gap:8px}
.sheet-h b{color:var(--text);font-size:.85rem;letter-spacing:.04em}

/* ---------- Buttons ---------- */
.btn{border:none;border-radius:16px;padding:14px 16px;font-size:1.05rem;font-weight:700;color:#fff;background:var(--sky2);box-shadow:0 5px 0 #0369a1;cursor:pointer;width:100%;transition:transform .08s,box-shadow .08s,filter .2s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0369a1}
.btn.big{font-size:1.2rem;padding:16px}
.btn small{font-size:.8rem;opacity:.8;margin-left:6px}
.btn.green{background:var(--green);box-shadow:0 5px 0 #15803d}
.btn.green:active{box-shadow:0 1px 0 #15803d}
.btn.hold{background:#dc2626;box-shadow:0 5px 0 #991b1b;flex:0 0 38%}
.btn.hold:active{box-shadow:0 1px 0 #991b1b}
.btn.hold.urge{animation:urge .55s infinite}
.btn.purple{background:#7c3aed;box-shadow:0 5px 0 #5b21b6}
.btn.gold{background:#d97706;box-shadow:0 5px 0 #92400e}
.btn.ghost{background:#24304f;box-shadow:0 5px 0 #141c33}
.btn:disabled{filter:grayscale(1) brightness(.55);cursor:default}
.btn:disabled:active{transform:none}
.btn.ready{animation:ready 1s infinite}
.btn.pulse{animation:ready 1.4s infinite}
.actions{display:flex;gap:10px}

/* ---------- Menus ---------- */
.kb>img{animation:kenburns 16s ease-in-out infinite alternate;transform-origin:62% 35%}
.shade{background:linear-gradient(180deg,rgba(7,11,22,.1) 30%,rgba(7,11,22,.85))}
.title{position:absolute;left:0;right:0;bottom:34px;text-align:center;padding:0 16px}
.logo{font-size:2.9rem;font-weight:700;line-height:.92;text-shadow:0 4px 0 #0369a1,0 10px 30px rgba(0,0,0,.6);animation:logoIn .8s cubic-bezier(.2,1.4,.4,1) both}
.logo em{font-style:normal;color:var(--gold);text-shadow:0 4px 0 #b45309,0 10px 30px rgba(0,0,0,.6);display:inline-block;animation:wiggle 2.4s ease-in-out 1s infinite}
.tagline{margin-top:10px;color:#e0f2fe;font-weight:500;text-shadow:0 2px 8px #000;animation:fadeUp .6s .4s both}
.scene-title{position:absolute;left:0;right:0;top:18px;text-align:center;font-size:1.8rem;font-weight:700;text-shadow:0 3px 0 #0369a1,0 8px 20px rgba(0,0,0,.6);animation:dropIn .4s both}
.scene-title small{display:block;font-size:.85rem;color:#e0f2fe;font-weight:500;text-shadow:0 2px 6px #000}
.menu{display:flex;flex-direction:column;gap:12px}
.row2{display:flex;gap:10px}
.coins{display:inline-flex;align-items:center;gap:6px;background:#2a2410;border:1px solid #a16207;color:var(--gold);font-weight:700;padding:4px 12px;border-radius:99px;font-size:.9rem}
.topline{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.best-line{text-align:center;color:var(--muted);font-size:.82rem}
.unit{margin-bottom:14px;animation:chipIn .3s both}
.unit-h{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:7px}
.unit-h .ui{font-size:1.4rem}
.unit-h small{color:var(--muted);font-weight:500;font-size:.72rem;display:block}
.lvls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:9px 4px;text-align:center;box-shadow:0 4px 0 #0b1222;cursor:pointer}
.lv:active{transform:translateY(3px);box-shadow:0 1px 0 #0b1222}
.lv b{font-size:1.25rem;display:block;line-height:1.1}
.lv .s3{color:var(--gold);letter-spacing:1px;font-size:.95rem}
.lv .s3 .off{color:#334155}
.lv.locked{opacity:.4}
.lv.nextup{border-color:var(--sky);animation:ready 1.4s infinite}
.goal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.goal div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.goal b{display:block;font-size:1.15rem}
.goal span{font-size:.64rem;color:var(--muted)}
.targets{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-bottom:12px;font-size:.85rem}
.targets div{display:flex;justify-content:space-between;padding:4px 0}
.targets .s{color:var(--gold)}
.newskill{display:flex;gap:10px;align-items:center;background:linear-gradient(90deg,#3b0764,#1e1b4b);border:1px solid #7c3aed;border-radius:14px;padding:10px 12px;margin-bottom:12px;animation:chipIn .35s both}
.newskill>span{font-size:1.9rem}
.newskill b{display:block;font-size:.95rem}
.newskill p{font-size:.8rem;color:#ddd6fe;line-height:1.3}
.upg{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:9px 10px;margin-bottom:8px;animation:chipIn .3s both}
.upg .ic{font-size:1.6rem;width:32px;text-align:center}
.upg .tx{flex:1;min-width:0}
.upg .tx b{display:block;font-size:.95rem}
.upg .tx p{font-size:.74rem;color:var(--muted);line-height:1.2}
.pp i{display:inline-block;width:16px;height:6px;border-radius:3px;background:#334155;margin:4px 3px 0 0}
.pp i.on{background:var(--green)}
.upg .btn{width:auto;flex:0 0 auto;padding:9px 12px;font-size:.88rem}

/* ---------- Hallway map hub ---------- */
.map{position:absolute;inset:0;overflow:hidden;background:#b9d9c8;background-image:radial-gradient(rgba(255,255,255,.18) 1px,transparent 1px);background-size:14px 14px}
.corridor{position:absolute;left:34%;right:34%;top:0;bottom:0;background:repeating-linear-gradient(0deg,#9fb6cc 0 2px,#adc4d9 2px 38px);box-shadow:inset 7px 0 0 #3b78b3,inset -7px 0 0 #3b78b3}
.station{position:absolute;left:29%;right:29%;bottom:6%;height:8%;background:linear-gradient(#f5e7cf,#e0c9a2);border:3px solid #b08b5a;border-radius:12px;display:grid;place-items:center;color:#5b4126;font-weight:700;font-size:.78rem;box-shadow:0 5px 0 #8a6a40}
.room{position:absolute;width:32%;height:19%;transform:translateY(-50%);background:linear-gradient(#f6eddc,#e8d9bf);border:3px solid #8fb09d;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;padding:4px;transition:border-color .2s,box-shadow .2s;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.room.L{left:1.5%}.room.R{right:1.5%}
.room::after{content:'';position:absolute;top:24%;bottom:24%;width:8px;background:linear-gradient(#b67a43,#8f5a2c);border-radius:3px}
.room.L::after{right:-6px}.room.R::after{left:-6px}
.rm-top{display:flex;gap:5px;align-items:center;font-size:.78rem;font-weight:700;color:#334155}
.bulb{width:11px;height:11px;border-radius:50%;background:#94a3b8;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.ring{position:relative;width:52px;height:52px;border-radius:50%;padding:4px;display:block;background:rgba(0,0,0,.08)}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:50% 22%;display:block;border:2px solid #fff;filter:grayscale(.75) brightness(.92);transition:filter .3s}
.rm-ico{position:absolute;right:-8px;bottom:-5px;font-size:.9rem;background:#fff;border-radius:50%;width:24px;height:24px;display:grid;place-items:center;box-shadow:0 2px 4px rgba(0,0,0,.25);transform:scale(0);transition:transform .3s cubic-bezier(.2,1.5,.4,1)}
.rm-name{font-size:.66rem;color:#475569;font-weight:600;white-space:nowrap}
.rm-q{position:absolute;top:-11px;width:28px;height:28px;border-radius:50%;background:var(--sky2);color:#fff;font-weight:700;display:grid;place-items:center;border:3px solid #fff;transform:scale(0);transition:transform .25s cubic-bezier(.2,1.5,.4,1);box-shadow:0 3px 8px rgba(0,0,0,.3)}
.room.L .rm-q{right:-11px}.room.R .rm-q{left:-11px}
.room.call{border-color:#f59e0b;animation:callPulse 1.2s infinite}
.room.call .bulb{background:#fbbf24;box-shadow:0 0 10px 3px rgba(251,191,36,.85);animation:blink .9s infinite}
.room.call .ring{background:conic-gradient(var(--rc,#22c55e) calc(var(--p,1)*1turn),rgba(0,0,0,.12) 0)}
.room.call .ring img{filter:none}
.room.call .rm-ico{transform:scale(1)}
.room.urgent{border-color:#ef4444}
.room.urgent .bulb{background:#ef4444;box-shadow:0 0 12px 4px rgba(239,68,68,.9);animation:blink .35s infinite}
.room.urgent .ring{animation:wobble .4s infinite}
.room.q{border-color:var(--sky2);box-shadow:0 0 0 4px rgba(14,165,233,.4),0 4px 0 rgba(0,0,0,.12);animation:none}
.room.q .rm-q{transform:scale(1)}
.route{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.route polyline{fill:none;stroke:#0284c7;stroke-width:4;stroke-dasharray:2 10;stroke-linecap:round;stroke-linejoin:round;animation:dash .6s linear infinite;opacity:.9}
.nurse{position:absolute;left:0;top:0;width:48px;height:48px;z-index:5;will-change:transform;pointer-events:none}
.nurse .face{position:absolute;inset:0;border-radius:50%;background-size:124px auto;background-position:-16px -34px;border:3px solid #fff;box-shadow:0 5px 12px rgba(0,0,0,.35),0 0 0 3px #2563eb}
.nurse .minicart{position:absolute;width:22px;height:26px;left:36px;top:18px;background:linear-gradient(#f8fafc,#cbd5e1);border:2px solid #64748b;border-radius:5px;box-shadow:inset 0 7px 0 -4px #3b82f6,inset 0 14px 0 -11px #3b82f6,0 3px 6px rgba(0,0,0,.3)}
.nurse.walk .face{animation:step .32s ease-in-out infinite alternate}
.coach{position:absolute;z-index:7;background:#fff;color:#0f172a;font-weight:700;padding:6px 11px;border-radius:12px;font-size:.84rem;white-space:nowrap;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.3);display:none}
.coach.on{display:block;animation:coach .6s ease-in-out infinite alternate}
.hub-tip{font-size:.9rem;font-weight:600;color:#dbe4f5;text-align:center;min-height:22px;line-height:1.3}
.hub-tip small{display:block;font-size:.72rem;color:var(--muted);font-weight:500}

/* ---------- Door ---------- */
.door-wrap{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .6s cubic-bezier(.55,0,.85,.4),filter .6s}
.door-wrap.approach{animation:approach .45s ease-out backwards}
.door-wrap.enter{transform:scale(2.5);filter:brightness(1.35)}
.wall{position:absolute;inset:0;background:linear-gradient(180deg,#d3ecdf 0%,#c3e3d3 80%,#eadcc5 80%,#eadcc5 82%,#a8bdd1 82%,#8ea6be 100%)}
.wall::before{content:'';position:absolute;left:0;right:0;top:57%;height:12px;background:linear-gradient(#5b9bd5,#3b78b3);border-radius:6px;box-shadow:0 3px 4px rgba(0,0,0,.15)}
.frame{position:absolute;left:16%;right:16%;top:8%;bottom:18%;border:12px solid #7c5530;border-bottom:none;border-radius:8px 8px 0 0;overflow:hidden;perspective:1100px;background:#1a1410;box-shadow:0 0 0 3px rgba(0,0,0,.12),0 18px 40px rgba(0,0,0,.25)}
.room-in{position:absolute;inset:0}
.room-in img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);transition:transform 1.2s ease-out}
.door-wrap.open .room-in img{transform:scale(1)}
.leaf{position:absolute;inset:0;transform-origin:left center;transition:transform .7s cubic-bezier(.45,0,.2,1);background:linear-gradient(90deg,#a86d3a,#c88c52 45%,#b27741 80%,#9a6334);box-shadow:inset -8px 0 14px rgba(0,0,0,.18),inset 6px 0 10px rgba(255,255,255,.08);backface-visibility:hidden}
.door-wrap.open .leaf{transform:rotateY(-100deg)}
.leaf.knocked{animation:knock .4s}
.pnl{position:absolute;left:13%;right:13%;border:3px solid rgba(0,0,0,.14);border-radius:8px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.07)}
.pnl.a{top:36%;height:20%}.pnl.b{top:62%;height:32%}
.plaque{position:absolute;left:50%;top:9%;transform:translateX(-50%);background:linear-gradient(#1d4ed8,#1e3a8a);border:3px solid #dbeafe;border-radius:10px;padding:5px 14px 6px;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.3);white-space:nowrap}
.plaque b{display:block;font-size:1.8rem;line-height:1}
.plaque span{font-size:.72rem;color:#dbeafe}
.knob{position:absolute;right:9%;top:52%;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f8fafc,#64748b)}
.knob::after{content:'';position:absolute;right:8px;top:6px;width:30px;height:8px;border-radius:4px;background:linear-gradient(#e2e8f0,#64748b)}
.bubble{position:absolute;left:50%;top:3%;transform:translateX(-50%) scale(0);background:#fff;color:#0f172a;font-weight:700;padding:6px 14px;border-radius:16px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:3;--tx:-50%}
.bubble.show{animation:popIn .3s forwards}
.skip{position:absolute;right:12px;bottom:12px;font-size:.75rem;color:#fff;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:99px;z-index:4}

/* ---------- Room ---------- */
.room-l>img{transition:transform 1s cubic-bezier(.3,0,.2,1),filter .4s}
.room-l>img.dim{filter:brightness(.78) saturate(.9)}
.room-l>img.zoom{transform:scale(1.38)}
.room-l>img.held{filter:grayscale(.8) brightness(.6)}
.pt-banner{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:10px;background:rgba(8,14,30,.82);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:8px 10px;animation:dropIn .45s .15s both;z-index:2}
.pt-banner img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 22%;border:3px solid var(--green);flex:none}
.pt-banner b{display:block;font-size:.98rem;line-height:1.1}
.pt-banner span{font-size:.74rem;color:#cbd5e1}
.pt-tags{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.allergy{background:#7f1d1d;border:1px solid var(--red);color:#fecaca!important;font-size:.66rem!important;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;animation:pulse 1.4s infinite}
.nka{background:#14532d;border:1px solid var(--green);color:#bbf7d0!important;font-size:.66rem!important;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.ktag{background:#1e3a8a;border:1px solid #60a5fa;color:#dbeafe!important;font-size:.66rem!important;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.say{position:absolute;right:14px;top:80px;max-width:62%;background:#fff;color:#0f172a;font-weight:600;font-size:.86rem;padding:7px 11px;border-radius:14px 14px 4px 14px;box-shadow:0 6px 16px rgba(0,0,0,.3);transform:scale(0);transform-origin:100% 100%;z-index:2}
.say.show{animation:popIn .35s forwards}
.mar{background:#f8fafc;color:#0f172a;border-radius:12px;padding:7px 12px;border-left:7px solid var(--sky2);background-image:repeating-linear-gradient(0deg,transparent 0 21px,#e2e8f0 21px 22px)}
.mar-row{display:flex;align-items:center;gap:10px}
.mar-h{font-size:.6rem;font-weight:700;color:#475569;letter-spacing:.1em;line-height:1.2;flex:none}
.mar-d{font-size:1.02rem;font-weight:700;line-height:1.2}
.mar-d small{display:block;font-size:.72rem;font-weight:600;color:#475569}
.mar-l{font-size:.8rem;font-weight:600;padding:2px 0;display:flex;justify-content:space-between;gap:8px}
.mar-l em{font-style:normal;color:#475569;font-size:.72rem;white-space:nowrap}
.cart{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bottle{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:14px;background:linear-gradient(180deg,#22305a,#18223b);border:2px solid var(--line);text-align:left;cursor:pointer;box-shadow:0 5px 0 #0b1222;min-height:70px;animation:binIn .35s both;transition:transform .08s,box-shadow .08s}
.bottle:active{transform:translateY(4px);box-shadow:0 1px 0 #0b1222}
.mini{position:relative;flex:none;width:26px;height:44px}
.mini::before{content:'';position:absolute;left:1px;right:1px;top:0;height:11px;border-radius:3px;background:var(--cap);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.mini::after{content:'';position:absolute;left:0;right:0;top:10px;bottom:0;border-radius:5px;background:linear-gradient(90deg,#c2410c,#fb923c 50%,#c2410c)}
.mini i{position:absolute;left:3px;right:3px;top:21px;height:13px;background:#fff;border-radius:2px;z-index:1}
.mini.pen::after{background:linear-gradient(90deg,#64748b,#e2e8f0 50%,#64748b);border-radius:8px}
.mini.juice::after{background:linear-gradient(90deg,#ea580c,#fdba74 50%,#ea580c)}
.bl{display:flex;flex-direction:column;line-height:1.08;min-width:0}
.bl b{font-size:.9rem;overflow-wrap:anywhere}
.bl b.long{font-size:.76rem}
.bl em{font-style:normal;font-size:1.15rem;font-weight:700;color:var(--sky)}
.erTag{position:absolute;right:6px;top:6px;background:#dc2626;color:#fff;font-size:.56rem;font-weight:700;padding:1px 5px;border-radius:4px;letter-spacing:.04em}
.bottle.right{border-color:var(--green);background:#0f2f1e;animation:liftOut .55s forwards}
.bottle.nope{border-color:var(--red);background:#3a0f12;animation:shakeX .4s;opacity:.55}
.bottle.nope::after{content:'✕';position:absolute;right:8px;bottom:4px;color:var(--red);font-weight:700;font-size:1.3rem}
.lcd{font-family:ui-monospace,Menlo,monospace;background:#0b2e1a;color:#4ade80;border-radius:12px;padding:6px 12px;font-size:1.9rem;font-weight:700;text-align:center;border:3px solid #334155;text-shadow:0 0 10px rgba(74,222,128,.6);margin-bottom:10px}
.lcd small{font-size:.8rem;color:#86efac}
.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:10px}
.scale div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 2px;text-align:center;font-size:.66rem;color:var(--muted)}
.scale b{display:block;font-size:.8rem;color:var(--text)}
.pain{display:flex;gap:3px;margin:8px 0 4px}
.pain i{flex:1;height:16px;border-radius:4px;background:#1e293b;font-style:normal;font-size:.6rem;display:grid;place-items:center;color:#475569}
.pain i.on{color:#fff}
.assess{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.medcard{display:flex;align-items:center;gap:12px;background:#f8fafc;color:#0f172a;border-radius:14px;padding:12px;margin-bottom:10px;position:relative}
.medcard b{font-size:1.15rem;display:block}
.medcard .sticker{display:inline-block;margin-top:4px;background:#dc2626;color:#fff;font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:6px;transform:rotate(-3deg)}
.medcard .mini{transform:scale(1.2)}
.note{font-size:.84rem;color:#dbe4f5;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:10px}
.mortar{display:grid;place-items:center;width:136px;height:136px;margin:4px auto 12px;border-radius:50%;border:none;cursor:pointer;background:conic-gradient(var(--green) calc(var(--p,0)*1turn),#1e293b 0);box-shadow:0 6px 0 #0b1222}
.mortar span{width:114px;height:114px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font-size:3.3rem}
.mortar.hit span{animation:grind .14s}

/* ---------- 5 Rights ---------- */
.chips{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:6px 10px;cursor:pointer;animation:chipIn .3s both;transition:background .2s,border-color .2s,transform .1s}
.chip:active{transform:scale(.98)}
.chip .ic{font-size:1.15rem;width:26px;text-align:center;flex:none}
.chip .tx{flex:1;min-width:0}
.chip .tx>b{font-size:.82rem;display:block;margin-bottom:1px}
.cmp{display:flex;gap:10px;font-size:.78rem;color:#dbe4f5;line-height:1.15}
.cmp>span{flex:1;min-width:0}
.cmp small{display:block;font-size:.55rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip .st{width:26px;height:26px;border-radius:50%;border:2px dashed #475569;display:grid;place-items:center;font-size:.9rem;font-weight:700;flex:none}
.chip.ok{background:#0f2f1e;border-color:var(--green)}
.chip.ok .st{border:none;background:var(--green);animation:stamp .3s}
.chip.ok .st::after{content:'✓'}
.chip.bad{background:#3a0f12;border-color:var(--red);animation:shakeX .4s}
.chip.bad .st{border:none;background:var(--red);animation:stamp .3s}
.chip.bad .st::after{content:'!'}
.chip.scanned .tx>b::after{content:' 📟';font-size:.7rem}

/* ---------- Tally / results ---------- */
.tally{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-bottom:12px}
.trow{display:flex;justify-content:space-between;padding:6px 0;font-size:.92rem;animation:rowIn .3s both;border-bottom:1px dashed #2d3b63}
.trow:last-child{border-bottom:none}
.trow b{color:var(--gold);font-variant-numeric:tabular-nums}
.trow.total{font-size:1.05rem;font-weight:700}
.trow.neg b{color:#f87171}
.msg{font-size:.9rem;color:#dbe4f5;line-height:1.35;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.okc{color:var(--green)!important}
.badc{color:#f87171!important}
.goldc{color:var(--gold)!important}
.end-shade{background:linear-gradient(180deg,rgba(7,11,22,.35),rgba(7,11,22,.85))}
.end-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 12px}
.et{font-size:2.2rem;font-weight:700;text-shadow:0 4px 0 #0369a1,0 10px 30px rgba(0,0,0,.6);animation:logoIn .7s both}
.et small{display:block;font-size:.9rem;color:#e0f2fe;text-shadow:0 2px 6px #000}
.stars{margin-top:8px;font-size:3rem;letter-spacing:4px}
.stars span{display:inline-block;color:#334155;text-shadow:0 3px 0 #0f172a;animation:starIn .45s both}
.stars span.on{color:var(--gold);text-shadow:0 3px 0 #b45309,0 0 20px rgba(251,191,36,.6)}
.newbest{margin-top:6px;background:linear-gradient(90deg,#f97316,#ef4444);padding:4px 14px;border-radius:99px;font-weight:700;animation:popIn .4s 1.1s both, pulse 1s 1.5s infinite}
.final{text-align:center;margin-bottom:10px}
.final small{display:block;font-size:.62rem;letter-spacing:.14em;color:var(--muted)}
.final b{display:block;font-size:2.5rem;color:var(--gold);line-height:1.05;font-variant-numeric:tabular-nums}
.final span{font-size:.82rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.stats div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;animation:chipIn .3s both}
.stats b{display:block;font-size:1.25rem}
.stats span{font-size:.6rem;color:var(--muted);line-height:1.1;display:block}

/* ---------- FX ---------- */
.float{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:1.25rem;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 12px rgba(0,0,0,.4)}
.float.good{color:#4ade80}.float.bad{color:#f87171}.float.gold{color:var(--gold);font-size:1.7rem}
.spark{position:absolute;width:9px;height:9px;border-radius:50%}
.confetti{position:absolute;top:-12px;width:8px;height:13px;border-radius:2px}
.banner{position:absolute;left:50%;transform:translate(-50%,-50%);font-size:2.3rem;font-weight:700;white-space:nowrap;color:#fff;text-shadow:0 4px 0 #0369a1,0 10px 30px rgba(0,0,0,.6);animation:bannerIn 1.2s forwards}
.banner.good{color:#4ade80;text-shadow:0 4px 0 #15803d,0 10px 30px rgba(0,0,0,.6)}
.banner.bad{color:#f87171;text-shadow:0 4px 0 #991b1b,0 10px 30px rgba(0,0,0,.6)}
.banner.goldb{color:var(--gold);text-shadow:0 4px 0 #b45309,0 10px 30px rgba(0,0,0,.6)}
.banner.count{font-size:5rem}
.flash{position:absolute;inset:0;background:#fff;animation:flash .45s forwards}
.cup{position:absolute;width:40px;height:36px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.cup::before{content:'';position:absolute;inset:0;clip-path:polygon(0 0,100% 0,84% 100%,16% 100%);background:radial-gradient(circle at 34% 22%,#f472b6 0 5px,transparent 6px),radial-gradient(circle at 62% 26%,#fbbf24 0 5px,transparent 6px),radial-gradient(circle at 48% 12%,#fff 0 4px,transparent 5px),linear-gradient(#ffffff,#d6e0ee)}
.cup.syr::before{clip-path:none;inset:14px 0;border-radius:4px;background:linear-gradient(90deg,#f97316 0 18%,#e2e8f0 18% 78%,#94a3b8 78% 84%,#cbd5e1 84%)}
#app.shake{animation:shake .4s}

/* ---------- Keyframes ---------- */
@keyframes pulse{50%{opacity:.55}}
@keyframes blink{50%{opacity:.35}}
@keyframes bump{40%{transform:scale(1.3)}}
@keyframes streakPop{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.45)}100%{transform:translateX(-50%) scale(1)}}
@keyframes sheetIn{from{transform:translateY(60%);opacity:0}}
@keyframes fadeIn{from{opacity:0;filter:brightness(2.2)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
@keyframes chipIn{from{opacity:0;transform:translateY(10px)}}
@keyframes rowIn{from{opacity:0;transform:translateX(-14px)}}
@keyframes binIn{from{opacity:0;transform:scale(.7)}}
@keyframes liftOut{40%{transform:translateY(-14px) scale(1.06)}100%{transform:translateY(-30px) scale(.9);opacity:0}}
@keyframes shakeX{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(4px,0)}}
@keyframes stamp{from{transform:scale(2.2);opacity:0}}
@keyframes ready{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25);transform:scale(1.02)}}
@keyframes urge{50%{transform:scale(1.06);filter:brightness(1.3)}}
@keyframes logoIn{from{opacity:0;transform:scale(.4) rotate(-6deg)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-4deg)}20%{transform:rotate(4deg)}30%{transform:rotate(0)}}
@keyframes kenburns{from{transform:scale(1.05)}to{transform:scale(1.22) translate(-2%,1%)}}
@keyframes dropIn{from{opacity:0;transform:translateY(-16px)}}
@keyframes popIn{from{transform:translateX(var(--tx,0)) scale(0)}70%{transform:translateX(var(--tx,0)) scale(1.12)}to{transform:translateX(var(--tx,0)) scale(1)}}
@keyframes approach{from{transform:scale(.8);filter:brightness(.8)}}
@keyframes knock{15%,55%{transform:scale(1.012) translateX(-3px)}30%,70%{transform:scale(1)}}
@keyframes bannerIn{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4) rotate(-8deg)}14%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}80%{opacity:1;transform:translate(-50%,-50%) scale(1.04) rotate(-4deg)}100%{opacity:0;transform:translate(-50%,-80%) scale(1.04) rotate(-4deg)}}
@keyframes flash{from{opacity:.85}to{opacity:0}}
@keyframes starIn{from{opacity:0;transform:scale(3) rotate(40deg)}}
@keyframes toast{0%{opacity:0;transform:translateY(-10px)}10%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
@keyframes callPulse{50%{box-shadow:0 0 0 5px rgba(245,158,11,.35),0 4px 0 rgba(0,0,0,.12)}}
@keyframes wobble{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes dash{to{stroke-dashoffset:-12}}
@keyframes step{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-3px) rotate(4deg)}}
@keyframes coach{from{transform:translate(-50%,-100%)}to{transform:translate(-50%,calc(-100% - 6px))}}
@keyframes grind{50%{transform:rotate(-12deg) scale(.94)}}
@media (prefers-reduced-motion:reduce){
  #app.shake,.kb>img,.room.call,.room.urgent .ring{animation:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">

      <div class="hud-time"><span class="lbl" id="tlbl">SHIFT</span><b id="timer">–:––</b></div>

</div>
<script>
/* =========================================================
   MedPass Madness — single-file time-management med-pass game
   ========================================================= */
const BASE = "https://raw.githubusercontent.com/WTFINATRUCK/medpass-madness/main/assets/";
const IMG = { hall: BASE+"hallway.jpg", door: BASE+"door.jpg", give: BASE+"giving.jpg", res1: BASE+"res1.jpg", res2: BASE+"res2.jpg" };
const SHARE_URL = "https://htmlpreview.github.io/?https://github.com/WTFINATRUCK/medpass-madness/blob/main/index.html";

/* ---------- Floor + residents (one per room) ---------- */
const ROOMS = [
  {num:'204',side:'L',y:.13},{num:'207',side:'R',y:.13},
  {num:'211',side:'L',y:.34},{num:'214',side:'R',y:.34},

  {num:'225',side:'L',y:.76},{num:'228',side:'R',y:.76}

ROOMS.forEach(r => r.dx = r.side === 'L' ? .425 : .575);
const RES = [
  {name:"Mrs. Eleanor Hayes",  age:78, allergy:"Penicillin", portrait:IMG.res1, greet:["Morning, sweetheart!","There's my nurse!"], thanks:["Thank you, dear!","You're an angel."]},
  {name:"Mr. James Whitaker",  age:82, allergy:"None",       portrait:IMG.res2, greet:["Is it pill time already?","Right on schedule."], thanks:["Good job, kiddo.","Much appreciated."]},
  {name:"Mrs. Doris Chen",     age:85, allergy:"Sulfa",      portrait:IMG.res1, greet:["Oh good, it's you!","Come in, come in!"], thanks:["You're my favorite nurse.","Bless you."]},
  {name:"Mr. Walter Brooks",   age:81, allergy:"None",       portrait:IMG.res2, greet:["About time!","Back again, huh?"], thanks:["Hmph. Thanks.","Not bad, rookie."]},

  {name:"Mrs. Betty Thompson", age:88, allergy:"None",       portrait:IMG.res1, greet:["Hello, honey!","I pressed the button!"], thanks:["Bless your heart.","Thank you, sugar."]},
  {name:"Mr. Frank Davis",     age:79, allergy:"Aspirin",    portrait:IMG.res2, greet:["Don't mix me up with Bob!","Howdy, nurse."], thanks:["Much obliged.","You're a lifesaver."]},
  {name:"Mrs. Rosa Alvarez",   age:83, allergy:"Latex",      portrait:IMG.res1, greet:["¡Hola, mija!","I was just ringing!"], thanks:["¡Gracias!","Muchas gracias, dear."]}
];
RES.forEach((r,i) => { r.room = i; const p = r.name.split(' '); r.title = p[0]; r.short = p[0]+' '+p[p.length-1]; });

/* ---------- Orders ---------- */
const STD = [
  ['Metformin 500mg',['Metformin 1000mg','Glipizide 5mg','Lisinopril 10mg']],
  ['Warfarin 2mg',['Warfarin 5mg','Aspirin 81mg','Eliquis 5mg']],
  ['Atorvastatin 20mg',['Atorvastatin 40mg','Simvastatin 20mg','Amlodipine 5mg']],
  ['Furosemide 20mg',['Furosemide 40mg','Hydrochlorothiazide 25mg','Spironolactone 25mg']],
  ['Omeprazole 20mg',['Omeprazole 40mg','Pantoprazole 40mg','Famotidine 20mg']],
  ['Levothyroxine 50mcg',['Levothyroxine 75mcg','Liothyronine 25mcg','Lisinopril 10mg']],
  ['Donepezil 5mg',['Donepezil 10mg','Memantine 10mg','Doxepin 10mg']],
  ['Sertraline 50mg',['Sertraline 100mg','Trazodone 50mg','Citalopram 20mg']]
];
const rnd = n => Math.floor(Math.random()*n);
const VIT = [
  {label:'Metoprolol 25mg', decoys:['Metoprolol 50mg','Carvedilol 6.25mg','Atenolol 25mg'], holdIf:'HR < 60', ok:()=>`HR ${66+rnd(20)}`, low:()=>`HR ${48+rnd(9)}`},
  {label:'Lisinopril 10mg', decoys:['Lisinopril 20mg','Losartan 50mg','Metoprolol 25mg'], holdIf:'SBP < 100', ok:()=>`BP ${118+rnd(24)}/${70+rnd(12)}`, low:()=>`BP ${86+rnd(10)}/${52+rnd(8)}`},
  {label:'Digoxin 0.125mg', decoys:['Digoxin 0.25mg','Diltiazem 30mg','Amiodarone 200mg'], holdIf:'HR < 60', ok:()=>`HR ${68+rnd(18)}`, low:()=>`HR ${46+rnd(10)}`},
  {label:'Amlodipine 5mg', decoys:['Amlodipine 10mg','Nifedipine 30mg','Atorvastatin 20mg'], holdIf:'SBP < 100', ok:()=>`BP ${122+rnd(22)}/${72+rnd(10)}`, low:()=>`BP ${84+rnd(12)}/${50+rnd(8)}`}
];
const CRUSH_OK = [
  {label:'Donepezil 5mg', decoys:['Donepezil 10mg','Memantine 10mg','Bupropion XL 150mg']},
  {label:'Atorvastatin 20mg', decoys:['Atorvastatin 40mg','Nifedipine ER 30mg','Simvastatin 20mg']},
  {label:'Senna 8.6mg', decoys:['Senna 17.2mg','Docusate 100mg','Bisacodyl 5mg']},
  {label:'Sertraline 50mg', decoys:['Sertraline 100mg','Bupropion XL 150mg','Trazodone 50mg']}
];
const CRUSH_ER = [
  {label:'Metoprolol ER 25mg', decoys:['Metoprolol 25mg','Metoprolol ER 50mg','Carvedilol 6.25mg']},
  {label:'Nifedipine ER 30mg', decoys:['Nifedipine ER 60mg','Amlodipine 5mg','Diltiazem 30mg']},
  {label:'Bupropion XL 150mg', decoys:['Bupropion XL 300mg','Sertraline 50mg','Trazodone 50mg']},
  {label:'Oxybutynin ER 5mg', decoys:['Oxybutynin ER 10mg','Tamsulosin 0.4mg','Finasteride 5mg']}
];
const PRN = [
  {label:'Acetaminophen 650mg', lo:1, hi:3, tier:'mild',     freq:6},
  {label:'Tramadol 50mg',       lo:4, hi:6, tier:'moderate', freq:6},
  {label:'Oxycodone 5mg',       lo:7, hi:10, tier:'severe',  freq:4}
];
const SCALE = [ {lo:0,hi:69,u:'hold',txt:'Hold + juice'}, {lo:70,hi:149,u:0,txt:'None'}, {lo:150,hi:199,u:2,txt:'2 units'}, {lo:200,hi:249,u:4,txt:'4 units'}, {lo:250,hi:299,u:6,txt:'6 units'}, {lo:300,hi:999,u:8,txt:'8u + call MD'} ];

const KIND = {
  std:    {icon:'💊', label:'Scheduled med'},
  vitals: {icon:'💓', label:'Check vitals', name:'Vital-sign holds', tip:"Heart & BP meds have hold parameters. Read the bedside vitals — if they're out of range, HOLD."},
  crush:  {icon:'🥄', label:'Crush meds',   name:'Crushed meds', tip:"Some residents need pills crushed in applesauce. ER / XL tablets can NEVER be crushed — call pharmacy."},
  insulin:{icon:'🩸', label:'Blood sugar',  name:'Sliding-scale insulin', tip:"Check the blood sugar, then draw up units from the scale. Under 70? Hold the insulin and give juice."},
  prn:    {icon:'😣', label:'Pain',         name:'PRN pain meds', tip:"Ask the pain score and pick the PRN whose range matches. Last dose too recent? Hold."}
};
const WHY = {
  patient: c => `The wristband said <b>${c.task.wrongName}</b>, not ${c.res.name}. Wrong patient — med held & band fixed.`,
  time:    () => `It was already given today at <b>0812</b>. Giving it again = double dose.`,
  route:   () => `Resident is <b>NPO</b> pending a swallow eval — nothing by mouth. Provider notified.`,
  vitals:  c => `<b>${c.task.reading}</b> is outside the hold parameter (hold if ${c.task.holdIf}). Held & provider notified.`,
  prnTime: c => `Last dose was only <b>1h 50m ago</b> — the order is every ${c.task.freq}h. Too soon. You offered ice & repositioning.`,
  hypo:    c => `BG <b>${c.task.bg}</b> is hypoglycemia! Insulin held, 4 oz juice given, recheck in 15 min.`,
  er:      c => `<b>${c.task.drug}</b> is extended-release — crushing dumps the whole dose at once. Pharmacy is sending a liquid form.`
};
const SHORT = {patient:'WRONG PATIENT', time:'ALREADY GIVEN', route:'NPO', vitals:'OUT OF RANGE', prnTime:'TOO SOON', hypo:'LOW SUGAR', er:'DO NOT CRUSH'};

/* ---------- Career ---------- */
const UNITS = [
  {name:'Memory Care', icon:'🌸', levels:[
    {n:4,  time:120, maxActive:2, patience:52, spawnEvery:13, kinds:['std'], trapRate:.2},
    {n:6,  time:150, maxActive:3, patience:46, spawnEvery:11, kinds:['std'], trapRate:.25},
    {n:7,  time:165, maxActive:3, patience:42, spawnEvery:10, kinds:['std'], trapRate:.3}]},
  {name:'Rehab', icon:'🦽', levels:[
    {n:6,  time:165, maxActive:3, patience:48, spawnEvery:11, kinds:['std','vitals'], trapRate:.25, focus:'vitals'},
    {n:7,  time:180, maxActive:3, patience:46, spawnEvery:11, kinds:['std','vitals','crush'], trapRate:.25, focus:'crush'},
    {n:8,  time:195, maxActive:4, patience:44, spawnEvery:10, kinds:['std','vitals','crush'], trapRate:.3}]},
  {name:'Med-Surg', icon:'🏥', levels:[

/* ---------- Task generation ---------- */
function makeTask(res, kind){
  const t = {kind, trap:null};
  const opts = (correct, decoys) => { let d = shuffle(decoys); if (SAVE.up.cart) d = d.slice(0, d.length-1); return shuffle([correct, ...d]).map(optFrom); };
  const maybePatient = p => { if (Math.random() < p){ t.trap = 'patient'; t.wrongName = pick1(RES.filter(x => x !== res && x.title === res.title)).name; } };
  if (kind === 'std'){
    const [lab, dec] = pick1(STD); Object.assign(t, {correct:lab, options:opts(lab, dec)});
    [t.drug, t.dose] = splitLabel(lab);
    t.mar = `<div class="mar-row"><div class="mar-h">MAR<br>0900</div><div class="mar-d">${lab} PO<small>Daily · scheduled</small></div></div>`;
    if (Math.random() < G.trapRate){ const k = pick1(['patient','time','route']); if (k==='patient') maybePatient(1); else t.trap = k; }
  } else if (kind === 'vitals'){
    const o = pick1(VIT); Object.assign(t, {correct:o.label, options:opts(o.label, o.decoys), holdIf:o.holdIf});
    [t.drug, t.dose] = splitLabel(o.label);
    if (Math.random() < .3){ t.trap = 'vitals'; t.reading = o.low(); } else { t.reading = o.ok(); maybePatient(G.trapRate*.4); }
    t.mar = `<div class="mar-row"><div class="mar-h">MAR<br>0900</div><div class="mar-d">${o.label} PO<small>Daily · HOLD if ${o.holdIf}</small></div></div>`;
  } else if (kind === 'crush'){
    const er = Math.random() < .35, o = pick1(er ? CRUSH_ER : CRUSH_OK);
    Object.assign(t, {correct:o.label, options:opts(o.label, o.decoys), er});
    [t.drug, t.dose] = splitLabel(o.label);
    t.mar = `<div class="mar-row"><div class="mar-h">MAR<br>0900</div><div class="mar-d">${o.label} PO<small>Daily · 🥄 swallow precautions: crush meds</small></div></div>`;
    if (!er) maybePatient(G.trapRate*.4);
  } else if (kind === 'insulin'){
    const r = Math.random();
    const bg = r < .18 ? 52+rnd(15) : r < .4 ? 150+rnd(50) : r < .65 ? 200+rnd(50) : r < .85 ? 250+rnd(50) : 300+rnd(60);
    const row = SCALE.find(s => bg >= s.lo && bg <= s.hi);
    Object.assign(t, {bg, units:row.u, drug:'Insulin lispro'});
    t.dose = row.u === 'hold' ? '—' : `${row.u} units`;
    if (row.u === 'hold') t.trap = 'hypo'; else maybePatient(G.trapRate*.3);
    const all = ['hold',2,4,6,8].filter(u => u !== row.u);
    let others = shuffle(all).slice(0, SAVE.up.cart ? 2 : 3);
    t.options = shuffle([row.u, ...others]).map(u => u === 'hold' ? {key:'hold', name:'Hold insulin', dose:'Give juice', juice:true} : {key:u, name:'Insulin lispro', dose:`${u} units`, pen:true});
    t.correct = row.u;
    t.mar = `<div class="mar-row"><div class="mar-h">MAR<br>AC</div><div class="mar-d">Insulin lispro SubQ<small>Per sliding scale · before meals</small></div></div>`;
  } else if (kind === 'prn'){
    const pain = 2 + rnd(8), o = PRN.find(p => pain >= p.lo && pain <= p.hi);
    Object.assign(t, {pain, correct:o.label, freq:o.freq, options:opts(o.label, [...PRN.filter(p=>p!==o).map(p=>p.label), 'Ibuprofen 400mg'])});
    [t.drug, t.dose] = splitLabel(o.label);
    if (Math.random() < .3) t.trap = 'prnTime';
    t.mar = `<div class="mar-h" style="margin-bottom:2px">MAR · PRN PAIN ORDERS</div>${PRN.map(p => `<div class="mar-l"><span>${p.label} PO</span><em>q${p.freq}h · ${p.tier} ${p.lo}–${p.hi}</em></div>`).join('')}`;
  }
  return t;
}
function chooseKind(res){
  let ks = G.kinds.slice(); if (res.allergy === 'Codeine') ks = ks.filter(k => k !== 'prn');
  if (G.focus && ks.includes(G.focus)){
    if (!G.focusSeen && G.spawned >= 1){ G.focusSeen = true; return G.focus; }
    if (Math.random() < .35) return G.focus;
  }
  return pick1(ks);
}

/* ---------- Game tick: timers, spawns, patience ---------- */
function gameTick(){
  if (!G || !G.active || G.ended) return;
  const now = performance.now(), dt = (now - G.lastTick)/1000; G.lastTick = now;
  if (document.hidden || dt > 1) return;
  if (G.mode === 'career'){ G.time -= dt; const s = Math.ceil(G.time); if (s !== G.lastSec){ G.lastSec = s; if (s <= 15 && s > 0) sfx.tick(); } }
  else G.elapsed += dt;
  G.cool = G.cool.map(c => Math.max(0, c-dt));
  G.spawnTimer -= dt;
  if (G.spawned < G.n && G.calls.length < G.maxActive && (G.spawnTimer <= 0 || G.calls.length === 0)){
    if (spawnCall()) G.spawnTimer = G.spawned === 1 ? 3.5 : G.spawnEvery*(.75+Math.random()*.5);
  }
  for (const c of G.calls.slice()){ if (c.inProgress) continue; c.patience -= dt; if (c.patience <= 0) missCall(c); }
  renderHud();
  if (G.view === 'hub') updateRooms();
  if (G.mode === 'career'){
    if (G.time <= 0) return endShift(false);
    if (G.spawned >= G.n && G.calls.length === 0 && !G.visit) return endShift(true);
  } else if (G.hearts <= 0) return endShift(false);
}
function spawnCall(){
  const busy = new Set(G.calls.map(c => c.room));
  const free = RES.filter(r => !busy.has(r.room) && G.cool[r.room] <= 0 && !(G.visit && G.visit.room === r.room));
  if (!free.length) return false;
  const res = pick1(free), kind = chooseKind(res), task = makeTask(res, kind);
  const max = G.patienceBase * (1 + .15*SAVE.up.manner) * (kind==='insulin'||kind==='prn'||kind==='crush' ? 1.12 : 1);
  const c = {id:++G.cid, res, room:res.room, task, patience:max, max};
  G.calls.push(c); G.spawned++; sfx.chime();
  if (G.view !== 'hub') toast(`🔔 Room ${ROOMS[res.room].num} is calling ${KIND[kind].icon}`);
  else { const el = MAP && MAP.rooms[res.room]; if (el){ const p = elCenter(el); floatText('🔔', '', p.x, p.y-40, 900); } }
  return true;
}
function missCall(c){
  G.calls = G.calls.filter(x => x !== c); G.queue = G.queue.filter(id => id !== c.id);
  G.stats.missed++; G.streak = 0; renderStreak(); G.resolved++; G.cool[c.room] = 6;
  addScore(-100); sfx.bad(); vib([80,40,80]);
  if (G.mode === 'endless'){ G.hearts--; ramp(); }
  const num = ROOMS[c.room].num;
  if (G.view === 'hub' && MAP){ const p = elCenter(MAP.rooms[c.room]); floatText('😤 −100', 'bad', p.x, p.y-20, 1300); shake(); toast(`Room ${num} gave up waiting`, 'bad'); }
  else toast(`😤 Room ${num} gave up waiting · −100`, 'bad');
}
function ramp(){
  if (G.mode !== 'endless') return;
  const k = G.resolved;
  if (k % 3 === 0){ G.patienceBase = Math.max(24, G.patienceBase*.93); G.spawnEvery = Math.max(4.5, G.spawnEvery*.9); }
  if (k % 6 === 0 && G.maxActive < 5){ G.maxActive++; toast(`⚡ Things are heating up — ${G.maxActive} calls at once!`); }
}

function callAt(i){ return G.calls.find(c => c.room === i && !c.inProgress); }
function tapRoom(i){

function updateRooms(){

  MAP.rooms.forEach((el,i) => {

  const waiting = G.calls.filter(c => !c.inProgress).length;
  MAP.tip.innerHTML = G.queue.length

    : waiting ? `🔔 ${waiting} call light${waiting>1?'s':''} on — tap rooms to plan your route<small>Most urgent first? Or closest first? Your call.</small>`
    : `☕ All quiet… next call any second<small>${G.mode==='career' ? `${G.n - G.spawned} more resident${G.n-G.spawned===1?'':'s'} this shift` : 'Endless shift'}</small>`;
}
function buildPath(from, room){
  const pts = [];
  if (Math.abs(from.x-.5) > .002) pts.push({x:.5, y:from.y});
  if (Math.abs(from.y-room.y) > .002) pts.push({x:.5, y:room.y});
  pts.push({x:room.dx, y:room.y});
  return pts;
}
function hubLoop(){
  const tok = token; let last = performance.now();
  const N = G.nurse;
  const f = now => {
    if (tok !== token || !MAP) return;
    const dt = Math.min(.05, (now-last)/1000); last = now;
    const W = MAP.W, H = MAP.H;
    const targetId = G.queue[0], target = targetId != null ? G.calls.find(c => c.id === targetId) : null;
    let walking = false;
    if (target && G.active){
      const room = ROOMS[target.room];
      if (N.pathFor !== targetId || !N.path) { N.path = buildPath(N, room); N.pathFor = targetId; }
      let step = H * .62 * (1 + .2*SAVE.up.shoes) * dt;
      while (step > 0 && N.path.length){
        const wp = N.path[0], dx = (wp.x-N.x)*W, dy = (wp.y-N.y)*H, d = Math.hypot(dx,dy);
        if (d <= step){ N.x = wp.x; N.y = wp.y; N.path.shift(); step -= d; } else { N.x += dx/d*step/W; N.y += dy/d*step/H; step = 0; }
      }
      walking = true;
      if (!N.path.length){ G.queue.shift(); N.path = null; N.pathFor = null; positionNurse(false); enterVisit(target); return; }
      if (Math.random() < dt*3.2) sfx.step(.5);
    } else { N.path = null; N.pathFor = null; }
    positionNurse(walking);
    // dashed route preview
    let pts = [{x:N.x, y:N.y}], from = {x:N.x, y:N.y};
    G.queue.forEach((id,qi) => { const c = G.calls.find(x => x.id === id); if (!c) return; const p = (qi===0 && N.path) ? N.path : buildPath(from, ROOMS[c.room]); pts = pts.concat(p); from = p[p.length-1]; });
    MAP.line.setAttribute('points', pts.length > 1 ? pts.map(p => `${(p.x*W).toFixed(1)},${(p.y*H).toFixed(1)}`).join(' ') : '');
    rafId = requestAnimationFrame(f);
  };
  rafId = requestAnimationFrame(f);
}
function positionNurse(walking){
  if (!MAP) return;
  const N = G.nurse; MAP.nurse.style.transform = `translate(${N.x*MAP.W-24}px, ${N.y*MAP.H-24}px)`;
  MAP.nurse.classList.toggle('walk', walking);
}

      } else if (t.trap === 'hypo'){
        // giving insulin to a hypoglycemic resident is unsafe
        finishUnsafe(c, `BG ${t.bg} is LOW. Giving insulin would drop it further — hold insulin and give juice instead.`);
      } else wrongPick(c, b, '−75 Wrong dose', 'Is that the right amount?');
    };
    cart.appendChild(b);
  });
}
function stepPrep(c){
  const t = c.task, o = optFrom(t.correct);
  setSheet(`<div class="sheet-h"><span>🥄 Swallow precautions</span><b>Prep the med</b></div>
    <div class="medcard"><span class="mini" style="--cap:${capColor(o.name)}"><i></i></span><div><b>${t.correct}</b>${t.er ? '<span class="sticker">⚠ EXTENDED-RELEASE · DO NOT CRUSH</span>' : '<span style="font-size:.8rem;color:#475569">Immediate-release tablet</span>'}</div></div>
    <div class="note">Resident needs meds <b>crushed in applesauce</b>. Can this one be crushed?</div>
    <div class="actions"><button class="btn ghost" id="pharm" style="flex:0 0 44%">📞 Call pharmacy</button><button class="btn green" id="crush">🥄 Crush it</button></div>`);
  $('#pharm').onclick = () => {
    if (t.er) return finishHold(c, false, 'er');
    G.stats.slips++; G.streak = 0; renderStreak(); addScore(-50); sfx.bad();
    toast(`📞 Pharmacy: "That one's fine to crush!" · −50`, 'bad'); mortar(c);
  };
  $('#crush').onclick = () => { if (t.er) return finishUnsafe(c, `You crushed <b>${t.correct}</b> — an extended-release tablet. That dumps the whole day's dose at once. Should've called pharmacy.`); mortar(c); };
}
function mortar(c){
  let hits = 0; const need = 6;
  setSheet(`<div class="sheet-h"><span>Crush it!</span><b id="mc">0/${need}</b></div><button class="mortar" id="mortar" style="--p:0"><span>🥣</span></button><div class="hub-tip">Tap tap tap!</div>`);
  const m = $('#mortar');
  m.onclick = () => {
    if (!G.active || hits >= need) return;
    hits++; sfx.crunch(); vib(10); m.style.setProperty('--p', hits/need); $('#mc').textContent = `${hits}/${need}`;
    m.classList.remove('hit'); void m.offsetWidth; m.classList.add('hit');
    const p = elCenter(m); burst(p.x, p.y-20, 5, ['#e2e8f0','#fff','#cbd5e1']);
    if (hits >= need){ sfx.good(); floatText('Mixed in applesauce!', 'good', p.x, p.y-80); after(650, () => stepRights(c)); }
  };
}

/* ---------- Bedside check ---------- */
function rightsFor(c){
  const t = c.task, res = c.res;
  const rows = [
    {icon:'🪪', title:'Right Patient', a:['MAR',res.name], b:['Wristband', t.trap==='patient' ? t.wrongName : res.name], bad:t.trap==='patient', scan:2},
    {icon:'💊', title:'Right Drug', a:['MAR',t.drug], b:['Label',t.drug], scan:1},
    {icon:'⚖️', title:'Right Dose', a:['MAR',t.dose], b:['Label',t.dose], scan:1}
  ];
  let route = {a:['Order','PO (by mouth)'], b:['Bedside','Swallowing OK']}, time = {a:['Due','Daily 0900'], b:['Last given','Yesterday 0900']}, extra = null;
  if (t.kind === 'std'){
    if (t.trap === 'route') route = {...route, b:['Bedside','NPO – swallow eval'], bad:true};
    if (t.trap === 'time') time = {...time, b:['Last given','Today 0812 · RN Patel'], bad:true};
  } else if (t.kind === 'vitals'){
    extra = {icon:'💓', title:'Hold Parameters', a:['Hold if', t.holdIf], b:['Bedside', t.reading], bad:t.trap==='vitals'};
  } else if (t.kind === 'crush'){
    route = {a:['Order','PO · crushed'], b:['Prepared','In applesauce']};
  } else if (t.kind === 'insulin'){
    rows[2] = {icon:'⚖️', title:'Right Dose', a:['Scale', `BG ${t.bg} → ${t.units}u`], b:['Syringe', `${t.units} units`], scan:1};
    route = {a:['Order','SubQ'], b:['Site','Abdomen, rotated']};
    time = {a:['Due','Before meals'], b:['Bedside','Breakfast tray here']};
  } else if (t.kind === 'prn'){
    time = {a:['Frequency', `Every ${t.freq}h PRN`], b:['Last given', t.trap==='prnTime' ? '1h 50m ago' : 'Yesterday 2100'], bad:t.trap==='prnTime'};
  }
  rows.push({icon:'👄', title:'Right Route', ...route}, {icon:'⏰', title:'Right Time', ...time});
  if (extra) rows.push(extra);
  return rows;
}
function stepRights(c){
  phase(); G.view = 'visit';
  const img = $('#giveImg'); if (img) img.classList.add('dim');
  const rows = rightsFor(c), total = rows.length;
  let verified = 0, slipped = false;
  setSheet(`<div class="sheet-h"><span>Bedside check · tap each Right</span><b id="rc">0/${total}</b></div><div class="chips" id="chips"></div>
    <div class="actions"><button class="btn hold" id="hold">🛑 Hold</button><button class="btn green" id="give" disabled>${c.task.kind==='insulin'?'💉':'💊'} Administer</button></div>`);
  const chips = $('#chips'), rc = $('#rc'), give = $('#give'), hold = $('#hold');
  const verify = (rt, el, auto) => {
    if (el.classList.contains('ok') || el.classList.contains('bad') || !G.active) return;
    const p = elCenter(el);
    if (rt.bad){
      el.classList.add('bad'); hold.classList.add('urge');
      if (auto){ sfx.bad(); floatText('📟 Scanner alert!', 'bad', p.x, p.y-20); say('Wait… is that right?'); return; }
      slipped = true; sfx.bad(); shake(); G.streak = 0; renderStreak(); G.stats.slips++; addScore(-50);
      floatText(`−50 That doesn't match!`, 'bad', p.x, p.y-20); say('Wait… is that right?');
    } else {
      el.classList.add('ok'); if (auto) el.classList.add('scanned'); sfx.scan(); verified++; rc.textContent = `${verified}/${total}`;
      if (verified === total){ give.disabled = false; give.classList.add('ready'); rc.classList.add('okc'); sfx.good(); }
    }
  };
  const els = rows.map((rt,k) => {
    const el = document.createElement('button'); el.className = 'chip'; el.style.animationDelay = (k*50)+'ms';
    el.innerHTML = `<span class="ic">${rt.icon}</span><span class="tx"><b>${rt.title}</b><span class="cmp"><span><small>${rt.a[0]}</small>${rt.a[1]}</span><span><small>${rt.b[0]}</small>${rt.b[1]}</span></span></span><span class="st"></span>`;
    el.onclick = () => verify(rt, el, false);
    chips.appendChild(el); return el;
  });
  const sc = SAVE.up.scanner;
  if (sc) rows.forEach((rt,k) => { if (rt.scan && rt.scan <= sc) after(350 + k*180, () => verify(rt, els[k], true)); });
  give.onclick = () => { if (!give.disabled && G.active) finishPass(c); };
  hold.onclick = () => { if (!G.active) return; const trapRow = rows.some(r => r.bad); if (trapRow) finishHold(c, slipped, c.task.trap); else finishBadHold(c); };
}

/* ---------- Outcomes ---------- */
function outcomeSheet(html){
  setSheet(html + `<button class="btn big" id="nextBtn">Back to the hall ▸</button>`);
  const go = () => closeVisit(G.visit);
  $('#nextBtn').onclick = go;
  after(900, () => { tapHandler = go; });
  after(4200, go);
}
function finishPass(c){
  phase();
  G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak); G.stats.passes++; G.served++;
  const pb = Math.round(100*c.arriveFrac), sb = G.streak*20, total = 150 + pb + sb;
  addScore(total);
  outcomeSheet(`<div class="sheet-h"><span>Med pass · Rm ${ROOMS[c.room].num}</span><b class="okc">SAFE ✓</b></div>
    <div class="tally">
      <div class="trow" style="animation-delay:.8s"><span>${c.task.kind==='insulin'?'💉':'💊'} Safe administration</span><b>+150</b></div>
      <div class="trow" style="animation-delay:.95s"><span>⏱ Quick response</span><b>+${pb}</b></div>
      <div class="trow" style="animation-delay:1.1s"><span>🔥 Streak ×${G.streak}</span><b>+${sb}</b></div>
      <div class="trow total" style="animation-delay:1.25s"><span>Total</span><b>+${total}</b></div></div>`);
  const img = $('#giveImg'); img.classList.remove('dim');
  const hp = imgPt(img, .51, .555, 784, 1168); img.style.transformOrigin = `${hp.ex}px ${hp.ey}px`;
  requestAnimationFrame(() => img.classList.add('zoom'));
  sfx.pick();
  after(800, () => { sfx.fanfare(); vib(25); burst(hp.x, hp.y, 24); banner('SAFE PASS!', 'good', .3); floatText('+'+total, 'gold', hp.x, hp.y-40, 1400); renderStreak(true); say(pick1(c.res.thanks)); if (G.streak >= 3) confetti(24); });
}
function finishHold(c, slipped, key){
  phase();
  const img = $('#giveImg'); if (img){ img.classList.remove('dim'); img.classList.add('held'); }
  const pts = slipped ? 75 : 200 + G.streak*10;
  if (!slipped){ G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak); }
  G.stats.catches++; G.served++; addScore(pts);
  outcomeSheet(`<div class="sheet-h"><span>Held & reported</span><b class="goldc">${SHORT[key]}</b></div>
    <div class="msg">🛡️ ${WHY[key](c)}</div><div class="tally"><div class="trow total"><span>${slipped ? 'Caught (after a slip)' : 'Error prevented'}</span><b>+${pts}</b></div></div>`);
  const p = sceneCenter(.55);
  sfx.shield(); vib([20,40,20]); banner(slipped ? 'CAUGHT IT' : 'GREAT CATCH!', 'goldb', .55);
  burst(p.x, p.y, 20, ['#fbbf24','#fde68a','#ffffff']); floatText('+'+pts, 'gold', p.x, p.y+56, 1400); renderStreak(!slipped); say('Oh my, good catch!');
}
function finishBadHold(c){
  phase();
  const img = $('#giveImg'); if (img){ img.classList.remove('dim'); img.classList.add('held'); }
  G.streak = 0; renderStreak(); G.stats.badHolds++; addScore(-100);
  outcomeSheet(`<div class="sheet-h"><span>Unnecessary hold</span><b class="badc">MISSED DOSE</b></div>
    <div class="msg">Everything checked out — ${c.res.short} missed a dose they needed. Only hold when something doesn't match.</div>
    <div class="tally"><div class="trow total neg"><span>Missed dose</span><b>−100</b></div></div>`);
  const p = sceneCenter(.55); sfx.bad(); shake(); banner('DOSE MISSED', 'bad', .55); floatText('−100', 'bad', p.x, p.y+56, 1400); say(`But… where's my medicine?`);
}
function finishUnsafe(c, why){
  phase();
  const img = $('#giveImg'); if (img){ img.classList.remove('dim'); img.classList.add('held'); }
  G.streak = 0; renderStreak(); G.stats.unsafe++; addScore(-100);
  outcomeSheet(`<div class="sheet-h"><span>Med error</span><b class="badc">UNSAFE</b></div>
    <div class="msg">⚠️ ${why}</div><div class="tally"><div class="trow total neg"><span>Med error reported</span><b>−100</b></div></div>`);
  const p = sceneCenter(.55); sfx.bad(); shake(); banner('UNSAFE!', 'bad', .55); floatText('−100', 'bad', p.x, p.y+56, 1400); say('Oh dear…');
}
function closeVisit(c){
  if (!G || G.ended || !c) return;
  G.calls = G.calls.filter(x => x !== c); G.visit = null; G.cool[c.room] = 8; G.resolved++;
  ramp(); renderHud();
  if (G.mode === 'career' && G.spawned >= G.n && G.calls.length === 0) return endShift(true);
  if (G.mode === 'endless' && G.hearts <= 0) return endShift(false);
  const r = ROOMS[c.room]; G.nurse.x = r.dx; G.nurse.y = r.y;
  showHub();
}

/* ---------- End of shift ---------- */
function endShift(completed){
  if (!G || G.ended) return;
  G.ended = true; G.active = false; clearInterval(G.tickId); phase();
  stage.classList.remove('danger'); toastsEl.innerHTML = '';
  const S = G.stats, mistakes = S.wrongPicks + S.slips + S.badHolds + S.unsafe;
  let stars = 0, isBest = false, coins, title, sub, unlockedNext = false;
  if (G.mode === 'career'){
    const L = G.L;
    if (!completed) G.stats.missed += G.calls.length + (G.n - G.spawned);
    if (G.served >= Math.ceil(L.n*.7)) stars = 1;
    if (stars && G.score >= L.t2) stars = 2;
    if (stars === 2 && G.score >= L.t3 && mistakes === 0) stars = 3;
    const prevStars = starsOf(L.idx); if (stars > prevStars) SAVE.stars[L.idx] = stars;
    unlockedNext = prevStars === 0 && stars >= 1 && L.idx < LEVELS.length-1;
    isBest = G.score > (SAVE.best[L.idx]||0) && G.score > 0; if (isBest) SAVE.best[L.idx] = G.score;
    coins = Math.floor(G.score/10) + stars*15;
    title = stars ? 'SHIFT COMPLETE' : completed ? 'ROUGH SHIFT' : "TIME'S UP!"; sub = `${L.unit.icon} ${L.unit.name} · Level ${L.num}`;
  } else {
    isBest = G.score > SAVE.endlessBest && G.score > 0; if (isBest) SAVE.endlessBest = G.score;
    coins = Math.floor(G.score/10);
    title = 'SHIFT OVER'; sub = `∞ Endless · survived ${fmt(G.elapsed)}`;
  }
  SAVE.coins += coins; persist(); renderHud();

  let verdict;
  if (G.mode === 'endless') verdict = `You safely served <b>${G.served}</b> residents before running out of hearts.`;
  else if (stars === 3) verdict = `🏆 Flawless med pass. The charge nurse wants to know your secret.`;
  else if (!stars) verdict = `Serve at least ${Math.ceil(G.L.n*.7)} residents safely to earn a star. Plan your route — urgent rooms first!`;
  else if (S.unsafe) verdict = `⚠️ ${S.unsafe} med error${S.unsafe>1?'s':''}. Watch for ER tablets and low blood sugars.`;
  else if (S.badHolds) verdict = `🤔 ${S.badHolds} unnecessary hold${S.badHolds>1?'s':''} — only hold when something doesn't match.`;
  else if (S.slips) verdict = `👀 You verified something that didn't match. Read both columns before you tap.`;
  else if (S.wrongPicks) verdict = `💊 ${S.wrongPicks} wrong pull${S.wrongPicks>1?'s':''} from the cart — check drug <i>and</i> dose.`;
  else if (S.missed) verdict = `⏱ ${S.missed} resident${S.missed>1?'s':''} gave up waiting. Queue the most urgent rooms first.`;
  else verdict = `Need ${G.L.t3} for ★★★ — respond faster for bigger bonuses.`;

  sceneEl.className = 'scene';
  sceneEl.innerHTML = `<div class="layer kb"><img src="${stars||G.mode==='endless' ? IMG.give : IMG.hall}" alt=""></div><div class="layer end-shade"></div>
    <div class="end-title"><div class="et">${title}<small>${sub}</small></div>
    ${G.mode==='career' ? `<div class="stars">${[0,1,2].map(k=>`<span class="${k<stars?'on':''}" style="animation-delay:${.35+k*.25}s">★</span>`).join('')}</div>` : ''}
    ${isBest ? '<div class="newbest">NEW BEST!</div>' : ''}</div>`;
  const nextL = G.mode==='career' && G.L.idx < LEVELS.length-1 && unlocked(G.L.idx+1) ? LEVELS[G.L.idx+1] : null;
  setSheet(`<div class="final"><small>FINAL SCORE</small><b id="final">0</b><span>🪙 +${coins} coins${unlockedNext ? ' · 🔓 Level '+(G.L.num+1)+' unlocked!' : ''}</span></div>
    <div class="stats">
      <div style="animation-delay:.1s"><b class="okc">${S.passes}</b><span>Safe passes</span></div>
      <div style="animation-delay:.15s"><b class="goldc">${S.catches}</b><span>Errors caught</span></div>
      <div style="animation-delay:.2s"><b class="${mistakes?'badc':''}">${mistakes}</b><span>Mistakes</span></div>
      <div style="animation-delay:.25s"><b class="${S.missed?'badc':''}">${S.missed}</b><span>Gave up</span></div>
    </div>
    <div class="msg">${verdict}</div>
    <div class="actions"><button class="btn ghost" id="menu" style="flex:0 0 26%">☰</button><button class="btn ghost" id="share" style="flex:0 0 26%">↗</button>
      ${nextL && stars ? `<button class="btn big pulse" id="next">Next ▸</button>` : `<button class="btn big pulse" id="again">↻ Retry</button>`}</div>`);

  if (stars || G.mode==='endless') sfx.fanfare(); else sfx.bad();
  for (let k=0;k<stars;k++) after(350+k*250, () => sfx.star(k));
  if (stars >= 2 || isBest) after(500, () => confetti(70));
  const fin = $('#final'), t0 = performance.now(), to = G.score;
  const f = now => { if (!fin.isConnected) return; const k = Math.min(1,(now-t0)/1200); fin.textContent = Math.round(to*(1-Math.pow(1-k,3))); if (k<1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
  const mode = G.mode, L = G.L;
  $('#menu').onclick = () => mode==='career' ? showCareer() : showTitle();
  if ($('#again')) $('#again').onclick = () => { audio(); mode==='career' ? showLevelIntro(L) : startShift('endless'); };
  if ($('#next')) $('#next').onclick = () => { audio(); showLevelIntro(nextL); };
  $('#share').onclick = async () => {
    const text = mode==='career' ? `I got ${'★'.repeat(stars)||'0★'} on MedPass Madness level ${L.num} with ${to} points 💊 Can you beat it?` : `I scored ${to} in MedPass Madness Endless 💊 Can you beat it?`;
    try { if (navigator.share) await navigator.share({title:'MedPass Madness', text, url:SHARE_URL}); else { await navigator.clipboard.writeText(text+' '+SHARE_URL); toast('Link copied!'); } } catch(e){}
  };
}

/* ---------- Boot ---------- */
Object.values(IMG).forEach(src => { const i = new Image(); i.src = src; });
renderMute();
showTitle();
</script>
