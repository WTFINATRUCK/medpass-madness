<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1426">
<title>MedPass Madness</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16; --panel:#121a2e; --panel2:#1a2440; --line:#2a3658; --text:#eef2ff; --muted:#8b97b8;
  --sky:#38bdf8; --sky2:#0ea5e9; --green:#22c55e; --red:#ef4444; --gold:#fbbf24;
  --font:'Fredoka', ui-rounded, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);overflow:hidden}
body{font-family:var(--font);color:var(--text);display:flex;justify-content:center;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font-family:inherit;color:inherit}
#app{position:relative;width:100%;max-width:480px;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--panel);overflow:hidden}
@media (min-width:520px){ body{align-items:center} #app{height:min(94vh,920px);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.6)} }

/* ---------- HUD ---------- */
#hud{position:relative;z-index:10;background:linear-gradient(180deg,#10203d,#0b1426);padding:10px 12px 9px;padding-top:calc(10px + env(safe-area-inset-top));border-bottom:1px solid #1e2a48}
.hud-row{display:flex;align-items:center;gap:10px}
.hud-score,.hud-time{display:flex;flex-direction:column;line-height:1;min-width:64px}
.hud-time{align-items:flex-end}
.lbl{font-size:.6rem;letter-spacing:.14em;color:var(--muted);font-weight:600;margin-bottom:3px}
#score{font-size:1.5rem;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;display:inline-block}
.hud-score.bump #score{animation:bump .35s}
.hud-score.down #score{color:#f87171}
#timer{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
#pips{flex:1;display:flex;justify-content:center;gap:5px}
.pip{width:22px;height:22px;border-radius:50%;background:#1a2645;border:2px solid #2d3b63;font-size:.62rem;font-weight:700;display:grid;place-items:center;transition:all .3s}
.pip.cur{border-color:var(--sky);box-shadow:0 0 0 3px rgba(56,189,248,.28);animation:pulse 1s infinite}
.pip.done{background:var(--green);border-color:#86efac}
.pip.held{background:var(--gold);border-color:#fde68a;color:#422006}
.pip.missed{background:#7f1d1d;border-color:var(--red)}
#mute{background:none;border:none;font-size:1.05rem;padding:4px;cursor:pointer;opacity:.85}
.timebar{height:7px;background:#1a2645;border-radius:4px;margin-top:8px;overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#16a34a,#86efac);transition:width 1s linear}
#hud.warn .timebar i{background:linear-gradient(90deg,#d97706,var(--gold))}
#hud.danger .timebar i{background:linear-gradient(90deg,#b91c1c,#f87171)}
#hud.danger #timer{color:#f87171;animation:pulse .5s infinite}
.streak{position:absolute;left:50%;bottom:-15px;transform:translateX(-50%) scale(0);background:linear-gradient(90deg,#f97316,#ef4444);padding:3px 11px;border-radius:99px;font-size:.75rem;font-weight:700;transition:transform .25s;z-index:12;white-space:nowrap;box-shadow:0 4px 12px rgba(239,68,68,.4)}
.streak.on{transform:translateX(-50%) scale(1)}
.streak.pop{animation:streakPop .5s}

/* ---------- Stage ---------- */
#stage{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.scene{position:relative;flex:1 1 auto;min-height:150px;overflow:hidden;background:#000}
.scene.fade-in{animation:fadeIn .55s ease-out}
.layer{position:absolute;inset:0}
.layer>img{width:100%;height:100%;object-fit:cover;display:block;will-change:transform}
.sheet{flex:0 0 auto;position:relative;z-index:5;background:var(--panel);border-radius:22px 22px 0 0;margin-top:-20px;padding:14px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.45)}
.sheet:empty{display:none}
.sheet.in{animation:sheetIn .38s cubic-bezier(.2,.9,.3,1.15)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:20;overflow:hidden}
#stage.danger::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:15;box-shadow:inset 0 0 70px rgba(239,68,68,.6);animation:pulse 1s infinite}
.sheet-h{display:flex;justify-content:space-between;align-items:center;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:2px 2px 8px}
.sheet-h b{color:var(--text);font-size:.85rem;letter-spacing:.04em}

/* ---------- Buttons ---------- */
.btn{border:none;border-radius:16px;padding:14px 16px;font-size:1.05rem;font-weight:700;color:#fff;background:var(--sky2);box-shadow:0 5px 0 #0369a1;cursor:pointer;width:100%;transition:transform .08s,box-shadow .08s,filter .2s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0369a1}
.btn.big{font-size:1.2rem;padding:16px}
.btn small{font-size:.8rem;opacity:.8;margin-left:6px}
.btn.green{background:var(--green);box-shadow:0 5px 0 #15803d}
.btn.green:active{box-shadow:0 1px 0 #15803d}
.btn.hold{background:#dc2626;box-shadow:0 5px 0 #991b1b;flex:0 0 38%}
.btn.hold:active{box-shadow:0 1px 0 #991b1b}
.btn.hold.urge{animation:urge .55s infinite}
.btn.ghost{background:#24304f;box-shadow:0 5px 0 #141c33}
.btn:disabled{filter:grayscale(1) brightness(.55);cursor:default}
.btn:disabled:active{transform:none;box-shadow:0 5px 0 #15803d}
.btn.ready{animation:ready 1s infinite}
.btn.pulse{animation:ready 1.4s infinite}
.actions{display:flex;gap:10px}

/* ---------- Title ---------- */
.kb>img{animation:kenburns 16s ease-in-out infinite alternate;transform-origin:62% 35%}
.shade{background:linear-gradient(180deg,rgba(7,11,22,.1) 30%,rgba(7,11,22,.85))}
.title{position:absolute;left:0;right:0;bottom:34px;text-align:center;padding:0 16px}
.logo{font-size:2.9rem;font-weight:700;line-height:.92;text-shadow:0 4px 0 #0369a1,0 10px 30px rgba(0,0,0,.6);animation:logoIn .8s cubic-bezier(.2,1.4,.4,1) both}
.logo em{font-style:normal;color:var(--gold);text-shadow:0 4px 0 #b45309,0 10px 30px rgba(0,0,0,.6);display:inline-block;animation:wiggle 2.4s ease-in-out 1s infinite}
.tagline{margin-top:10px;color:#e0f2fe;font-weight:500;text-shadow:0 2px 8px #000;animation:fadeUp .6s .4s both}
.how{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.how div{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.8rem;line-height:1.15;animation:chipIn .35s both}
.how div span{font-size:1.3rem}
.best-line{text-align:center;color:var(--muted);font-size:.85rem;margin-top:12px}

/* ---------- Hallway walk ---------- */
.walk-tag{position:absolute;left:10px;top:10px;display:flex;align-items:baseline;gap:8px;background:rgba(8,14,30,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:6px 12px;animation:dropIn .4s both}
.walk-tag small{font-size:.62rem;letter-spacing:.12em;color:var(--muted)}
.walk-tag b{font-size:1.1rem}
.walk-tag i{font-style:normal;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;min-width:42px}
.tap-hint{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);font-weight:700;font-size:1.05rem;color:#fff;background:rgba(14,165,233,.85);padding:6px 14px;border-radius:99px;animation:hint .7s ease-in-out infinite alternate;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.next{display:flex;gap:12px;align-items:center}
.next img{width:54px;height:54px;border-radius:50%;object-fit:cover;object-position:50% 22%;border:3px solid var(--sky);flex:none}
.next .nm{font-weight:700;font-size:1.02rem}
.next .sub{font-size:.76rem;color:var(--muted);margin-top:1px}
.next .ord{margin-top:5px;background:#0b1222;border:1px solid var(--line);border-radius:8px;padding:3px 8px;display:inline-block;font-size:.85rem;color:#a5f3fc;font-weight:600}
.track{display:flex;align-items:center;gap:8px;margin:12px 0 12px;font-size:.85rem;font-weight:600}
.walkbar{flex:1;height:12px;background:#0b1222;border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.walkbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),#a5f3fc);border-radius:99px}
.hurry{touch-action:manipulation}
.hurry.hit{animation:hit .15s}

/* ---------- Door ---------- */
.door-wrap{position:absolute;inset:0;transform-origin:50% 50%;transition:transform .75s cubic-bezier(.55,0,.85,.4),filter .75s}
.door-wrap.approach{animation:approach .55s ease-out backwards}
.door-wrap.enter{transform:scale(2.5);filter:brightness(1.35)}
.wall{position:absolute;inset:0;background:linear-gradient(180deg,#d3ecdf 0%,#c3e3d3 80%,#eadcc5 80%,#eadcc5 82%,#a8bdd1 82%,#8ea6be 100%)}
.wall::before{content:'';position:absolute;left:0;right:0;top:57%;height:12px;background:linear-gradient(#5b9bd5,#3b78b3);border-radius:6px;box-shadow:0 3px 4px rgba(0,0,0,.15)}
.wall::after{content:'';position:absolute;left:4%;top:16%;width:9%;height:14%;background:radial-gradient(circle at 50% 30%,#fff7d6,#fde68a 40%,transparent 70%);opacity:.75}
.frame{position:absolute;left:16%;right:16%;top:8%;bottom:18%;border:12px solid #7c5530;border-bottom:none;border-radius:8px 8px 0 0;overflow:hidden;perspective:1100px;background:#1a1410;box-shadow:0 0 0 3px rgba(0,0,0,.12),0 18px 40px rgba(0,0,0,.25)}
.room-in{position:absolute;inset:0}
.room-in img{width:100%;height:100%;object-fit:cover;transform:scale(1.12);transition:transform 1.4s ease-out}
.door-wrap.open .room-in img{transform:scale(1)}
.leaf{position:absolute;inset:0;transform-origin:left center;transition:transform .85s cubic-bezier(.45,0,.2,1);background:linear-gradient(90deg,#a86d3a,#c88c52 45%,#b27741 80%,#9a6334);box-shadow:inset -8px 0 14px rgba(0,0,0,.18),inset 6px 0 10px rgba(255,255,255,.08);backface-visibility:hidden}
.door-wrap.open .leaf{transform:rotateY(-100deg)}
.leaf.knocked{animation:knock .42s}
.pnl{position:absolute;left:13%;right:13%;border:3px solid rgba(0,0,0,.14);border-radius:8px;box-shadow:inset 0 0 0 2px rgba(255,255,255,.07)}
.pnl.a{top:36%;height:20%}.pnl.b{top:62%;height:32%}
.plaque{position:absolute;left:50%;top:9%;transform:translateX(-50%);background:linear-gradient(#1d4ed8,#1e3a8a);border:3px solid #dbeafe;border-radius:10px;padding:5px 14px 6px;text-align:center;box-shadow:0 6px 14px rgba(0,0,0,.3);white-space:nowrap}
.plaque b{display:block;font-size:1.8rem;line-height:1}
.plaque span{font-size:.72rem;color:#dbeafe}
.knob{position:absolute;right:9%;top:52%;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f8fafc,#64748b)}
.knob::after{content:'';position:absolute;right:8px;top:6px;width:30px;height:8px;border-radius:4px;background:linear-gradient(#e2e8f0,#64748b)}
.bubble{position:absolute;left:50%;top:3%;transform:translateX(-50%) scale(0);background:#fff;color:#0f172a;font-weight:700;padding:6px 14px;border-radius:16px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.25);z-index:3}
.bubble.show{animation:popIn .35s forwards}
.skip{position:absolute;right:12px;bottom:12px;font-size:.75rem;color:#fff;background:rgba(0,0,0,.45);padding:4px 10px;border-radius:99px;z-index:4}

/* ---------- Room ---------- */
.room>img{transition:transform 1s cubic-bezier(.3,0,.2,1),filter .4s}
.room>img.dim{filter:brightness(.78) saturate(.9)}
.room>img.zoom{transform:scale(1.38)}
.room>img.held{filter:grayscale(.8) brightness(.6)}
.pt-banner{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:10px;background:rgba(8,14,30,.8);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:8px 10px;animation:dropIn .45s .15s both;z-index:2}
.pt-banner img{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:50% 22%;border:3px solid var(--green);flex:none}
.pt-banner b{display:block;font-size:.98rem;line-height:1.1}
.pt-banner span{font-size:.74rem;color:#cbd5e1}
.allergy{margin-left:auto;background:#7f1d1d;border:1px solid var(--red);color:#fecaca;font-size:.68rem;font-weight:700;padding:4px 8px;border-radius:99px;white-space:nowrap;animation:pulse 1.4s infinite}
.nka{margin-left:auto;background:#14532d;border:1px solid var(--green);color:#bbf7d0;font-size:.68rem;font-weight:700;padding:4px 8px;border-radius:99px;white-space:nowrap}
.say{position:absolute;right:14px;top:78px;max-width:62%;background:#fff;color:#0f172a;font-weight:600;font-size:.86rem;padding:7px 11px;border-radius:14px 14px 4px 14px;box-shadow:0 6px 16px rgba(0,0,0,.3);transform:scale(0);transform-origin:100% 100%;z-index:2}
.say.show{animation:popIn .35s forwards}
.mar{display:flex;align-items:center;gap:10px;background:#f8fafc;color:#0f172a;border-radius:12px;padding:8px 12px;border-left:7px solid var(--sky2);background-image:repeating-linear-gradient(0deg,transparent 0 21px,#e2e8f0 21px 22px)}
.mar-h{font-size:.62rem;font-weight:700;color:#475569;letter-spacing:.1em;line-height:1.2}
.mar-d{font-size:1.06rem;font-weight:700}
.cart{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.bottle{position:relative;display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:linear-gradient(180deg,#22305a,#18223b);border:2px solid var(--line);text-align:left;cursor:pointer;box-shadow:0 5px 0 #0b1222;min-height:74px;animation:binIn .35s both;transition:transform .08s,box-shadow .08s}
.bottle:active{transform:translateY(4px);box-shadow:0 1px 0 #0b1222}
.mini{position:relative;flex:none;width:26px;height:44px}
.mini::before{content:'';position:absolute;left:1px;right:1px;top:0;height:11px;border-radius:3px;background:var(--cap);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.mini::after{content:'';position:absolute;left:0;right:0;top:10px;bottom:0;border-radius:5px;background:linear-gradient(90deg,#c2410c,#fb923c 50%,#c2410c)}
.mini i{position:absolute;left:3px;right:3px;top:21px;height:13px;background:#fff;border-radius:2px;z-index:1}
.bl{display:flex;flex-direction:column;line-height:1.08;min-width:0}
.bl b{font-size:.9rem;overflow-wrap:anywhere}
.bl b.long{font-size:.74rem}
.bl em{font-style:normal;font-size:1.2rem;font-weight:700;color:var(--sky)}
.bottle.right{border-color:var(--green);background:#0f2f1e;animation:liftOut .55s forwards}
.bottle.nope{border-color:var(--red);background:#3a0f12;animation:shakeX .4s;opacity:.55}
.bottle.nope::after{content:'✕';position:absolute;right:8px;top:4px;color:var(--red);font-weight:700;font-size:1.3rem}

/* ---------- 5 Rights ---------- */
.chips{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.chip{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:7px 10px;cursor:pointer;animation:chipIn .3s both;transition:background .2s,border-color .2s,transform .1s}
.chip:active{transform:scale(.98)}
.chip .ic{font-size:1.2rem;width:26px;text-align:center;flex:none}
.chip .tx{flex:1;min-width:0}
.chip .tx>b{font-size:.84rem;display:block;margin-bottom:1px}
.cmp{display:flex;gap:10px;font-size:.78rem;color:#dbe4f5;line-height:1.15}
.cmp>span{flex:1;min-width:0}
.cmp small{display:block;font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip .st{width:26px;height:26px;border-radius:50%;border:2px dashed #475569;display:grid;place-items:center;font-size:.9rem;font-weight:700;flex:none}
.chip.ok{background:#0f2f1e;border-color:var(--green)}
.chip.ok .st{border:none;background:var(--green);animation:stamp .3s}
.chip.ok .st::after{content:'✓'}
.chip.bad{background:#3a0f12;border-color:var(--red);animation:shakeX .4s}
.chip.bad .st{border:none;background:var(--red);animation:stamp .3s}
.chip.bad .st::after{content:'!'}

/* ---------- Tally / results ---------- */
.tally{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:6px 12px;margin-bottom:12px}
.trow{display:flex;justify-content:space-between;padding:6px 0;font-size:.92rem;animation:rowIn .3s both;border-bottom:1px dashed #2d3b63}
.trow:last-child{border-bottom:none}
.trow b{color:var(--gold);font-variant-numeric:tabular-nums}
.trow.total{font-size:1.05rem;font-weight:700}
.trow.neg b{color:#f87171}
.msg{font-size:.9rem;color:#dbe4f5;line-height:1.35;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:12px}
.okc{color:var(--green)!important}
.badc{color:#f87171!important}
.goldc{color:var(--gold)!important}
.end-shade{background:linear-gradient(180deg,rgba(7,11,22,.35),rgba(7,11,22,.85))}
.end-title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.et{font-size:2.3rem;font-weight:700;text-shadow:0 4px 0 #0369a1,0 10px 30px rgba(0,0,0,.6);animation:logoIn .7s both}
.stars{margin-top:8px;font-size:3rem;letter-spacing:4px}
.stars span{display:inline-block;color:#334155;text-shadow:0 3px 0 #0f172a;animation:starIn .45s both}
.stars span.on{color:var(--gold);text-shadow:0 3px 0 #b45309,0 0 20px rgba(251,191,36,.6)}
.newbest{margin-top:6px;background:linear-gradient(90deg,#f97316,#ef4444);padding:4px 14px;border-radius:99px;font-weight:700;animation:popIn .4s 1.1s both, pulse 1s 1.5s infinite}
.final{text-align:center;margin-bottom:10px}
.final small{display:block;font-size:.62rem;letter-spacing:.14em;color:var(--muted)}
.final b{display:block;font-size:2.6rem;color:var(--gold);line-height:1.05;font-variant-numeric:tabular-nums}
.final span{font-size:.82rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.stats div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;animation:chipIn .3s both}
.stats b{display:block;font-size:1.3rem}
.stats span{font-size:.62rem;color:var(--muted);line-height:1.1;display:block}

/* ---------- FX ---------- */
.float{position:absolute;transform:translate(-50%,-50%);font-weight:700;font-size:1.25rem;white-space:nowrap;text-shadow:0 2px 0 rgba(0,0,0,.5),0 0 12px rgba(0,0,0,.4)}
.float.good{color:#4ade80}.float.bad{color:#f87171}.float.gold{color:var(--gold);font-size:1.7rem}.float.step{font-size:1.4rem}
.spark{position:absolute;width:9px;height:9px;border-radius:50%}
.confetti{position:absolute;top:-12px;width:8px;height:13px;border-radius:2px}
.banner{position:absolute;left:50%;transform:translate(-50%,-50%);font-size:2.3rem;font-weight:700;white-space:nowrap;color:#fff;text-shadow:0 4px 0 #0369a1,0 10px 30px rgba(0,0,0,.6);animation:bannerIn 1.2s forwards}
.banner.good{color:#4ade80;text-shadow:0 4px 0 #15803d,0 10px 30px rgba(0,0,0,.6)}
.banner.bad{color:#f87171;text-shadow:0 4px 0 #991b1b,0 10px 30px rgba(0,0,0,.6)}
.banner.goldb{color:var(--gold);text-shadow:0 4px 0 #b45309,0 10px 30px rgba(0,0,0,.6)}
.banner.count{font-size:5rem}
.flash{position:absolute;inset:0;background:#fff;animation:flash .45s forwards}
.cup{position:absolute;width:40px;height:36px;filter:drop-shadow(0 6px 8px rgba(0,0,0,.4))}
.cup::before{content:'';position:absolute;inset:0;clip-path:polygon(0 0,100% 0,84% 100%,16% 100%);background:radial-gradient(circle at 34% 22%,#f472b6 0 5px,transparent 6px),radial-gradient(circle at 62% 26%,#fbbf24 0 5px,transparent 6px),radial-gradient(circle at 48% 12%,#fff 0 4px,transparent 5px),linear-gradient(#ffffff,#d6e0ee)}
#app.shake{animation:shake .4s}

/* ---------- Keyframes ---------- */
@keyframes pulse{50%{opacity:.55}}
@keyframes bump{40%{transform:scale(1.3)}}
@keyframes streakPop{0%{transform:translateX(-50%) scale(1)}40%{transform:translateX(-50%) scale(1.45)}100%{transform:translateX(-50%) scale(1)}}
@keyframes sheetIn{from{transform:translateY(60%);opacity:0}}
@keyframes fadeIn{from{opacity:0;filter:brightness(2.2)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}}
@keyframes chipIn{from{opacity:0;transform:translateY(10px)}}

<body>
<div id="app">
  <header id="hud">
    <div class="hud-row">
      <div class="hud-score"><span class="lbl">SCORE</span><b id="score">0</b></div>
      <div id="pips"></div>
      <div class="hud-time"><span class="lbl">SHIFT</span><b id="timer">2:30</b></div>
      <button id="mute" aria-label="Toggle sound">🔊</button>
    </div>
    <div class="timebar"><i id="timefill"></i></div>
    <div id="streak" class="streak"></div>
  </header>
  <main id="stage">
    <div id="scene" class="scene"></div>
    <div id="sheet" class="sheet"></div>
    <div id="fx"></div>
  </main>
</div>
<script>
/* =========================================================
   MedPass Madness — single-file game
   ========================================================= */
const BASE = "https://raw.githubusercontent.com/WTFINATRUCK/medpass-madness/main/assets/";
const IMG = { hall: BASE+"hallway.jpg", door: BASE+"door.jpg", give: BASE+"giving.jpg", res1: BASE+"res1.jpg", res2: BASE+"res2.jpg" };
const SHARE_URL = "https://htmlpreview.github.io/?https://github.com/WTFINATRUCK/medpass-madness/blob/main/index.html";
const SHIFT_SECONDS = 150;

const RESIDENTS = [
  { name:"Mrs. Eleanor Hayes", room:"204", age:78, allergy:"Penicillin", needed:"Metformin 500mg PO", correct:"Metformin 500mg",
    options:["Metformin 500mg","Metformin 1000mg","Glipizide 5mg","Lisinopril 10mg"], portrait:IMG.res1,
    greet:"Morning, sweetheart!", thanks:"Thank you, dear!" },
  { name:"Mr. James Whitaker", room:"207", age:82, allergy:"None", needed:"Warfarin 2mg PO", correct:"Warfarin 2mg",
    options:["Warfarin 2mg","Warfarin 5mg","Aspirin 81mg","Eliquis 5mg"], portrait:IMG.res2,
    greet:"Is it pill time already?", thanks:"Right on time. Good job." },
  { name:"Mrs. Doris Chen", room:"211", age:85, allergy:"Sulfa", needed:"Atorvastatin 20mg PO", correct:"Atorvastatin 20mg",
    options:["Atorvastatin 20mg","Atorvastatin 40mg","Simvastatin 20mg","Amlodipine 5mg"], portrait:IMG.res1,
    greet:"Oh good, it's you!", thanks:"You're my favorite nurse." },
  { name:"Mr. Robert Miller", room:"218", age:76, allergy:"Codeine", needed:"Lisinopril 10mg PO", correct:"Lisinopril 10mg",
    options:["Lisinopril 10mg","Lisinopril 20mg","Losartan 50mg","Metoprolol 25mg"], portrait:IMG.res2,
    greet:"Took you long enough!", thanks:"Hmph. Thanks, kiddo." },
  { name:"Mrs. Betty Thompson", room:"222", age:88, allergy:"None", needed:"Furosemide 20mg PO", correct:"Furosemide 20mg",
    options:["Furosemide 20mg","Furosemide 40mg","Hydrochlorothiazide 25mg","Spironolactone 25mg"], portrait:IMG.res1,
    greet:"Come in, come in!", thanks:"Bless your heart." },
  { name:"Mr. Frank Davis", room:"225", age:79, allergy:"Aspirin", needed:"Omeprazole 20mg PO", correct:"Omeprazole 20mg",
    options:["Omeprazole 20mg","Omeprazole 40mg","Pantoprazole 40mg","Aspirin 81mg"], portrait:IMG.res2,
    greet:"Don't mix me up with Bob!", thanks:"Much obliged, nurse." }
];

const TRAPS = {
  patient: { short:"Wrong patient", why: r => `The wristband said <b>${r.wrongName}</b>, not ${r.name}. Wrong patient — med held and the band was fixed.` },
  time:    { short:"Already given", why: () => `It was already given today at <b>0812</b>. Giving it again would've been a double dose.` },
  route:   { short:"NPO", why: () => `Resident is <b>NPO</b> pending a swallow eval — nothing by mouth. Provider notified.` }
};

/* ---------- DOM ---------- */
const $ = s => document.querySelector(s);
const app=$('#app'), hud=$('#hud'), scoreEl=$('#score'), timerEl=$('#timer'), timeFill=$('#timefill'),
      pipsEl=$('#pips'), streakEl=$('#streak'), stage=$('#stage'), sceneEl=$('#scene'), sheetEl=$('#sheet'), fxEl=$('#fx'), muteBtn=$('#mute');

let G = null;          // game state
let token = 0;         // bumps on every phase change → cancels stale callbacks
let rafId = 0, scoreRaf = 0;
let tapHandler = null; // what a tap on the stage does in the current phase

function phase(){ token++; cancelAnimationFrame(rafId); tapHandler = null; }
function after(ms, fn){ const t = token; setTimeout(() => { if (t === token) fn(); }, ms); }
function sequence(steps){ // [[delayBefore, fn], ...] — returns a "skip ahead" function
  let k = 0, seq = 0;
  const sched = () => { const s = ++seq; after(steps[k][0], () => { if (s === seq) next(); }); };
  const next = () => { if (k >= steps.length) return; const fn = steps[k][1]; k++; if (k < steps.length) sched(); else seq++; fn(); };
  sched();
  return next;
}
stage.addEventListener('pointerdown', e => {
  if (!tapHandler || e.target.closest('button')) return;
  tapHandler(e);
});

/* ---------- Audio (one shared context; no music) ---------- */
let AC = null, NOISE = null, muted = false;
try { muted = localStorage.getItem('medpassMute') === '1'; } catch(e){}
function audio(){
  if (muted) return null;
  if (!AC){
    try {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      NOISE = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
      const d = NOISE.getChannelData(0); for (let i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    } catch(e){ return null; }
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f, dur, {type='sine', vol=.1, at=0, to=null}={}){
  const c = audio(); if (!c) return;
  const t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t+dur);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t+.01); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+dur+.03);
}
function noise(dur, {vol=.1, at=0, freq=1000, q=1, type='lowpass', to=null}={}){
  const c = audio(); if (!c) return;
  const t = c.currentTime + at, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = NOISE; f.type = type; f.frequency.setValueAtTime(freq, t); if (to) f.frequency.exponentialRampToValueAtTime(to, t+dur); f.Q.value = q;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t+dur);
  s.connect(f); f.connect(g); g.connect(c.destination); s.start(t, Math.random()*.5); s.stop(t+dur+.03);
}
const sfx = {
  step(v=1){ noise(.07,{vol:.2*v,freq:450}); tone(110,.07,{vol:.07*v,to:70}); },
  knock(at=0){ tone(170,.1,{type:'triangle',vol:.35,at,to:90}); noise(.05,{vol:.25,freq:1300,at}); },
  creak(){ tone(230,.6,{type:'sawtooth',vol:.022,to:150}); tone(340,.45,{type:'sawtooth',vol:.014,at:.12,to:250}); },
  whoosh(){ noise(.35,{vol:.2,freq:300,to:3200,type:'bandpass',q:.8}); },
  pick(){ for (let k=0;k<4;k++) noise(.035,{vol:.13,freq:3000,type:'highpass',at:k*.045}); },
  scan(){ tone(1568,.06,{type:'square',vol:.035}); tone(2093,.07,{type:'square',vol:.035,at:.06}); },
  good(){ [784,988,1319].forEach((f,k)=>tone(f,.18,{type:'triangle',vol:.12,at:k*.07})); },
  bad(){ tone(155,.3,{type:'square',vol:.07,to:95}); tone(150,.3,{type:'sawtooth',vol:.04,to:90}); },
  fanfare(){ [523,659,784,1047].forEach((f,k)=>tone(f,.22,{type:'triangle',vol:.12,at:k*.09})); tone(1319,.5,{vol:.08,at:.36}); },
  shield(){ tone(392,.15,{type:'triangle',vol:.1}); tone(587,.25,{type:'triangle',vol:.1,at:.1}); tone(784,.4,{vol:.09,at:.2}); },
  tick(){ tone(1250,.035,{type:'square',vol:.025}); },
  count(){ tone(440,.14,{type:'square',vol:.05}); },
  go(){ tone(880,.35,{type:'square',vol:.06}); },
  star(k){ tone(660+k*220,.2,{type:'triangle',vol:.1}); }
};
function vib(p){ try { navigator.vibrate && navigator.vibrate(p); } catch(e){} }
function renderMute(){ muteBtn.textContent = muted ? '🔇' : '🔊'; }
muteBtn.onclick = () => { muted = !muted; try{ localStorage.setItem('medpassMute', muted?'1':'0'); }catch(e){} renderMute(); if (!muted) sfx.scan(); };

/* ---------- Helpers ---------- */
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick1 = a => a[Math.random()*a.length|0];
function splitLabel(l){ const m = l.match(/^(.*?)\s+([\d.]+\s?mg)$/); return m ? [m[1], m[2]] : [l, '']; }
function capColor(l){ const pal=['#ef4444','#f59e0b','#22c55e','#3b82f6','#a855f7','#ec4899','#14b8a6','#eab308']; let h=0; for (const ch of l) h=(h*31+ch.charCodeAt(0))>>>0; return pal[h%pal.length]; }
function allergyTag(r, cls=true){ return r.allergy !== 'None' ? `<span class="${cls?'allergy':''}">⚠ ${r.allergy}</span>` : `<span class="${cls?'nka':''}">NKA</span>`; }
function setSheet(html){ sheetEl.innerHTML = html; sheetEl.classList.remove('in'); void sheetEl.offsetWidth; sheetEl.classList.add('in'); }
function stageRect(){ return stage.getBoundingClientRect(); }
// Map a point on an object-fit:cover image (fractions of the source image) to coordinates.
function imgPt(img, fx, fy, nw0, nh0){
  const r = img.getBoundingClientRect(), s = stageRect();
  const nw = img.naturalWidth || nw0, nh = img.naturalHeight || nh0;
  const w = img.offsetWidth, h = img.offsetHeight;
  const sc = Math.max(w/nw, h/nh), dw = nw*sc, dh = nh*sc;
  const ex = (w-dw)/2 + fx*dw, ey = (h-dh)/2 + fy*dh;
  return { ex, ey, x: r.left - s.left + ex, y: r.top - s.top + ey };
}
function sceneCenter(fy=.45){ const r = sceneEl.getBoundingClientRect(), s = stageRect(); return { x: r.left-s.left+r.width/2, y: r.top-s.top+r.height*fy }; }
function elCenter(el){ const r = el.getBoundingClientRect(), s = stageRect(); return { x: r.left-s.left+r.width/2, y: r.top-s.top+r.height/2 }; }

/* ---------- FX ---------- */
function floatText(text, cls, x, y, ms=1200){
  const el = document.createElement('div'); el.className = 'float '+(cls||''); el.innerHTML = text;
  el.style.left = x+'px'; el.style.top = y+'px'; fxEl.appendChild(el);
  el.animate([{opacity:0,transform:'translate(-50%,-30%) scale(.6)'},{opacity:1,transform:'translate(-50%,-50%) scale(1.1)',offset:.15},{opacity:1,transform:'translate(-50%,-90%) scale(1)',offset:.7},{opacity:0,transform:'translate(-50%,-140%) scale(1)'}],{duration:ms,easing:'ease-out',fill:'forwards'});
  setTimeout(()=>el.remove(), ms+50);
}
function burst(x, y, n=18, colors=['#22c55e','#fbbf24','#38bdf8','#f472b6','#ffffff']){
  for (let k=0;k<n;k++){
    const p = document.createElement('i'); p.className = 'spark';
    const a = Math.random()*Math.PI*2, d = 40+Math.random()*90, dur = 600+Math.random()*450;
    p.style.left = x+'px'; p.style.top = y+'px'; p.style.background = colors[k%colors.length]; fxEl.appendChild(p);
    p.animate([{transform:'translate(-50%,-50%) scale(1.2)',opacity:1},{transform:`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px)) scale(.2)`,opacity:0}],{duration:dur,easing:'cubic-bezier(.1,.7,.3,1)',fill:'forwards'});
    setTimeout(()=>p.remove(), dur+50);
  }
}
function confetti(n=40){
  const W = stage.clientWidth, H = stage.clientHeight, cols = ['#22c55e','#fbbf24','#38bdf8','#f472b6','#a78bfa','#fb923c'];
  for (let k=0;k<n;k++){
    const c = document.createElement('i'); c.className = 'confetti';
    c.style.left = (Math.random()*W)+'px'; c.style.background = cols[k%cols.length]; fxEl.appendChild(c);
    const dur = 1500+Math.random()*1300, dx = (Math.random()-.5)*120, rot = (Math.random()-.5)*900;
    c.animate([{transform:'translate(0,0) rotate(0)'},{transform:`translate(${dx}px, ${H+30}px) rotate(${rot}deg)`}],{duration:dur,delay:Math.random()*300,easing:'cubic-bezier(.3,.1,.6,1)',fill:'both'});
    setTimeout(()=>c.remove(), dur+400);
  }
}
function banner(text, cls='', fy=.42){
  const el = document.createElement('div'); el.className = 'banner '+cls; el.innerHTML = text;
  const p = sceneCenter(fy); el.style.top = p.y+'px'; fxEl.appendChild(el); setTimeout(()=>el.remove(), 1250);
}
function flash(){ const f = document.createElement('div'); f.className = 'flash'; fxEl.appendChild(f); setTimeout(()=>f.remove(), 500); }
function shake(){ app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake'); vib([50,30,50]); }
function flyCup(from, to, dur=600){
  const el = document.createElement('div'); el.className = 'cup'; el.style.left = from.x+'px'; el.style.top = from.y+'px'; fxEl.appendChild(el);
  const dx = to.x-from.x, dy = to.y-from.y;
  el.animate([
    {transform:'translate(-50%,-50%) scale(.5) rotate(0)', opacity:0},
    {transform:`translate(calc(-50% + ${dx*.5}px), calc(-50% + ${dy*.5-70}px)) scale(1.35) rotate(-14deg)`, opacity:1, offset:.5},
    {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(1) rotate(0)`, opacity:1}
  ], {duration:dur, easing:'cubic-bezier(.3,.6,.4,1)', fill:'forwards'});
  setTimeout(()=>el.animate([{opacity:1},{opacity:0}],{duration:300,fill:'forwards'}), dur+500);
  setTimeout(()=>el.remove(), dur+850);
}
function say(text){ const b = $('#say'); if (!b) return; b.textContent = text; b.classList.remove('show'); void b.offsetWidth; b.classList.add('show'); }

/* ---------- HUD ---------- */
function addScore(d){ if (!G) return; G.score = Math.max(0, G.score + d); tweenScore(d < 0); }
function tweenScore(down){
  cancelAnimationFrame(scoreRaf);
  const box = scoreEl.parentElement; box.classList.remove('bump','down'); void box.offsetWidth; box.classList.add('bump'); if (down) box.classList.add('down');
  const from = G.shown, to = G.score, t0 = performance.now(), d = 650;
  const f = now => { const k = Math.min(1,(now-t0)/d); G.shown = Math.round(from+(to-from)*(1-Math.pow(1-k,3))); scoreEl.textContent = G.shown; if (k<1) scoreRaf = requestAnimationFrame(f); else box.classList.remove('down'); };
  scoreRaf = requestAnimationFrame(f);
}
function renderTime(){
  const t = Math.max(0, G ? G.time : SHIFT_SECONDS);
  timerEl.textContent = Math.floor(t/60)+':'+String(t%60).padStart(2,'0');
  timeFill.style.width = (t/SHIFT_SECONDS*100)+'%';
  const live = G && G.active;
  hud.classList.toggle('danger', live && t<=20);
  hud.classList.toggle('warn', live && t>20 && t<=50);
  stage.classList.toggle('danger', live && t<=20 && t>0);
}
function renderPips(){
  const list = G ? G.list : RESIDENTS.map(r=>({...r,status:'todo'}));
  pipsEl.innerHTML = list.map((r,k)=>`<span class="pip ${r.status} ${G&&G.active&&k===G.i&&r.status==='todo'?'cur':''}">${r.status==='done'?'✓':r.status==='held'?'!':r.status==='missed'?'✕':''}</span>`).join('');
}
function renderStreak(pop){
  if (G && G.streak >= 2){
    streakEl.textContent = `🔥 ${G.streak} STREAK`; streakEl.classList.add('on');
    if (pop){ streakEl.classList.remove('pop'); void streakEl.offsetWidth; streakEl.classList.add('pop'); }
  } else streakEl.classList.remove('on');
}
function startClock(){
  clearInterval(G.clock);
  G.clock = setInterval(() => {
    if (!G.active || document.hidden) return;   // pause if the tab is hidden
    G.time--; renderTime();
    if (G.time <= 15 && G.time > 0) sfx.tick();
    if (G.time <= 0) endGame(false);
  }, 1000);
}

/* ---------- Game flow ---------- */
function newGame(){
  const list = RESIDENTS.map(r => ({...r, options: shuffle(r.options), trap:null, status:'todo'}));
  const trapAt = shuffle([1,2,3,4,5]).slice(0,2);         // never the first resident
  const types = shuffle(Object.keys(TRAPS));
  trapAt.forEach((i,k) => {
    const r = list[i]; r.trap = types[k];
    if (r.trap === 'patient'){
      const title = r.name.split(' ')[0];
      const pool = RESIDENTS.filter(x => x.name !== r.name && x.name.startsWith(title));
      r.wrongName = pick1(pool).name;
    }
  });
  G = { list, i:0, score:0, shown:0, streak:0, bestStreak:0, time:SHIFT_SECONDS, active:false, ended:false, clock:null,
        stats:{ passes:0, catches:0, wrongPicks:0, slips:0, badHolds:0 } };
}

function showTitle(){
  phase(); if (G) clearInterval(G.clock); G = null;
  scoreEl.textContent = '0'; renderTime(); renderPips(); renderStreak();
  let best = 0; try { best = +(localStorage.getItem('medpassHigh')||0); } catch(e){}
  sceneEl.className = 'scene';
  sceneEl.innerHTML = `<div class="layer kb"><img src="${IMG.hall}" alt="Nurse pushing a med cart down the hallway"></div><div class="layer shade"></div>
    <div class="title"><div class="logo">💊 MedPass<br><em>Madness</em></div><div class="tagline">Pass meds. Beat the clock. Catch the mistakes.</div></div>`;
  setSheet(`<div class="how">
      <div style="animation-delay:.05s"><span>👟</span>Tap fast to hurry down the hall</div>
      <div style="animation-delay:.1s"><span>💊</span>Pull the right med from the cart</div>
      <div style="animation-delay:.15s"><span>✅</span>Tap to verify all 5 Rights</div>
      <div style="animation-delay:.2s"><span>🛑</span>Something off? Hold the med!</div>
    </div>
    <button class="btn big pulse" id="go">▶ Start Shift <small>2:30</small></button>
    ${best ? `<div class="best-line">🏆 Best: ${best}</div>` : ''}`);
  $('#go').onclick = () => { audio(); countdown(); };
}

function countdown(){
  newGame(); phase();
  scoreEl.textContent = '0'; renderTime(); renderPips(); renderStreak();
  sceneEl.className = 'scene';
  sceneEl.innerHTML = `<div class="layer"><img src="${IMG.hall}" alt="" style="filter:brightness(.6)"></div>`;
  sheetEl.innerHTML = '';
  let n = 3;
  const tick = () => {
    if (n > 0){ banner(n, 'count', .5); sfx.count(); n--; after(650, tick); }
    else { banner('GO!', 'goldb count', .5); sfx.go(); G.active = true; renderPips(); startClock(); after(380, walkPhase); }
  };
  tick();
}

/* --- 1. Hallway: tap to hurry --- */
function walkPhase(){
  if (G.i >= G.list.length) return endGame(true);
  phase(); const tok = token; const r = G.list[G.i];
  renderPips();
  sceneEl.className = 'scene';
  sceneEl.innerHTML = `<div class="layer"><img id="hallImg" src="${IMG.hall}" alt=""></div>
    <canvas id="lines" class="layer"></canvas>
    <div class="walk-tag"><small>TO</small><b>Room ${r.room}</b><i id="dist">24 m</i></div>
    ${G.i === 0 ? '<div class="tap-hint">TAP TAP TAP!</div>' : ''}`;
  setSheet(`<div class="sheet-h"><span>Up next · ${G.i+1} of ${G.list.length}</span>${allergyTag(r)}</div>
    <div class="next"><img src="${r.portrait}" alt=""><div><div class="nm">${r.name}</div><div class="sub">Room ${r.room} · Age ${r.age}</div><div class="ord">📋 ${r.needed}</div></div></div>
    <div class="track"><span>🛒</span><div class="walkbar"><i id="walkfill"></i></div><span>🚪${r.room}</span></div>
    <button class="btn big hurry" id="hurry">👟 TAP TO HURRY</button>`);

  const img = $('#hallImg'), cv = $('#lines'), ctx = cv.getContext('2d'), distEl = $('#dist'), fill = $('#walkfill'), hb = $('#hurry');
  let W=0, H=0, vp={x:0,y:0};
  const measure = () => {
    const dpr = Math.min(2, window.devicePixelRatio||1);
    W = cv.clientWidth; H = cv.clientHeight; cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
    const p = imgPt(img, .665, .29, 1168, 784); vp = {x:p.ex, y:p.ey};
    img.style.transformOrigin = `${p.ex}px ${p.ey}px`;
  };
  measure(); if (!img.complete) img.onload = measure;

  let p = 0, boost = 0, last = performance.now(), bob = 0, stepAcc = 0, frame = 0;
  const hurry = (x, y) => {
    if (!G.active) return;
    boost = Math.min(boost + .55, 2.2); sfx.step();
    floatText('👟', 'step', x + (Math.random()-.5)*30, y, 600);
    hb.classList.remove('hit'); void hb.offsetWidth; hb.classList.add('hit');
  };
  tapHandler = e => { const s = stageRect(); hurry(e.clientX - s.left, e.clientY - s.top); };
  hb.addEventListener('pointerdown', e => { e.preventDefault(); const c = elCenter(hb); hurry(c.x + (Math.random()-.5)*120, c.y - 34); });

  const drawLines = k => {
    ctx.clearRect(0,0,W,H);
    const R = Math.hypot(W,H), n = Math.round(8 + k*30);
    ctx.lineCap = 'round';
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, r1 = R*(.3+Math.random()*.35), r2 = r1 + R*(.06 + k*.28*Math.random());
      ctx.strokeStyle = `rgba(255,255,255,${(.06+.4*k)*Math.random()})`; ctx.lineWidth = 1 + Math.random()*2.5*k;
      ctx.beginPath(); ctx.moveTo(vp.x+Math.cos(a)*r1, vp.y+Math.sin(a)*r1); ctx.lineTo(vp.x+Math.cos(a)*r2, vp.y+Math.sin(a)*r2); ctx.stroke();
    }
  };
  const arrive = () => {
    tapHandler = null; hb.disabled = true; sfx.whoosh();
    img.style.transition = 'transform .32s ease-in, filter .32s'; img.style.transform = 'scale(1.75)'; img.style.filter = 'brightness(1.4) blur(2px)';
    after(240, flash); after(300, doorPhase);
  };
  const loop = now => {
    if (tok !== token) return;
    const dt = Math.min(.05, (now-last)/1000); last = now;
    boost = Math.max(0, boost - dt*1.5);
    const speed = .34 + boost*.42;             // ≈2.9s untouched, <1s when mashing
    p = Math.min(1, p + speed*dt);
    bob += dt*(7 + boost*6);
    stepAcc += dt*(2.2 + boost*2.4); if (stepAcc >= 1){ stepAcc -= 1; sfx.step(.4); }
    img.style.transform = `translate3d(0,${Math.sin(bob)*3.2}px,0) rotate(${Math.sin(bob*.5)*.45}deg) scale(${1.05 + .4*p*p})`;
    if (++frame % 2 === 0) drawLines(Math.min(1, .12 + boost*.42));
    distEl.textContent = Math.max(0, Math.ceil((1-p)*24)) + ' m';
    fill.style.width = (p*100)+'%';
    if (p >= 1) return arrive();
    rafId = requestAnimationFrame(loop);
  };
  rafId = requestAnimationFrame(loop);
}

/* --- 2. Door: knock → open → step in --- */
function doorPhase(){
  phase(); const r = G.list[G.i];
  sceneEl.className = 'scene';
  sceneEl.innerHTML = `<div class="door-wrap approach" id="dw">
      <div class="wall"></div>
      <div class="frame">
        <div class="room-in"><img src="${IMG.door}" alt=""></div>
        <div class="leaf" id="leaf"><div class="pnl a"></div><div class="pnl b"></div>
          <div class="plaque"><b>${r.room}</b><span>${r.name.replace(/^(Mrs?\.) (\w)\w* /,'$1 $2. ')}</span></div><div class="knob"></div></div>
      </div>
      <div class="bubble" id="kk">✊ knock knock</div>
    </div><div class="skip">tap to skip ▸</div>`;
  sheetEl.innerHTML = '';
  const dw = $('#dw'), leaf = $('#leaf');
  tapHandler = sequence([
    [520, () => { sfx.knock(); sfx.knock(.17); leaf.classList.add('knocked'); $('#kk').classList.add('show'); vib(20); }],
    [620, () => { sfx.creak(); dw.classList.add('open'); }],
    [900, () => { sfx.whoosh(); dw.classList.add('enter'); }],
    [520, () => { flash(); roomPhase(); }]
  ]);
}

/* --- 3. Room: pull the right med --- */
function roomPhase(){
  phase(); const r = G.list[G.i];
  sceneEl.className = 'scene'; void sceneEl.offsetWidth; sceneEl.classList.add('fade-in');
  sceneEl.innerHTML = `<div class="layer room"><img id="giveImg" src="${IMG.give}" alt="Nurse with resident"></div>
    <div class="pt-banner"><img src="${r.portrait}" alt=""><div><b>${r.name}</b><span>Rm ${r.room} · ${r.age} yrs</span></div>${allergyTag(r)}</div>
    <div class="say" id="say"></div>`;
  setSheet(`<div class="mar"><div class="mar-h">MAR<br>0900</div><div class="mar-d">${r.needed}</div></div>
    <div class="sheet-h" style="margin-top:12px"><span>Pull it from the cart</span><span>tap one</span></div>
    <div class="cart" id="cart"></div>`);
  const cart = $('#cart');
  r.options.forEach((label, k) => {
    const [nm, ds] = splitLabel(label);
    const b = document.createElement('button'); b.className = 'bottle';
    b.style.setProperty('--cap', capColor(nm)); b.style.animationDelay = (k*70)+'ms';
    b.innerHTML = `<span class="mini"><i></i></span><span class="bl"><b class="${nm.length>12?'long':''}">${nm}</b><em>${ds}</em></span>`;
    b.onclick = () => pickMed(label, b, r);
    cart.appendChild(b);
  });
  after(450, () => say(r.greet));
}

function pickMed(label, btn, r){
  if (!G.active || btn.disabled || btn.classList.contains('right')) return;
  const c = elCenter(btn);
  if (label === r.correct){
    document.querySelectorAll('.bottle').forEach(b => b.disabled = true);
    btn.classList.add('right'); sfx.pick(); sfx.good(); vib(15);
    burst(c.x, c.y, 12); floatText('Correct med!', 'good', c.x, c.y - 30);
    const img = $('#giveImg'); const hands = imgPt(img, .51, .555, 784, 1168);
    flyCup(c, hands, 550);
    after(750, () => rightsPhase(r));
  } else {
    btn.classList.add('nope'); btn.disabled = true; sfx.bad(); shake();
    G.streak = 0; renderStreak(); G.stats.wrongPicks++; addScore(-75);
    const allergic = r.allergy !== 'None' && label.toLowerCase().includes(r.allergy.toLowerCase());
    floatText(allergic ? `⚠ ALLERGIC! −75` : '−75 Wrong med', 'bad', c.x, c.y - 26);
    say(allergic ? `I'm allergic to that!` : `That's not what I take…`);
  }
}

/* --- 4. Bedside check: verify the 5 Rights --- */
function rightsFor(r){
  const [drug, dose] = splitLabel(r.correct);
  return [
    { icon:'🪪', title:'Right Patient', a:['MAR', r.name], b:['Wristband', r.trap==='patient' ? r.wrongName : r.name], bad: r.trap==='patient' },
    { icon:'💊', title:'Right Drug',    a:['MAR', drug],   b:['Label', drug] },
    { icon:'⚖️', title:'Right Dose',    a:['MAR', dose],   b:['Label', dose] },
    { icon:'👄', title:'Right Route',   a:['Order','PO (by mouth)'], b:['Bedside', r.trap==='route' ? 'NPO – swallow eval' : 'Swallowing OK'], bad: r.trap==='route' },
    { icon:'⏰', title:'Right Time',    a:['Due','Daily 0900'], b:['Last given', r.trap==='time' ? 'Today 0812 · RN Patel' : 'Yesterday 0900'], bad: r.trap==='time' }
  ];
}
function rightsPhase(r){
  phase();
  const img = $('#giveImg'); if (img) img.classList.add('dim');
  let verified = 0, slipped = false;
  setSheet(`<div class="sheet-h"><span>Bedside check · tap each Right</span><b id="rc">0/5</b></div>
    <div class="chips" id="chips"></div>
    <div class="actions"><button class="btn hold" id="hold">🛑 Hold</button><button class="btn green" id="give" disabled>💊 Administer</button></div>`);
  const chips = $('#chips'), rc = $('#rc'), give = $('#give'), hold = $('#hold');
  rightsFor(r).forEach((rt, k) => {
    const c = document.createElement('button'); c.className = 'chip'; c.style.animationDelay = (k*55)+'ms';
    c.innerHTML = `<span class="ic">${rt.icon}</span><span class="tx"><b>${rt.title}</b><span class="cmp"><span><small>${rt.a[0]}</small>${rt.a[1]}</span><span><small>${rt.b[0]}</small>${rt.b[1]}</span></span></span><span class="st"></span>`;
    c.onclick = () => {
      if (c.classList.contains('ok') || c.classList.contains('bad') || !G.active) return;
      const p = elCenter(c);
      if (rt.bad){
        c.classList.add('bad'); slipped = true; sfx.bad(); shake();
        G.streak = 0; renderStreak(); G.stats.slips++; addScore(-50);
        floatText(`−50 That doesn't match!`, 'bad', p.x, p.y - 20);
        hold.classList.add('urge'); say('Wait… is that right?');
      } else {
        c.classList.add('ok'); sfx.scan(); verified++; rc.textContent = verified+'/5';
        if (verified === 5){ give.disabled = false; give.classList.add('ready'); rc.classList.add('okc'); sfx.good(); }
      }
    };
    chips.appendChild(c);
  });
  give.onclick = () => { if (!give.disabled && G.active) administer(r); };
  hold.onclick = () => { if (G.active) holdMed(r, slipped); };
}

/* --- 5a. Administer --- */
function administer(r){
  phase();
  G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak); G.stats.passes++;
  const tb = Math.floor(G.time*1.2), sb = G.streak*20, total = 150 + tb + sb;
  r.status = 'done'; renderPips(); addScore(total);
  const last = G.i === G.list.length-1;
  setSheet(`<div class="sheet-h"><span>Med pass</span><b class="okc">SAFE ✓</b></div>
    <div class="tally">
      <div class="trow" style="animation-delay:.9s"><span>💊 Safe administration</span><b>+150</b></div>
      <div class="trow" style="animation-delay:1.05s"><span>⏱ Time bonus</span><b>+${tb}</b></div>
      <div class="trow" style="animation-delay:1.2s"><span>🔥 Streak ×${G.streak}</span><b>+${sb}</b></div>
      <div class="trow total" style="animation-delay:1.35s"><span>Total</span><b>+${total}</b></div>
    </div>
    <button class="btn big" id="nextBtn">${last ? 'Finish shift 🏁' : 'Next resident ▸'}</button>`);
  const img = $('#giveImg');
  img.classList.remove('dim');
  const hp = imgPt(img, .51, .555, 784, 1168);
  img.style.transformOrigin = `${hp.ex}px ${hp.ey}px`;
  requestAnimationFrame(() => img.classList.add('zoom'));
  sfx.pick();
  const next = () => { G.i++; walkPhase(); };
  after(850, () => {
    sfx.fanfare(); vib(25);
    burst(hp.x, hp.y, 24); banner('SAFE PASS!', 'good', .3);
    floatText('+'+total, 'gold', hp.x, hp.y - 40, 1400);
    renderStreak(true); say(r.thanks);
    if (G.streak >= 3) confetti(24);
  });
  after(900, () => { tapHandler = next; });
  $('#nextBtn').onclick = next;
  after(3200, next);
}

/* --- 5b. Hold & report --- */
function holdMed(r, slipped){
  phase();
  const img = $('#giveImg'); if (img){ img.classList.remove('dim'); img.classList.add('held'); }
  const c = sceneCenter(.55);
  let html;
  if (r.trap){
    const pts = slipped ? 75 : 200;
    if (!slipped){ G.streak++; G.bestStreak = Math.max(G.bestStreak, G.streak); }
    G.stats.catches++; r.status = 'held'; addScore(pts);
    sfx.shield(); vib([20,40,20]);
    banner(slipped ? 'CAUGHT IT' : 'GREAT CATCH!', 'goldb', .55);
    burst(c.x, c.y, 20, ['#fbbf24','#fde68a','#ffffff']);
    floatText('+'+pts, 'gold', c.x, c.y + 56, 1400);
    renderStreak(!slipped); say('Oh my, good catch!');
    html = `<div class="sheet-h"><span>Med held & reported</span><b class="goldc">${TRAPS[r.trap].short.toUpperCase()}</b></div>
      <div class="msg">🛡️ ${TRAPS[r.trap].why(r)}</div>
      <div class="tally"><div class="trow total"><span>${slipped ? 'Caught (after a slip)' : 'Error prevented'}</span><b>+${pts}</b></div></div>`;
  } else {
    G.streak = 0; renderStreak(); G.stats.badHolds++; r.status = 'missed'; addScore(-100);
    sfx.bad(); shake(); banner('DOSE MISSED', 'bad', .55);
    floatText('−100', 'bad', c.x, c.y + 56, 1400); say(`But… where's my pill?`);
    html = `<div class="sheet-h"><span>Unnecessary hold</span><b class="badc">MISSED</b></div>
      <div class="msg">All 5 Rights checked out — ${r.name.split(' ')[0]} ${r.name.split(' ').pop()} missed their 0900 dose.</div>
      <div class="tally"><div class="trow total neg"><span>Missed dose</span><b>−100</b></div></div>`;
  }
  renderPips();
  const last = G.i === G.list.length-1;
  setSheet(html + `<button class="btn big" id="nextBtn">${last ? 'Finish shift 🏁' : 'Next resident ▸'}</button>`);
  const next = () => { G.i++; walkPhase(); };
  $('#nextBtn').onclick = next;
  after(900, () => { tapHandler = next; });
  after(4200, next);
}

/* --- End of shift --- */
function endGame(completed){
  if (!G || G.ended) return;
  G.ended = true; G.active = false; clearInterval(G.clock); phase();
  renderTime(); renderPips(); stage.classList.remove('danger'); hud.classList.remove('danger','warn');
  const S = G.stats, errors = S.wrongPicks + S.slips + S.badHolds;
  const handled = G.list.filter(r => r.status==='done' || r.status==='held').length;
  const stars = completed ? (errors===0 ? 3 : errors<=2 ? 2 : 1) : (handled>=4 ? 1 : 0);
  let prev = 0; try { prev = +(localStorage.getItem('medpassHigh')||0); } catch(e){}
  const best = Math.max(prev, G.score), isBest = G.score > prev && G.score > 0;
  try { localStorage.setItem('medpassHigh', best); } catch(e){}

  let verdict;
  if (!completed) verdict = `⏰ ${G.list.length - G.i} resident${G.list.length-G.i===1?' is':'s are'} still waiting on meds. Hustle down that hall!`;
  else if (stars === 3) verdict = `🏆 Flawless med pass. The charge nurse wants to know your secret.`;
  else if (S.badHolds) verdict = `🤔 ${S.badHolds} unnecessary hold${S.badHolds>1?'s':''} — only hold when a Right doesn't match.`;
  else if (S.slips) verdict = `👀 You tapped a Right that didn't match. Read MAR vs bedside before you verify.`;
  else verdict = `💊 ${S.wrongPicks} wrong pull${S.wrongPicks>1?'s':''} from the cart — check drug <i>and</i> dose.`;

  sceneEl.className = 'scene';
  sceneEl.innerHTML = `<div class="layer kb"><img src="${completed ? IMG.give : IMG.hall}" alt=""></div><div class="layer end-shade"></div>
    <div class="end-title"><div class="et">${completed ? 'SHIFT COMPLETE' : "TIME'S UP!"}</div>
    <div class="stars">${[0,1,2].map(k=>`<span class="${k<stars?'on':''}" style="animation-delay:${.35+k*.25}s">★</span>`).join('')}</div>
    ${isBest ? '<div class="newbest">NEW BEST!</div>' : ''}</div>`;
  setSheet(`<div class="final"><small>FINAL SCORE</small><b id="final">0</b><span>🏆 Best ${best}</span></div>
    <div class="stats">
      <div style="animation-delay:.1s"><b class="okc">${S.passes}</b><span>Safe passes</span></div>
      <div style="animation-delay:.15s"><b class="goldc">${S.catches}</b><span>Errors caught</span></div>
      <div style="animation-delay:.2s"><b class="${errors?'badc':''}">${errors}</b><span>Mistakes</span></div>
      <div style="animation-delay:.25s"><b>${G.bestStreak}</b><span>Best streak</span></div>
    </div>
    <div class="msg">${verdict}</div>
    <div class="actions"><button class="btn ghost" id="share" style="flex:0 0 36%">↗ Share</button><button class="btn big pulse" id="again">↻ Play again</button></div>`);

  if (completed) sfx.fanfare(); else sfx.bad();
  for (let k=0;k<stars;k++) after(350+k*250, () => sfx.star(k));
  if (stars >= 2 || isBest) after(500, () => confetti(70));
  const fin = $('#final'), t0 = performance.now(), to = G.score;
  const f = now => { if (!fin.isConnected) return; const k = Math.min(1,(now-t0)/1200); fin.textContent = Math.round(to*(1-Math.pow(1-k,3))); if (k<1) requestAnimationFrame(f); };
  requestAnimationFrame(f);

  $('#again').onclick = () => { audio(); countdown(); };
  $('#share').onclick = async () => {
    const text = `I scored ${G.score} on MedPass Madness 💊 (${'★'.repeat(stars)||'0★'}) — can you beat it?`;
    try {
      if (navigator.share) await navigator.share({ title:'MedPass Madness', text, url: SHARE_URL });
      else { await navigator.clipboard.writeText(text+' '+SHARE_URL); const p = elCenter($('#share')); floatText('Link copied!', 'good', p.x, p.y-30); }
    } catch(e){}
  };
}

/* ---------- Boot ---------- */
Object.values(IMG).forEach(src => { const i = new Image(); i.src = src; });
renderMute();
showTitle();
</script>
</body>
</html>
